<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DruMaster · Score Print Preview</title>
<style>
:root{color-scheme:light;font-family:Inter,"Segoe UI","Noto Sans JP",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#d9dde2;color:#111827}
.toolbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:#111820;color:white;box-shadow:0 2px 12px #0003}
.toolbar strong{font-size:14px;letter-spacing:.03em}.toolbar select,.toolbar button{font:inherit;border:1px solid #ffffff33;border-radius:7px;background:#202a35;color:#fff;padding:7px 10px}.toolbar button{cursor:pointer}.toolbar .status{margin-left:auto;font-size:12px;color:#b7c3d0}
.viewer{padding:24px 12px 48px;display:flex;flex-direction:column;align-items:center;gap:20px}
.page{width:210mm;height:297mm;background:white;box-shadow:0 4px 18px #0003;padding:14mm 12mm 12mm;position:relative;overflow:hidden}
.page-header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid #c7cdd4;padding-bottom:3mm;margin-bottom:5mm}
.title{font-size:18pt;font-weight:800;letter-spacing:.01em}.artist{font-size:9pt;color:#5d6672;margin-top:1mm}.page-no{font-size:8pt;color:#7c8693}
.systems{display:flex;flex-direction:column;gap:6.2mm}.system{position:relative}.system-meta{height:5mm;display:flex;align-items:flex-end;gap:8px;font-size:7.7pt;color:#4c5663;margin-bottom:1mm}.measure-range{margin-left:auto;color:#717b88}.chart{width:100%;height:28mm;display:block;border:1px solid #9aa5b2;background:#fff}
.legend{position:absolute;left:12mm;bottom:5.5mm;font-size:6.5pt;color:#6b7580;display:flex;gap:4mm}.legend i{display:inline-block;width:7px;height:7px;border-radius:1px;margin-right:2px;vertical-align:-.5px}
.error{padding:20px;background:white;border-radius:10px;max-width:780px;box-shadow:0 2px 12px #0002;color:#9b1c1c}
@media print{
 @page{size:A4 portrait;margin:0}
 body{background:#fff}.toolbar{display:none}.viewer{padding:0;gap:0}.page{box-shadow:none;page-break-after:always;margin:0}.page:last-child{page-break-after:auto}
}
</style>
</head>
<body>
<div class="toolbar">
  <strong>DruMaster · A4 SCORE PREVIEW</strong>
  <select id="song"></select>
  <button id="reload">再描画</button>
  <button id="print">PDF / 印刷</button>
  <span class="status" id="status">読み込み中…</span>
</div>
<main class="viewer" id="viewer"></main>
<script>
"use strict";
const MIDI_MAP={35:"kick",36:"kick",38:"snare",40:"snare",41:"floorTom",43:"floorTom",45:"midTom",47:"midTom",48:"midTom",50:"highTom",42:"hhClosed",44:"hhPedal",46:"hhOpen",49:"crash",52:"crash",55:"crash",57:"crash2",51:"ride",53:"ride",59:"ride"};
const GROUP={kick:"kick",snare:"drums",floorTom:"drums",midTom:"drums",highTom:"drums",hhClosed:"hh",hhPedal:"hh",hhOpen:"hh",ride:"hh",crash:"cymbal",crash2:"cymbal",special:"hh"};
const LANE={cymbal:0,hh:1,drums:2,kick:3};
const COLORS={snare:"#df174f",highTom:"#a83ad4",midTom:"#6552de",floorTom:"#0877d4",ride:"#1f9c36",hhPedal:"#079c8d",cymbal:"#d59d00",hh:"#079c8d",kick:"#68788b",other:"#66717e"};
const $=s=>document.querySelector(s),viewer=$("#viewer"),songSel=$("#song"),statusEl=$("#status");
let registry={},currentDrawItems=[];
const midiCache=new Map();
function color(type,group){return COLORS[type]||COLORS[group]||COLORS.other}
function visual(type){return type==="hhOpen"?{kind:"double",bar:2,gap:1,total:5}:{kind:"single",bar:4,gap:0,total:4}}
function readMidi(ab){
 const d=new DataView(ab);let p=0;const str=n=>{let s="";while(n--)s+=String.fromCharCode(d.getUint8(p++));return s},u32=()=>{const v=d.getUint32(p);p+=4;return v},u16=()=>{const v=d.getUint16(p);p+=2;return v},vlq=()=>{let v=0,b;do{b=d.getUint8(p++);v=(v<<7)|(b&127)}while(b&128);return v};
 if(str(4)!=="MThd")throw Error("MIDI header error");const hl=u32();u16();const tracks=u16(),division=u16();p+=hl-6;const notes=[],tempos=[],sigs=[];
 for(let t=0;t<tracks;t++){if(str(4)!=="MTrk")throw Error("MIDI track error");const len=u32(),end=p+len;let tick=0,rs=0;while(p<end){tick+=vlq();const f=d.getUint8(p++);let st;if(f<128){if(!rs)throw Error("MIDI running status error");st=rs;p--}else{st=f;if(st<240)rs=st}if(st===255){const type=d.getUint8(p++),n=vlq();if(type===81&&n===3)tempos.push({tick,us:(d.getUint8(p)<<16)|(d.getUint8(p+1)<<8)|d.getUint8(p+2)});else if(type===88&&n>=2)sigs.push({tick,num:d.getUint8(p),den:2**d.getUint8(p+1)});p+=n}else if(st===240||st===247){rs=0;p+=vlq()}else{const hi=st&240,ch=st&15;if(hi===144||hi===128){const note=d.getUint8(p++),velocity=d.getUint8(p++);if(hi===144&&velocity>0&&ch===9)notes.push({tick,note,velocity,type:MIDI_MAP[note]||"special"})}else p+=(hi===192||hi===208)?1:2}}p=end}
 tempos.sort((a,b)=>a.tick-b.tick);sigs.sort((a,b)=>a.tick-b.tick);const dedupe=a=>a.filter((e,i)=>i===a.length-1||a[i+1].tick!==e.tick);const tt=dedupe(tempos),ss=dedupe(sigs);if(!tt.length||tt[0].tick>0)tt.unshift({tick:0,us:500000});if(!ss.length||ss[0].tick>0)ss.unshift({tick:0,num:4,den:4});
 return {division,notes:notes.sort((a,b)=>a.tick-b.tick||a.note-b.note),tempos:tt,sigs:ss};
}
function buildMeasures(m){
 const events=[];for(const s of m.sigs)events.push({tick:s.tick,kind:"sig",...s});for(const t of m.tempos)events.push({tick:t.tick,kind:"tempo",...t});events.sort((a,b)=>a.tick-b.tick||(a.kind==="sig"?-1:1));
 const maxTick=Math.max(m.notes.at(-1)?.tick||0,...events.map(e=>e.tick));let sigIndex=0,tempoIndex=0,sig=m.sigs[0],tempo=m.tempos[0],tick=0,no=1;const out=[];
 while(tick<=maxTick+m.division){while(sigIndex+1<m.sigs.length&&m.sigs[sigIndex+1].tick<=tick){sig=m.sigs[++sigIndex]}while(tempoIndex+1<m.tempos.length&&m.tempos[tempoIndex+1].tick<=tick){tempo=m.tempos[++tempoIndex]}const beats=sig.num*4/sig.den,end=tick+beats*m.division;out.push({no,start:tick,end,num:sig.num,den:sig.den,bpm:60000000/tempo.us,changeSig:m.sigs.some(x=>x.tick===tick),changeTempo:m.tempos.some(x=>x.tick===tick)});tick=end;no++;
 }
 return out;
}
function makeSystems(measures){
 const systems=[];let cur=[];for(const measure of measures){const boundary=(measure.changeSig||measure.changeTempo)&&cur.length>0;if(boundary||cur.length>=4){systems.push(cur);cur=[]}cur.push(measure)}if(cur.length)systems.push(cur);return systems;
}
function noteOffsets(notes){const map=new Map();for(const n of notes){if(n.type==="hhPedal")continue;const g=GROUP[n.type],lane=LANE[g],key=`${n.tick}|${lane}`;if(!map.has(key))map.set(key,[]);map.get(key).push(n)}const off=new Map();for(const bucket of map.values()){bucket.sort((a,b)=>a.note-b.note);let x=0;for(const n of bucket){off.set(n,x);x+=visual(n.type).total}}return off}
function drawSystem(canvas,midi,measures){
 const dpr=Math.max(1,window.devicePixelRatio||1),rect=canvas.getBoundingClientRect(),cssW=rect.width,cssH=rect.height;if(cssW<1||cssH<1)return false;const w=Math.round(cssW*dpr),h=Math.round(cssH*dpr);canvas.width=w;canvas.height=h;const ctx=canvas.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);const W=cssW,H=cssH,laneH=H/4,start=measures[0].start,end=measures.at(-1).end,total=end-start;
 ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);ctx.strokeStyle="#aeb7c1";ctx.lineWidth=1;for(let i=1;i<4;i++){const y=Math.round(laneH*i)+.5;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 const labels=["CYMBAL","HI-HAT / RIDE","SNARE / TOMS","KICK · AUTO"];ctx.font="700 8px system-ui";ctx.textBaseline="top";for(let i=0;i<4;i++){ctx.fillStyle="#76808c";ctx.fillText(labels[i],5,i*laneH+4)}
 for(const m of measures){const x=(m.start-start)/total*W;ctx.strokeStyle="#778391";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(Math.round(x)+.5,0);ctx.lineTo(Math.round(x)+.5,H);ctx.stroke();ctx.fillStyle="#5f6975";ctx.font="700 7px system-ui";ctx.fillText(String(m.no),x+3,H-10)}ctx.beginPath();ctx.moveTo(W-.5,0);ctx.lineTo(W-.5,H);ctx.stroke();
 const visible=midi.notes.filter(n=>n.tick>=start&&n.tick<end&&n.type!=="hhPedal"),offsets=noteOffsets(visible);for(const n of visible){const g=GROUP[n.type],lane=LANE[g],x=(n.tick-start)/total*W+(offsets.get(n)||0),v=visual(n.type),alpha=n.type==="kick"?.42+.35*n.velocity/127:.58+.42*n.velocity/127;ctx.globalAlpha=alpha;ctx.fillStyle=color(n.type,g);const y=lane*laneH;if(v.kind==="double"){const l=x-v.total/2;ctx.fillRect(l,y,v.bar,laneH);ctx.fillRect(l+v.bar+v.gap,y,v.bar,laneH)}else ctx.fillRect(x-v.total/2,y,v.bar,laneH)}ctx.globalAlpha=1;return true;
}
function makePage(meta,pageIndex,pageCount){const page=document.createElement("section");page.className="page";page.innerHTML=`<header class="page-header"><div><div class="title">${meta.title}</div><div class="artist">${meta.artist||""}</div></div><div class="page-no">${pageIndex+1} / ${pageCount}</div></header><div class="systems"></div><div class="legend"><span><i style="background:#d59d00"></i>CYMBAL</span><span><i style="background:#079c8d"></i>HH/RIDE</span><span><i style="background:#df174f"></i>SNARE</span><span><i style="background:#68788b"></i>KICK</span></div>`;return page}
async function getMidi(id,meta){
 if(midiCache.has(id))return midiCache.get(id);
 const path=(meta.midi||`songs/${id}/chart.mid`).replace(/^[.\/]*/,"");
 const promise=fetch(path).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.arrayBuffer()}).then(readMidi).catch(e=>{midiCache.delete(id);throw e});
 midiCache.set(id,promise);return promise;
}
function redrawOnly(){for(const item of currentDrawItems)drawSystem(item.canvas,item.midi,item.sys)}
async function render(){
 const id=songSel.value,meta=registry[id];if(!meta)return;statusEl.textContent="MIDI読み込み中…";viewer.innerHTML="";currentDrawItems=[];try{const midi=await getMidi(id,meta),measures=buildMeasures(midi),systems=makeSystems(measures),perPage=6,pageCount=Math.ceil(systems.length/perPage),pending=[];for(let p=0;p<pageCount;p++){const page=makePage(meta,p,pageCount),host=page.querySelector(".systems");for(const sys of systems.slice(p*perPage,p*perPage+perPage)){const s=document.createElement("div");s.className="system";const first=sys[0],tempo=first.bpm.toFixed(Math.abs(first.bpm-Math.round(first.bpm))<.005?0:2);s.innerHTML=`<div class="system-meta"><b>${first.num}/${first.den}</b><span>♩ = ${tempo}</span><span class="measure-range">MEASURE ${first.no}${sys.length>1?`–${sys.at(-1).no}`:""}</span></div><canvas class="chart"></canvas>`;host.appendChild(s);pending.push({canvas:s.querySelector("canvas"),midi,sys})}viewer.appendChild(page)}await new Promise(requestAnimationFrame);currentDrawItems=pending;redrawOnly();statusEl.textContent=`${meta.title} · ${midi.notes.length.toLocaleString()} notes · ${measures.length} measures · ${pageCount} pages`;}catch(e){console.error(e);viewer.innerHTML=`<div class="error">譜面を読み込めませんでした：${e.message}</div>`;statusEl.textContent="読み込み失敗"}
}
async function init(){registry=await fetch("songs/registry.json").then(r=>{if(!r.ok)throw Error(`registry HTTP ${r.status}`);return r.json()});const songs=Object.values(registry).filter(x=>x.state==="published"||x.midi).sort((a,b)=>(a.order??999)-(b.order??999)||a.title.localeCompare(b.title,"ja"));for(const s of songs){const o=document.createElement("option");o.value=s.id;o.textContent=`${s.title} — ${s.artist||""}`;songSel.appendChild(o)}songSel.value=songs[0]?.id||"";await render()}
songSel.addEventListener("change",render);$("#reload").addEventListener("click",redrawOnly);$("#print").addEventListener("click",()=>window.print());window.addEventListener("resize",()=>{clearTimeout(window.__scoreResize);window.__scoreResize=setTimeout(redrawOnly,120)});init();
</script>
</body>
</html>
