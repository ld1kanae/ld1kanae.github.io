<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070b11">
<title>DruMaster Result Viewer</title>
<link rel="stylesheet" href="css/result-layout-preview.css?v=20260902-fit1">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Inter,system-ui,sans-serif}.viewer-root{position:fixed;inset:0;background:#000;overflow:hidden}.rotator{position:absolute;left:0;top:0;width:100dvw;height:100dvh;overflow:hidden}.canvas-wrap{position:absolute;left:0;top:0;width:844px;height:390px;transform-origin:0 0}.viewer-toolbar{position:fixed;z-index:20;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:5px;border:1px solid rgba(130,151,174,.38);border-radius:999px;background:rgba(5,9,14,.78);backdrop-filter:blur(8px)}.viewer-toolbar button{border:0;border-radius:999px;padding:8px 12px;background:transparent;color:#bac6d3;font:700 11px/1 system-ui,sans-serif;letter-spacing:.06em}.viewer-toolbar button.active{background:#dcecff;color:#07111c}.error{position:fixed;inset:0;display:none;place-items:center;padding:24px;color:#d9e6f2;background:#070b11;text-align:center;z-index:30}.error.show{display:grid}
@media (orientation:portrait){.rotator{width:100dvh;height:100dvw;transform-origin:0 0;transform:translateY(100dvh) rotate(-90deg)}}
</style>
</head>
<body>
<div class="viewer-root"><div class="rotator" id="rotator"><div class="canvas-wrap" id="canvasWrap"><div class="rl-canvas" id="canvas"></div></div></div></div>
<div class="viewer-toolbar" id="toolbar"><button data-screen="normal">NORMAL</button><button data-screen="auto">AUTO PLAY</button></div>
<div class="error" id="error">ビューワデータを読み込めませんでした。エディタの「COPY VIEWER URL」から開き直してください。</div>
<script src="js/result-layout-shared.js?v=20260902-centerlock2"></script>
<script>
(()=>{'use strict';const M=globalThis.DruMasterResultLayout,$=id=>document.getElementById(id),canvas=$('canvas'),wrap=$('canvasWrap'),rotator=$('rotator'),toolbar=$('toolbar'),error=$('error');let screen=new URLSearchParams(location.search).get('screen')==='auto'?'auto':'normal',mobile=null;function decode(){try{let s=new URLSearchParams(location.search).get('d');if(!s)return M.clone(M.base.mobile);s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const raw=JSON.parse(atob(s));const all=M.normalizeData({pc:M.base.pc,mobile:raw.mobile||raw});return all.mobile}catch{return null}}mobile=decode();if(!mobile){error.classList.add('show');return}M.lockMobileCenters({mobile});function render(){canvas.innerHTML='';if(screen==='normal')canvas.insertAdjacentHTML('beforeend','<i class="rl-guide v mid" style="opacity:.18"></i>');for(const [key,def] of Object.entries(M.defs[screen]))canvas.appendChild(M.makeElement(key,def,M.obj(mobile[screen][key]),false));const mode=document.createElement('div');mode.className='rl-mode-switch';mode.innerHTML=`<span data-screen="normal" class="${screen==='normal'?'on':''}">NORMAL</span><span data-screen="auto" class="${screen==='auto'?'on':''}">AUTO PLAY</span>`;canvas.appendChild(mode);toolbar.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.screen===screen));fit()}function fit(){const aw=rotator.clientWidth,ah=rotator.clientHeight,s=Math.min(aw/844,ah/390),x=(aw-844*s)/2,y=(ah-390*s)/2;wrap.style.left=x+'px';wrap.style.top=y+'px';wrap.style.transform=`scale(${s})`}function setScreen(next){if(next!=='normal'&&next!=='auto')return;screen=next;render()}toolbar.onclick=e=>{const b=e.target.closest('button');if(b)setScreen(b.dataset.screen)};canvas.onclick=e=>{const b=e.target.closest('.rl-mode-switch [data-screen]');if(b)setScreen(b.dataset.screen)};addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,80));visualViewport?.addEventListener('resize',fit);render();})();
</script>
</body>
</html>
