<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070b11">
<title>DruMaster Content Tool</title>
<style>
:root{color-scheme:dark;--bg:#070b11;--line:#263747;--text:#eaf2f9;--muted:#7e91a4;--accent:#63c3ff;--panel:#0d141d}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:var(--bg);color:var(--text);font:13px/1.4 Inter,"Noto Sans JP",system-ui,sans-serif;overflow:hidden}
.toolbar{height:52px;display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:#090f16;padding:0 14px;gap:4px}
.tab{position:relative;min-width:150px;border:0;background:transparent;color:#91a2b4;font:700 12px/52px Inter,"Noto Sans JP",system-ui,sans-serif;letter-spacing:.04em;padding:0 18px;cursor:pointer;text-align:left}
.tab::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;background:transparent}
.tab.active{color:#eef7ff}.tab.active::after{background:var(--accent)}
.tab:disabled{color:#4d5a67;cursor:not-allowed}.tab-state{margin-left:8px;font-size:9px;font-weight:800;letter-spacing:.08em;color:#6f8295}.tab.active .tab-state{color:#86d7ff}.tab.ready .tab-state{color:#70d6a7}
.spacer{flex:1}.status{display:flex;align-items:center;color:#6f8295;font-size:10px;white-space:nowrap;padding:0 8px}
.views{position:relative;width:100%;height:calc(100% - 52px)}.view{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}.view.active{display:block}
@media(max-width:560px){.toolbar{padding:0 6px}.tab{min-width:0;flex:1;padding:0 10px}.tab::after{left:8px;right:8px}.status{display:none}}
</style>
</head>
<body>
<nav class="toolbar" role="tablist" aria-label="楽曲制作ツール">
<button id="registerTab" class="tab active" type="button" role="tab" aria-selected="true" aria-controls="registerView">楽曲登録 <span class="tab-state">INPUT</span></button>
<button id="editorTab" class="tab" type="button" role="tab" aria-selected="false" aria-controls="editorView" disabled>タイミング編集 <span class="tab-state">LOCKED</span></button>
<div class="spacer"></div><div id="shellStatus" class="status">素材を登録すると編集タブが有効になります</div>
</nav>
<div class="views">
<iframe id="registerView" class="view active" title="楽曲登録" src="song-publisher-form.html?v=20260828-tabs1"></iframe>
<iframe id="editorView" class="view" title="タイミング編集" src="about:blank"></iframe>
</div>
<script>
(()=>{
"use strict";
const registerTab=document.getElementById("registerTab"),editorTab=document.getElementById("editorTab"),registerView=document.getElementById("registerView"),editorView=document.getElementById("editorView"),status=document.getElementById("shellStatus");
let editorReady=false,currentSession=null;
function show(which){
  if(which==="editor"&&!editorReady)return;
  const editor=which==="editor";
  registerTab.classList.toggle("active",!editor);editorTab.classList.toggle("active",editor);
  registerTab.setAttribute("aria-selected",String(!editor));editorTab.setAttribute("aria-selected",String(editor));
  registerView.classList.toggle("active",!editor);editorView.classList.toggle("active",editor);
}
registerTab.addEventListener("click",()=>show("register"));
editorTab.addEventListener("click",()=>show("editor"));
addEventListener("message",e=>{
  if(e.origin!==location.origin||e.source!==registerView.contentWindow)return;
  const d=e.data;if(!d||d.type!=="dm-song-editor-ready"||!d.id||!d.sessionId)return;
  currentSession=d;editorReady=true;editorTab.disabled=false;editorTab.classList.add("ready");editorTab.querySelector(".tab-state").textContent="READY";
  status.textContent=`${d.id} · 編集可能 / 素材アップロードはバックグラウンドで継続`;
  try{editorView.contentWindow.name=JSON.stringify({dmSongPublisher:{token:d.token,repo:d.repo,branch:d.branch,id:d.id,sessionId:d.sessionId,at:d.at||Date.now()}})}catch{}
  editorView.src=`song-sync-editor.html?song=${encodeURIComponent(d.id)}&session=${encodeURIComponent(d.sessionId)}&embedded=1`;
  show("editor");
});
})();
</script>
</body>
</html>
