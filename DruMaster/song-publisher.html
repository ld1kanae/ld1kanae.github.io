<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070b11">
<title>DruMaster Content Tool</title>
<style>
:root{color-scheme:dark;--bg:#070b11;--line:#263747;--text:#eaf2f9;--muted:#7e91a4;--accent:#63c3ff}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:var(--bg);color:var(--text);font:13px/1.4 Inter,"Noto Sans JP",system-ui,sans-serif;overflow:hidden}
.toolbar{height:60px;width:100%;display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:#090f16;padding:0;gap:0}
.tab{position:relative;flex:1 1 0;min-width:0;border:0;border-right:1px solid rgba(57,76,92,.45);background:transparent;color:#91a2b4;font:750 14px/60px Inter,"Noto Sans JP",system-ui,sans-serif;letter-spacing:.035em;padding:0 10px;cursor:pointer;text-align:center;transition:color .18s ease,background .18s ease,filter .18s ease}
.tab:last-child{border-right:0}.tab::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:transparent;opacity:.9}
.tab.active{color:#f4fbff;background:linear-gradient(337.5deg,rgba(215,89,168,.23) 0%,rgba(191,188,75,.18) 27%,rgba(71,201,190,.20) 52%,rgba(64,149,207,.23) 70%,rgba(194,92,197,.22) 100%);background-size:170% 170%;animation:dmTabSpectrum 8s ease-in-out infinite;box-shadow:inset 0 1px 0 rgba(220,239,250,.10),inset 0 -12px 30px rgba(68,164,212,.07)}
.tab.active::after{background:linear-gradient(90deg,#d759a8,#bfbc4b,#47c9be,#4095cf,#c25cc5)}
.tab:not(:disabled):not(.active):hover{color:#e5f1f8;background:linear-gradient(337.5deg,rgba(215,89,168,.09),rgba(71,201,190,.08),rgba(64,149,207,.10),rgba(194,92,197,.09))}
.tab:disabled{color:#465361;cursor:not-allowed;background:rgba(255,255,255,.012)}
.tab.locked{color:#465361;cursor:pointer;background:rgba(255,255,255,.012)}
.tab.locked:hover{color:#596a7b;background:rgba(255,255,255,.025)}
.tab-state{margin-left:10px;font-size:9px;font-weight:850;letter-spacing:.09em;color:#657789;vertical-align:1px}.tab.active .tab-state{color:#d6f3ff}.tab.ready .tab-state{color:#77dbac}
.views{position:relative;width:100%;height:calc(100% - 60px)}.view{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}.view.active{display:block}
@keyframes dmTabSpectrum{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@media(max-width:620px){.toolbar{height:56px}.tab{font-size:12px;line-height:56px;padding:0 4px}.tab-state{display:none}.views{height:calc(100% - 56px)}}
</style>
</head>
<body>
<nav class="toolbar" role="tablist" aria-label="楽曲制作ツール">
<button id="registerTab" class="tab active" type="button" role="tab" aria-selected="true" aria-controls="registerView">楽曲登録 <span class="tab-state">INPUT</span></button>
<button id="editorTab" class="tab locked" type="button" role="tab" aria-selected="false" aria-controls="editorView" aria-disabled="true">タイミング編集 <span class="tab-state">LOCKED</span></button>
<button id="volumeTab" class="tab locked" type="button" role="tab" aria-selected="false" aria-controls="volumeView" aria-disabled="true">音量バランス <span class="tab-state">LOCKED</span></button>
</nav>
<div class="views">
<iframe id="registerView" class="view active" title="楽曲登録" src="song-publisher-form.html?v=20260902-updateoptional1"></iframe>
<iframe id="editorView" class="view" title="タイミング編集" src="about:blank"></iframe>
<iframe id="volumeView" class="view" title="音量バランス調整" src="about:blank"></iframe>
</div>
<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id),registerTab=$("registerTab"),editorTab=$("editorTab"),volumeTab=$("volumeTab"),registerView=$("registerView"),editorView=$("editorView"),volumeView=$("volumeView");
let editorReady=false,currentSession=null,registerModeObserver=null;
const tabs={register:registerTab,editor:editorTab,volume:volumeTab},views={register:registerView,editor:editorView,volume:volumeView};
function show(which){
  if(which!=="register"&&!editorReady)return;
  for(const [key,tab] of Object.entries(tabs)){const active=key===which;tab.classList.toggle("active",active);tab.setAttribute("aria-selected",String(active));views[key].classList.toggle("active",active)}
}
registerTab.addEventListener("click",()=>show("register"));editorTab.addEventListener("click",()=>show("editor"));volumeTab.addEventListener("click",()=>show("volume"));
function syncMidiRequirement(doc){
  const midi=doc?.getElementById("midi"),badge=midi?.closest(".file-row")?.querySelector("i");if(!badge)return;
  const updating=doc.body?.classList.contains("dm-publisher-update");
  badge.textContent=updating?"任意":"必須";
  badge.classList.toggle("req",!updating);badge.classList.toggle("optional",updating);
}
function tuneRegisterForm(){
  let doc;try{doc=registerView.contentDocument}catch{return}if(!doc?.head)return;
  if(!doc.getElementById("dmRegisterShellTune")){
    const style=doc.createElement("style");style.id="dmRegisterShellTune";style.textContent=`
      main{width:min(600px,calc(100% - 28px))!important;margin:30px auto 64px!important}
      header{display:block!important;text-align:center!important;margin-bottom:22px!important}
      header .badge{display:inline-block!important;margin-top:12px!important}
      h1{font-size:32px!important;text-align:center!important}
      .sub{text-align:center!important}
      .grid{display:flex!important;flex-direction:column!important;gap:16px!important}
      .panel,.panel.full{width:100%!important;grid-column:auto!important}
      .panel h2{text-align:center!important;font-size:16px!important;letter-spacing:.12em!important;margin-bottom:16px!important}
      .fields{grid-template-columns:1fr!important}
      .field.full{grid-column:auto!important}
      .req,.optional{font-size:8px!important;font-weight:700!important;letter-spacing:.02em!important}
      .file-row{grid-template-columns:150px minmax(0,1fr)!important;gap:14px!important}
      .file-row small{display:none!important}
      input[type=file]{direction:rtl!important;text-align:right!important}
      input[type=file]::file-selector-button{margin-left:10px!important;margin-right:0!important}
      .publish{width:100%!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:12px!important;margin-top:22px!important}
      .publish button{min-width:190px!important;height:46px!important;font-size:14px!important}
      .progress-shell{width:100%!important;min-width:0!important}
      #log{text-align:center!important;min-height:44px!important}
      .token-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:0 0 14px}
      .token-link{display:inline-flex;align-items:center;justify-content:center;width:190px;min-height:38px;padding:0 16px;border:1px solid #406784;border-radius:8px;background:#0b1c29;color:#dff4ff;text-decoration:none;font-weight:750;font-size:11px}
      .token-link:hover{border-color:#63c3ff;background:#10283a}
      .token-howto{margin-top:12px;border-top:1px solid #263746;padding-top:10px;color:#8fa1b4;font-size:10px}
      .token-howto summary{cursor:pointer;text-align:center;color:#aabacd;font-weight:700}
      .token-howto ol{margin:10px 0 0;padding-left:20px;line-height:1.7}
      @media(max-width:640px){main{width:min(100% - 18px,600px)!important}.file-row{grid-template-columns:1fr!important}input[type=file]{width:100%!important}}
    `;doc.head.appendChild(style);
    const grid=doc.querySelector(".grid"),panels=[...doc.querySelectorAll(".panel")],github=panels.find(p=>p.querySelector("h2")?.textContent.trim()==="GITHUB");if(grid&&github)grid.appendChild(github);
    doc.querySelectorAll(".file-row small").forEach(n=>n.remove());
    doc.querySelectorAll("p.help").forEach(p=>{const t=p.textContent.trim();if(t.startsWith("内部IDは")||t.startsWith("原曲またはオフボーカル"))p.remove()});
    if(github){
      const help=github.querySelector("p.help");if(help)help.remove();
      const fields=github.querySelector(".fields");
      if(fields&&!github.querySelector(".token-actions")){
        const actions=doc.createElement("div");actions.className="token-actions";actions.innerHTML='<a class="token-link" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHubでTokenを作成</a><a class="token-link" href="https://github.com/settings/personal-access-tokens" target="_blank" rel="noopener">Token一覧を開く</a>';
        github.insertBefore(actions,fields);
        const details=doc.createElement("details");details.className="token-howto";details.innerHTML='<summary>Fine-grained Personal Access Tokenの作成方法</summary><ol><li>Token nameと有効期限を設定します。</li><li>Repository accessで「Only select repositories」を選び、ld1kanae.github.ioを指定します。</li><li>Permissions欄の右上にある「＋ Add permissions」を押します。</li><li>「Repository permissions」から「Contents」を選んで追加します。</li><li>追加されたContentsの権限を「Read and write」に変更します。</li><li>画面下の「Generate token」を押し、表示された github_pat_… を上の入力欄へ貼り付けます。</li></ol>';
        fields.insertAdjacentElement("afterend",details);
      }
    }
    const publish=doc.getElementById("publish"),log=doc.getElementById("log");if(publish)publish.textContent="PUBLISH";if(log&&log.textContent.includes("一次PUBLISH"))log.textContent="タイミングエディタに移動します。";
  }
  syncMidiRequirement(doc);
  registerModeObserver?.disconnect();
  registerModeObserver=new MutationObserver(()=>syncMidiRequirement(doc));
  if(doc.body)registerModeObserver.observe(doc.body,{attributes:true,attributeFilter:["class"]});
  if(doc.documentElement?.dataset.dmMidiRequirementBound!=="1"){
    doc.documentElement.dataset.dmMidiRequirementBound="1";
    doc.addEventListener("click",e=>{if(e.target?.closest?.(".dm-mode-switch")){setTimeout(()=>syncMidiRequirement(doc),0);setTimeout(()=>syncMidiRequirement(doc),100)}},true);
  }
}
registerView.addEventListener("load",()=>{registerModeObserver?.disconnect();registerModeObserver=null;tuneRegisterForm()});setTimeout(tuneRegisterForm,250);
addEventListener("message",e=>{
  if(e.origin!==location.origin||e.source!==registerView.contentWindow)return;
  const d=e.data;if(!d||d.type!=="dm-song-editor-ready"||!d.id||!d.sessionId)return;
  currentSession=d;editorReady=true;
  for(const tab of [editorTab,volumeTab]){tab.disabled=false;tab.classList.remove("locked");tab.setAttribute("aria-disabled","false");tab.classList.add("ready");tab.querySelector(".tab-state").textContent="READY"}
  const inherited={dmSongPublisher:{token:d.token,repo:d.repo,branch:d.branch,id:d.id,sessionId:d.sessionId,at:d.at||Date.now()}};
  try{editorView.contentWindow.name=JSON.stringify(inherited)}catch{}try{volumeView.contentWindow.name=JSON.stringify(inherited)}catch{}
  if(d.mode!=="update"){
    editorView.src=`song-sync-editor.html?song=${encodeURIComponent(d.id)}&session=${encodeURIComponent(d.sessionId)}&embedded=1&v=20260830-midibounds3`;
    show("editor");
  }
});
})();
</script>
<script src="js/song-publisher-token-memory.js?v=20260829-inputfix1"></script>
<script src="js/song-publisher-draft-catalog.js?v=20260902-midiupload2" data-dm-draft-catalog="1"></script>
<script src="js/song-publisher-update-mode.js?v=20260902-updatefix2"></script>
<script src="js/song-publisher-update-file-ui.js?v=20260902-orderfix1"></script>
<script src="js/song-publisher-midi-publication-guard.js?v=20260905-immutable1"></script>
<script src="js/song-publisher-update-history.js?v=20260904-history2"></script>
<script src="js/song-publisher-update-history-copy.js?v=20260905-copy1"></script>
<script src="js/song-publisher-update-isolation.js?v=20260902-isolation1"></script>
<script src="js/song-publisher-update-bridge.js?v=20260904-mididirect1"></script>
<script src="js/song-publisher-existing-editor.js?v=20260830-midibounds3"></script>
<script src="js/song-publisher-debug-unlock.js?v=20260828-debugunlock3"></script>
</body>
</html>
