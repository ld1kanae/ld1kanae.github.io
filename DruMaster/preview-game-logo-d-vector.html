<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DruMaster gameplay D vector test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111e;color:#eef4fb;font-family:Arial,"Noto Sans JP",sans-serif}body{padding:24px;background:radial-gradient(circle at 28% 20%,rgba(74,171,232,.12),transparent 28%),radial-gradient(circle at 78% 80%,rgba(153,94,218,.10),transparent 30%),#07111e}h1{font-size:20px;margin:0 0 8px}p{margin:0 0 20px;color:#9dabbc;font-size:13px;line-height:1.6}.grid{display:grid;gap:20px;grid-template-columns:1fr 1fr}.card{border:1px solid #22364c;border-radius:16px;background:rgba(8,17,30,.72);padding:16px}.label{font-size:12px;color:#8e9aae;margin-bottom:10px}.hud{height:78px;border-radius:12px;background:linear-gradient(180deg,#07101c,#050b14);display:flex;align-items:center;padding:0 18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}.dmark.pc{width:41px;height:46px;margin:0 18px 0 6px;flex:none}.dmark.mobile{width:25px;height:28px;margin:0 7px 0 3px;flex:none}.dmark img{display:block;width:100%;height:100%;object-fit:contain}.song{display:flex;flex-direction:column;gap:2px;min-width:0}.song b{font-size:15px}.song small{font-size:10px;color:#8996a8}.score{margin-left:auto;text-align:right}.score small{display:block;font-size:8px;color:#7f8c9d}.score strong{font-size:16px;letter-spacing:.06em}.pause{width:34px;height:34px;border:1px solid #718195;border-radius:50%;margin-left:18px;display:grid;place-items:center;color:white;font-size:12px}.standalone{display:flex;align-items:center;justify-content:center;min-height:180px;background:#050b14;border-radius:12px}.standalone img{width:130px;height:145px;object-fit:contain}.note{font-size:12px;color:#8190a4;margin-top:10px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>Gameplay D mark — vector test</h1>
<p>今回のDruMaster純ベクターから最初の「D」を白1色にしたテストです。輪郭・内部の2つの丸に加え、元SVGで手作業した細い縦スリットも同じ位置関係でベクターパスの抜きとして復元しています。</p>
<div class="grid">
  <section class="card">
    <div class="label">PC相当 / 現行HUDサイズ 41×46px</div>
    <div class="hud"><div class="dmark pc"><img src="assets/DruMaster-D-white.svg?v=20260828-slit1" alt=""></div><div class="song"><b>なないろ</b><small>BUMP OF CHICKEN</small></div><div class="score"><small>SCORE</small><strong>000000</strong></div><div class="pause">Ⅱ</div></div>
    <div class="note">既存のDマーク配置寸法に合わせています。</div>
  </section>
  <section class="card">
    <div class="label">スマホ相当 / 現行HUDサイズ 25×28px</div>
    <div class="hud"><div class="dmark mobile"><img src="assets/DruMaster-D-white.svg?v=20260828-slit1" alt=""></div><div class="song"><b>なないろ</b><small>BUMP OF CHICKEN</small></div><div class="score"><small>SCORE</small><strong>000000</strong></div><div class="pause">Ⅱ</div></div>
    <div class="note">スマホ用の現在の枠サイズで表示しています。</div>
  </section>
  <section class="card" style="grid-column:1/-1">
    <div class="label">形状確認用・拡大</div>
    <div class="standalone"><img src="assets/DruMaster-D-white.svg?v=20260828-slit1" alt="D vector"></div>
  </section>
</div>
</body>
</html>
