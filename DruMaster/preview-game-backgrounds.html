<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DruMaster Gameplay Background Lab</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#05080d;color:#eef5fc;font-family:Inter,"Noto Sans JP",system-ui,sans-serif}
body{overflow:auto}
.toolbar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;background:rgba(4,8,14,.9);border-bottom:1px solid rgba(150,180,205,.14);backdrop-filter:blur(14px)}
.toolbar b{font-size:11px;letter-spacing:.12em;color:#91a4b8;margin-right:4px}
.mode{border:1px solid rgba(144,173,198,.26);border-radius:999px;background:#0c1420;color:#94a7ba;padding:8px 11px;font:800 10px/1 system-ui;letter-spacing:.06em;cursor:pointer}.mode.active{color:#fff;background:#172538;border-color:rgba(190,220,242,.58);box-shadow:0 0 14px rgba(111,205,255,.14)}
.note{margin-left:auto;max-width:520px;font-size:10px;line-height:1.45;color:#8294a8}
.stage-wrap{display:grid;place-items:center;padding:24px 12px 40px}
.stage{position:relative;isolation:isolate;overflow:hidden;width:min(1180px,96vw);aspect-ratio:16/9;background:linear-gradient(180deg,#0d1723 0%,#070b11 70%,#05080d 100%);box-shadow:0 20px 54px rgba(0,0,0,.35)}
.bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.bg::before,.bg::after,.aura{content:"";position:absolute;pointer-events:none}
/* Result-derived static base */
.bg::before{inset:0;background:radial-gradient(circle at 50% 28%,rgba(72,129,190,.22),transparent 34%),radial-gradient(circle at 25% 75%,rgba(177,104,255,.12),transparent 38%)}
/* STATIC */
.stage.static .bg::after{inset:0;background:radial-gradient(ellipse at 62% 72%,rgba(91,206,255,.055),transparent 40%)}
/* A: wide horizontal drift */
.stage.drift .bg::after{width:74%;height:70%;left:8%;top:12%;border-radius:50%;filter:blur(34px);background:radial-gradient(ellipse,rgba(101,218,255,.105),rgba(113,139,255,.065) 35%,rgba(188,119,255,.055) 58%,transparent 76%);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate3d(-5%,2%,0) scale(1)}50%{transform:translate3d(10%,-3%,0) scale(1.07)}100%{transform:translate3d(18%,3%,0) scale(.99)}}
/* B: breathing aurora */
.stage.breathe .bg::after{inset:-8%;filter:blur(42px);background:radial-gradient(ellipse at 46% 28%,rgba(87,185,255,.12),transparent 42%),radial-gradient(ellipse at 34% 78%,rgba(178,111,255,.10),transparent 44%),radial-gradient(ellipse at 72% 62%,rgba(79,222,255,.07),transparent 38%);animation:breathe 8.8s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.58;transform:scale(.98)}50%{opacity:1;transform:scale(1.055)}}
/* C: independent lights */
.stage.lights .aura{display:block;inset:0}
.light{display:none;position:absolute;border-radius:50%;filter:blur(44px);mix-blend-mode:screen}.stage.lights .light{display:block}
.light.cyan{width:47%;aspect-ratio:1;left:21%;top:6%;background:radial-gradient(circle,rgba(106,226,255,.15),rgba(106,226,255,.06) 42%,transparent 72%);animation:l1 13s ease-in-out infinite alternate}
.light.blue{width:41%;aspect-ratio:1;left:46%;top:23%;background:radial-gradient(circle,rgba(90,147,255,.13),rgba(90,147,255,.05) 42%,transparent 73%);animation:l2 15s ease-in-out infinite alternate}
.light.violet{width:44%;aspect-ratio:1;left:6%;top:43%;background:radial-gradient(circle,rgba(188,124,255,.12),rgba(188,124,255,.05) 41%,transparent 73%);animation:l3 14s ease-in-out infinite alternate}
@keyframes l1{0%{transform:translate(-5%,2%) scale(1)}100%{transform:translate(12%,-5%) scale(1.08)}}@keyframes l2{0%{transform:translate(3%,-5%) scale(1)}100%{transform:translate(-10%,7%) scale(1.05)}}@keyframes l3{0%{transform:translate(-4%,6%) scale(1)}100%{transform:translate(15%,-4%) scale(1.07)}}
/* D: soft curtain */
.stage.curtain .bg::after{inset:-18% -8%;filter:blur(28px);opacity:.8;background:linear-gradient(112deg,transparent 9%,rgba(99,198,255,.05) 24%,rgba(130,132,255,.075) 39%,rgba(192,119,255,.05) 52%,transparent 67%);animation:curtain 12s ease-in-out infinite alternate}
@keyframes curtain{0%{transform:translateX(-11%) skewX(-5deg)}100%{transform:translateX(13%) skewX(5deg)}}
/* Gameplay mock */
.game-ui{position:absolute;inset:0;z-index:5;display:grid;grid-template-rows:52px 34% 1fr}
header{display:flex;align-items:center;padding:7px 15px;background:rgba(6,10,16,.80);border-bottom:1px solid rgba(96,113,133,.32);backdrop-filter:blur(4px)}
.rank{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid #5b6979;color:#c6d2df;font-weight:900}.song{margin-left:12px}.song b,.song small{display:block}.song small{font-size:9px;color:#7f8997}.score{margin-left:auto;text-align:right}.score small{display:block;color:#718095;font-size:8px;letter-spacing:.15em}.score strong{font-size:21px;letter-spacing:.08em}.pause{margin-left:16px;width:42px;height:34px;border:0;border-radius:999px;background:rgba(18,30,43,.8);color:white;font-size:18px}
.chart{position:relative;background:rgba(7,13,21,.72);border-bottom:1px solid rgba(107,130,153,.38);overflow:hidden}.lane{position:absolute;left:8%;right:0;height:1px;background:rgba(255,255,255,.055)}.lane:nth-child(1){top:25%}.lane:nth-child(2){top:50%}.lane:nth-child(3){top:75%}.hitline{position:absolute;left:9%;top:0;bottom:0;width:2px;background:#6fdcff;box-shadow:0 0 10px rgba(111,220,255,.35)}.notechip{position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid #c9d6e3;background:#223047}.notechip.n1{left:44%;top:21%}.notechip.n2{left:62%;top:46%}.notechip.n3{left:76%;top:70%}.notechip.n4{left:28%;top:46%}
.kit{position:relative;overflow:hidden;background:radial-gradient(ellipse at center,rgba(33,40,51,.42) 0,rgba(12,16,22,.34) 68%)}.kit img{position:absolute;left:50%;bottom:-3%;transform:translateX(-50%);width:86%;max-height:105%;object-fit:contain;opacity:.86;filter:drop-shadow(0 18px 28px rgba(0,0,0,.56))}.fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,10,16,.06),rgba(2,5,10,.16))}
.caption{width:min(1180px,96vw);margin:14px auto 0;padding:12px 14px;border:1px solid rgba(145,174,199,.16);background:#09111b;border-radius:13px;color:#95a8bc;font-size:11px;line-height:1.55}.caption b{color:#e4edf7}
@media(max-width:760px){.note{width:100%;max-width:none;margin-left:0}.stage-wrap{padding-top:12px}.caption{font-size:10px}}
</style>
</head>
<body>
<div class="toolbar"><b>GAME BACKGROUND</b><button class="mode active" data-mode="static">1 静止</button><button class="mode" data-mode="drift">2 Wide Drift</button><button class="mode" data-mode="breathe">3 Breathing Aurora</button><button class="mode" data-mode="lights">4 Moving Lights</button><button class="mode" data-mode="curtain">5 Aurora Curtain</button><div class="note">リザルト背景の青＋紫＋暗い縦グラデを共通ベースにしています。回転・放射線・conic-gradientのアニメーションは使用していません。</div></div>
<div class="stage-wrap">
<div id="stage" class="stage static">
  <div class="bg"><i class="aura"></i><i class="light cyan"></i><i class="light blue"></i><i class="light violet"></i></div>
  <div class="game-ui">
    <header><div class="rank">D</div><div class="song"><b>なないろ</b><small>BUMP OF CHICKEN　♪＝125</small></div><div class="score"><small>SCORE</small><strong>004280</strong></div><button class="pause">Ⅱ</button></header>
    <div class="chart"><i class="lane"></i><i class="lane"></i><i class="lane"></i><i class="hitline"></i><i class="notechip n1"></i><i class="notechip n2"></i><i class="notechip n3"></i><i class="notechip n4"></i></div>
    <div class="kit"><img src="assets/drum-kit.webp" alt=""><div class="fade"></div></div>
  </div>
</div>
<div id="caption" class="caption"><b>1 / 静止：</b>リザルトの回転オーラだけ抜いた基本形。青い上部光＋左下の紫をそのまま演奏画面へ移した案です。</div>
</div>
<script>
const stage=document.getElementById('stage'),caption=document.getElementById('caption');
const desc={static:'<b>1 / 静止：</b>リザルトの回転オーラだけ抜いた基本形。青い上部光＋左下の紫をそのまま演奏画面へ移した案です。',drift:'<b>2 / Wide Drift：</b>大きな青紫の光の塊が、横方向中心にゆっくり漂う案。動きは分かるが主張は弱めです。',breathe:'<b>3 / Breathing Aurora：</b>位置移動を抑え、光の面積と濃度が呼吸するように膨らむ案。最も静かです。',lights:'<b>4 / Moving Lights：</b>Cyan / Blue / Violet の大きい光源がそれぞれ別方向へゆっくり移動。事前設定画面のMoving Lightsに近い系統です。',curtain:'<b>5 / Aurora Curtain：</b>薄い青紫のカーテン状の光が左右へ流れる案。オーロラ感が最も分かりやすいですが、演奏の邪魔にならない濃度に抑えています。'};
document.querySelectorAll('[data-mode]').forEach(btn=>btn.onclick=()=>{const m=btn.dataset.mode;stage.className='stage '+m;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b===btn));caption.innerHTML=desc[m]});
</script>
</body></html>
