<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DruMaster Design Token Audit</title><style>*{box-sizing:border-box}html,body{margin:0;background:#070a0f;color:#eaf1f7;font-family:system-ui,sans-serif}main{width:min(1200px,95vw);margin:auto;padding:28px 0 60px}h1{margin:0 0 8px;font-size:26px}.lead{color:#91a0ae;font-size:12px;line-height:1.7}.list{display:grid;gap:9px;margin-top:20px}.item{display:grid;grid-template-columns:80px 220px 1fr 150px;gap:12px;align-items:center;border:1px solid #293949;border-radius:11px;background:#0c131d;padding:11px}.item.on{border-color:#53819a}.p{font-size:10px;font-weight:800}.name{font-size:13px;font-weight:800}.desc{font-size:10px;color:#8fa0af;line-height:1.5}.toggle label{display:flex;gap:7px;align-items:center;font-size:11px}.toggle input{width:20px;height:20px;accent-color:#63c3ff}textarea{width:100%;min-height:300px;margin-top:20px;background:#05080c;color:#dce7f1;border:1px solid #314457;border-radius:8px;padding:11px;font:11px/1.5 monospace}@media(max-width:800px){.item{grid-template-columns:1fr}}</style></head><body><main><h1>Design-system Commonization Audit</h1><p class="lead">色・font-family・font-size以外で、共通トークン化しておくと保守事故を減らせる候補です。ON/OFFを選んでJSONを貼ってください。</p><div class="list" id="list"></div><textarea id="out" readonly></textarea></main><script>const D=[['transport-geometry','最高','Transportボタン寸法','一時停止／楽譜再生の幅・高さ・radius・icon寸法。PC/スマホ差は別トークンで維持'],['toggle-geometry','最高','セットアップToggle寸法','本体幅・高さ・thumb径・移動距離・border幅'],['dropdown-geometry','最高','Dropdown形状','曲名／演奏モードのtrigger高さ・padding・radius・option高さ・矢印寸法'],['z-index-layers','最高','z-index階層','background / content / chart / HUD / feedback / overlay / dropdown / top-effect'],['mobile-layout-bases','高','スマホ基準座標','safe-left・header-height・chart-top等'],['focus-ring','高','Focus ring','focus色・太さ・offset。形状は各controlへ追従'],['border-widths','高','Border width','default / focus / touch-optical'],['action-button-geometry','高','Action button寸法','リザルト／マイク調整等の高さ・基本padding'],['touch-hit-area','高','タップ領域','見た目と分離した最小hit-area。見た目寸法は維持'],['motion-timing','中','Motion timing','hover / press / popupのduration・easing。ゲーム固有演出は対象外'],['radius-scale','中','Radius scale','control / card / panel / pill'],['spacing-scale','中','Spacing scale','gap / padding / marginの基本scale'],['elevation-shadow','中','Elevation / shadow','control / popup / panel / overlay。発光演出は対象外'],['disabled-states','中','Disabled / locked','control / option / lockedの用途別opacity・filter'],['typography-style','中','Typography style','weight / line-height / letter-spacing。ロゴ・score・判定など表現文字は対象外']];const K='dm-token-audit-v1';let S={};try{S=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}function r(){list.innerHTML=D.map(x=>`<div class="item ${S[x[0]]?'on':''}" data-id="${x[0]}"><div class="p">${x[1]}</div><div class="name">${x[2]}</div><div class="desc">${x[3]}</div><div class="toggle"><label><input type="checkbox" ${S[x[0]]?'checked':''}>共通化する</label></div></div>`).join('');document.querySelectorAll('input').forEach(i=>i.onchange=e=>{S[e.target.closest('.item').dataset.id]=e.target.checked;localStorage.setItem(K,JSON.stringify(S));r()});out.value=JSON.stringify({designSystemCommonization:D.map(x=>({id:x[0],priority:x[1],label:x[2],commonize:!!S[x[0]]}))},null,2)}r()</script></body></html>
