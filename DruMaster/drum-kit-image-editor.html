<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DruMaster Drum Kit Editor</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#080b11;color:#f5f7fb;font-family:Arial,"Yu Gothic",sans-serif}body{overflow:hidden}.app{display:grid;grid-template-columns:390px 1fr;height:100vh}aside{overflow:auto;padding:12px;background:#0d131d;border-right:1px solid #273142}section{padding:11px;margin-bottom:10px;border:1px solid #273142;border-radius:12px;background:#111927}h1{font-size:15px;margin:0 0 6px}h2{font-size:13px;margin:0 0 8px}p,.sub{font-size:11px;color:#aeb8c8}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:7px}.btn{border:1px solid #3a475d;background:#172133;color:#fff;border-radius:8px;padding:7px 9px;cursor:pointer}.btn.warn{background:#3a2020}.pill{font-size:10px;padding:4px 7px;border:1px solid #34516d;border-radius:999px;color:#cde8ff;background:#102033}.list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}.item{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center;padding:7px;border:1px solid #293448;border-radius:9px;background:#0c1420}.item.active{outline:2px solid #409cff}.name{font-size:12px;font-weight:700}.ctrl{display:grid;grid-template-columns:76px 1fr 62px;gap:7px;align-items:center;margin:6px 0;font-size:11px}input[type=range]{width:100%}input[type=text]{width:100%;background:#0b1220;border:1px solid #334057;color:#fff;border-radius:7px;padding:6px}output{text-align:right;color:#d9e7ff}main{position:relative;overflow:auto;background:radial-gradient(circle at 50% 65%,#182131 0,#0b1018 48%,#06080d 100%)}.toolbar{position:sticky;top:0;z-index:100;display:flex;gap:7px;align-items:center;padding:9px;background:#080b11dd;border-bottom:1px solid #263144}.holder{padding:14px}#stage{position:relative;min-width:900px;width:min(96vw,calc(90vh * 1280 / 854));aspect-ratio:1280/854;margin:auto;border:1px solid #283246;border-radius:14px;overflow:hidden;background:#070b11}#stage.grid:before{content:"";position:absolute;inset:0;z-index:90;pointer-events:none;background-image:linear-gradient(to right,#ffffff12 1px,transparent 1px),linear-gradient(to bottom,#ffffff12 1px,transparent 1px);background-size:10% 100%,100% 10%}.layer{position:absolute;user-select:none;-webkit-user-drag:none;transform-origin:center;pointer-events:none}.fit{inset:0;width:100%;height:100%;object-fit:contain}.zone{position:absolute;transform:translate(-50%,-50%);border:2px solid currentColor;background:#ffffff0d;z-index:70;cursor:move}.zone span{font-size:10px;background:#000a;color:#fff;padding:3px 5px;border-radius:5px;position:absolute;left:3px;top:3px}.handle{position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;border-radius:50%;background:currentColor;border:2px solid #fff;cursor:nwse-resize}.fx{position:absolute;width:15px;height:15px;border-radius:50%;transform:translate(-50%,-50%);z-index:80;border:2px solid #fff;cursor:move}.fx:before,.fx:after{content:"";position:absolute;left:50%;top:50%;background:currentColor;transform:translate(-50%,-50%)}.fx:before{width:2px;height:23px}.fx:after{width:23px;height:2px}.ring{position:absolute;transform:translate(-50%,-50%);z-index:95;width:5%;aspect-ratio:1;border:3px solid #69ff96;border-radius:50%;box-shadow:0 0 15px #69ff96;animation:r .35s ease-out forwards;pointer-events:none}@keyframes r{from{scale:.4;opacity:1}to{scale:1.8;opacity:0}}textarea{width:100%;height:125px;background:#0b1220;color:#dbe7f8;border:1px solid #334057;border-radius:7px;font:10px monospace}.note{font-size:10px;color:#c5d1df;background:#0a111c;border-radius:8px;padding:7px;margin-top:7px}@media(max-width:1050px){.app{grid-template-columns:1fr}aside{height:46vh}main{height:54vh}}</style></head><body><div class="app"><aside><section><h1>DruMaster ドラムセット画像エディタ</h1><p>本番の現在値を初期値に使用。画像レイヤーの表示・位置・サイズ・回転・重ね順、ヒット判定範囲とFX位置を編集できます。</p><div class="row"><span class="pill">Splash is behind Bass</span><span class="pill">Z editable</span></div></section><section><h2>画像追加</h2><input id="files" type="file" accept="image/*" multiple><div class="row"><button class="btn" id="add">読み込む</button></div></section><section><h2>画像レイヤー</h2><div id="layers" class="list"></div></section><section><h2>選択レイヤー</h2><div id="le"></div><div class="note">Zが小さいほど後ろです。初期値は Splash=0 / Bass=1 / Drum kit=2。</div></section><section><h2>ヒットゾーン</h2><div id="zones" class="list"></div><div class="row"><button class="btn" id="tz">ゾーン表示切替</button><button class="btn" id="tf">FX表示切替</button></div></section><section><h2>選択ヒットゾーン</h2><div id="ze"></div></section><section><h2>設定</h2><div class="row"><button class="btn" id="copy">JSONコピー</button><button class="btn" id="save">ブラウザ保存</button><button class="btn warn" id="reset">本番初期値へ戻す</button></div><textarea id="json"></textarea><div class="row"><button class="btn" id="apply">JSON適用</button></div></section></aside><main><div class="toolbar"><button class="btn" id="grid">グリッド</button><span id="pos" class="sub">x: -- y: --</span></div><div class="holder"><div id="stage" class="grid"></div></div></main></div><script>
const $=id=>document.getElementById(id),stage=$('stage'),pct=v=>Number(v).toFixed(1)+'%',clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const defaults=()=>({layers:[
{id:'splash',name:'Splash cymbal',src:'assets/splash-cymbal.svg?v=20260830-correctpng1',type:'center',x:34.1,y:26.5,w:57.1,r:13,z:0,opacity:100,visible:true},
{id:'bass',name:'Bass drum current',src:'assets/bass-drum.webp?v=20260826-maint1',type:'top',x:47.56,y:34.48,w:37.69,r:0,z:1,opacity:100,visible:true},
{id:'kit',name:'Drum kit current',src:'assets/drum-kit.webp',type:'fit',x:50,y:50,w:100,r:0,z:2,opacity:100,visible:true}],zones:[
{id:'splash',name:'splash',x:39.7,y:16.7,w:14,h:13,fxX:39.7,fxY:16.7,color:'#69ff96',visible:true},
{id:'crashL',name:'crash-left',x:17.65,y:16.05,w:26.9,h:31.1,fxX:20.64,fxY:25.10,color:'#ff8e8e',visible:true},
{id:'crashR',name:'crash-right',x:76,y:15.15,w:26,h:32.9,fxX:72,fxY:24.56,color:'#ffd36d',visible:true},
{id:'hh',name:'hi-hat',x:10.85,y:52.55,w:24.1,h:31.7,fxX:15.65,fxY:57.27,color:'#79c7ff',visible:true},
{id:'ride',name:'ride',x:84.7,y:53.55,w:29,h:41.9,fxX:78.93,fxY:56.02,color:'#b99cff',visible:true},
{id:'highTom',name:'highTom',x:37,y:34.85,w:20.4,h:29.3,fxX:36.98,fxY:35.44,color:'#ffb3e8',visible:true},
{id:'midTom',name:'midTom',x:59.2,y:36.45,w:20.8,h:30.5,fxX:59.64,fxY:34.89,color:'#9ff0c1',visible:true},
{id:'snare',name:'snare',x:32.75,y:67.7,w:25.5,h:36.4,fxX:31.32,fxY:65.33,color:'#64f0ff',visible:true},
{id:'floorTom',name:'floorTom',x:62.25,y:70.4,w:26.5,h:38.6,fxX:63.81,fxY:68.70,color:'#ffbf7f',visible:true}],selL:'splash',selZ:'splash',showZones:true,showFx:true});
let S=defaults(),drag=null;const layer=id=>S.layers.find(x=>x.id===id),zone=id=>S.zones.find(x=>x.id===id);function pt(e){const r=stage.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100}}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function normalize(){const d=defaults();for(const id of ['splash','bass','kit']){let l=layer(id),dl=d.layers.find(x=>x.id===id);if(!l){l={...dl};S.layers.push(l)}l.src=dl.src;if(l.opacity==null)l.opacity=100;if(l.visible==null)l.visible=true;if(l.z==null)l.z=dl.z}if(!Array.isArray(S.zones)||!S.zones.length)S.zones=d.zones;return S}
function render(){normalize();stage.innerHTML='';[...S.layers].sort((a,b)=>a.z-b.z).forEach(l=>{const i=new Image;i.src=l.src;i.className='layer '+(l.type==='fit'?'fit':'');i.style.zIndex=l.z;i.style.opacity=(l.opacity??100)/100;i.style.display=l.visible?'':'none';if(l.type!=='fit'){i.style.left=l.x+'%';i.style.top=l.y+'%';i.style.width=l.w+'%';i.style.transform=l.type==='top'?`translateX(-50%) rotate(${l.r}deg)`:`translate(-50%,-50%) rotate(${l.r}deg)`;if(l.id===S.selL){i.style.pointerEvents='auto';i.style.cursor='move';i.onpointerdown=e=>{e.stopPropagation();const p=pt(e);drag={kind:'layer',id:l.id,dx:l.x-p.x,dy:l.y-p.y}}}}stage.append(i)});if(S.showZones)S.zones.forEach(z=>{if(!z.visible)return;const b=document.createElement('div');b.className='zone';b.style.cssText=`left:${z.x}%;top:${z.y}%;width:${z.w}%;height:${z.h}%;color:${z.color}`;b.innerHTML=`<span>${esc(z.name)}</span><i class="handle"></i>`;b.onpointerdown=e=>{if(e.target.classList.contains('handle'))return;e.stopPropagation();const p=pt(e);drag={kind:'zone',id:z.id,dx:z.x-p.x,dy:z.y-p.y};S.selZ=z.id;side()};b.querySelector('.handle').onpointerdown=e=>{e.stopPropagation();drag={kind:'resize',id:z.id};S.selZ=z.id;side()};stage.append(b);if(S.showFx){const f=document.createElement('div');f.className='fx';f.style.cssText=`left:${z.fxX}%;top:${z.fxY}%;color:${z.color};background:${z.color}`;f.onpointerdown=e=>{e.stopPropagation();const p=pt(e);drag={kind:'fx',id:z.id,dx:z.fxX-p.x,dy:z.fxY-p.y};S.selZ=z.id;side()};stage.append(f)}});side()}
function range(id,label,obj,key,min,max,step=.1,unit='%'){return `<label class="ctrl">${label}<input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${obj[key]}"><output>${unit==='°'?obj[key]+'°':unit===''?obj[key]:pct(obj[key])}</output></label>`}function bind(id,obj,key){const e=$(id);if(!e)return;e.oninput=()=>{obj[key]=+e.value;render()}}
function side(){$('layers').innerHTML=[...S.layers].sort((a,b)=>a.z-b.z).map(l=>`<div class="item ${l.id===S.selL?'active':''}"><input type="checkbox" ${l.visible?'checked':''} data-v="${l.id}"><div><div class="name">${esc(l.name)}</div><div class="sub">z=${l.z} · ${l.type}</div></div><button class="btn" data-l="${l.id}">選択</button></div>`).join('');document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{S.selL=b.dataset.l;render()});document.querySelectorAll('[data-v]').forEach(c=>c.onchange=()=>{layer(c.dataset.v).visible=c.checked;render()});$('zones').innerHTML=S.zones.map(z=>`<div class="item ${z.id===S.selZ?'active':''}"><input type="checkbox" ${z.visible?'checked':''} data-zv="${z.id}"><div><div class="name">${esc(z.name)}</div><div class="sub">box ${pct(z.w)}×${pct(z.h)} · FX ${pct(z.fxX)}, ${pct(z.fxY)}</div></div><button class="btn" data-z="${z.id}">選択</button></div>`).join('');document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{S.selZ=b.dataset.z;render()});document.querySelectorAll('[data-zv]').forEach(c=>c.onchange=()=>{zone(c.dataset.zv).visible=c.checked;render()});const l=layer(S.selL);if(l){$('le').innerHTML=`<input id="ln" type="text" value="${esc(l.name)}">${range('lz','Z / 重ね順',l,'z',-20,100,1,'')}${range('lo','Opacity',l,'opacity',0,100,1)}${l.type!=='fit'?range('lx','X',l,'x',-20,120)+range('ly','Y',l,'y',-20,120)+range('lw','Size',l,'w',1,200)+range('lr','Rotate',l,'r',-180,180,1,'°'):''}`;$('ln').oninput=e=>{l.name=e.target.value;render()};bind('lz',l,'z');bind('lo',l,'opacity');bind('lx',l,'x');bind('ly',l,'y');bind('lw',l,'w');bind('lr',l,'r')}else $('le').innerHTML='<p>レイヤーを選択してください</p>';const z=zone(S.selZ);if(z){$('ze').innerHTML=`<input id="zn" type="text" value="${esc(z.name)}">${range('zx','Center X',z,'x',-20,120)}${range('zy','Center Y',z,'y',-20,120)}${range('zw','Width',z,'w',1,60)}${range('zh','Height',z,'h',1,60)}${range('zfx','FX X',z,'fxX',-20,120)}${range('zfy','FX Y',z,'fxY',-20,120)}<div class="row"><button class="btn" id="testfx">ヒットエフェクト確認</button></div>`;$('zn').oninput=e=>{z.name=e.target.value;render()};for(const [id,key] of [['zx','x'],['zy','y'],['zw','w'],['zh','h'],['zfx','fxX'],['zfy','fxY']])bind(id,z,key);$('testfx').onclick=()=>{const r=document.createElement('div');r.className='ring';r.style.left=z.fxX+'%';r.style.top=z.fxY+'%';stage.append(r);setTimeout(()=>r.remove(),400)}}else $('ze').innerHTML='<p>ヒットゾーンを選択してください</p>';$('json').value=JSON.stringify(S,null,2)}
window.onpointermove=e=>{if(stage.matches(':hover')){const p=pt(e);$('pos').textContent=`x: ${p.x.toFixed(1)} y: ${p.y.toFixed(1)}`}if(!drag)return;const p=pt(e),o=drag.kind==='layer'?layer(drag.id):zone(drag.id);if(drag.kind==='layer'||drag.kind==='zone'){o.x=clamp(p.x+drag.dx,-20,120);o.y=clamp(p.y+drag.dy,-20,120)}else if(drag.kind==='fx'){o.fxX=clamp(p.x+drag.dx,-20,120);o.fxY=clamp(p.y+drag.dy,-20,120)}else if(drag.kind==='resize'){o.w=clamp(Math.abs(p.x-o.x)*2,1,60);o.h=clamp(Math.abs(p.y-o.y)*2,1,60)}render()};window.onpointerup=()=>drag=null;
$('add').onclick=async()=>{for(const f of $('files').files){const src=await new Promise((res,rej)=>{const r=new FileReader;r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)}),id='layer-'+Math.random().toString(36).slice(2,9);S.layers.push({id,name:f.name,src,type:'center',x:50,y:50,w:30,r:0,z:3,opacity:100,visible:true});S.selL=id}render()};$('tz').onclick=()=>{S.showZones=!S.showZones;render()};$('tf').onclick=()=>{S.showFx=!S.showFx;render()};$('grid').onclick=()=>stage.classList.toggle('grid');$('copy').onclick=async()=>{await navigator.clipboard.writeText(JSON.stringify(S,null,2));alert('コピーしました')};$('save').onclick=()=>{normalize();localStorage.setItem('dm-kit-editor-prod-v4',JSON.stringify(S));alert('保存しました')};$('reset').onclick=()=>{S=defaults();localStorage.removeItem('dm-kit-editor-prod-v4');render()};$('apply').onclick=()=>{try{S=JSON.parse($('json').value);normalize();render()}catch(e){alert('JSONが不正です')}};try{const v=localStorage.getItem('dm-kit-editor-prod-v4');if(v)S=JSON.parse(v)}catch{S=defaults()}normalize();render();
</script></body></html>
