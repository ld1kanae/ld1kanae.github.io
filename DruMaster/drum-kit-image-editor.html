<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DruMaster Drum Kit Editor</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#080b11;color:#f5f7fb;font-family:Arial,"Yu Gothic",sans-serif}body{overflow:hidden}button,input{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:380px 1fr;height:100vh}aside{overflow:auto;padding:12px;background:#0d131d;border-right:1px solid #273142}section{padding:11px;margin-bottom:10px;border:1px solid #273142;border-radius:12px;background:#111927}h1{font-size:15px;margin:0 0 6px}h2{font-size:13px;margin:0 0 8px}p{font-size:11px;color:#aeb8c8;line-height:1.45;margin:0}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:7px}.btn{border:1px solid #3a475d;background:#172133;color:#fff;border-radius:8px;padding:7px 9px}.btn.warn{background:#3a2020}.pill{font-size:10px;padding:4px 7px;border:1px solid #34516d;border-radius:999px;color:#cde8ff;background:#102033}.list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}.item{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center;padding:7px;border:1px solid #293448;border-radius:9px;background:#0c1420}.item.active{outline:2px solid #409cff}.name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:10px;color:#98a4b7}.ctrl{display:grid;grid-template-columns:76px 1fr 58px;gap:7px;align-items:center;margin:6px 0;font-size:11px}input[type=range]{width:100%}input[type=text]{width:100%;background:#0b1220;border:1px solid #334057;color:#fff;border-radius:7px;padding:6px}output{text-align:right;color:#d9e7ff}main{position:relative;overflow:auto;background:radial-gradient(circle at 50% 65%,#182131 0,#0b1018 48%,#06080d 100%)}.toolbar{position:sticky;top:0;z-index:60;display:flex;gap:7px;align-items:center;padding:9px;background:#080b11cc;backdrop-filter:blur(8px);border-bottom:1px solid #263144}.holder{padding:14px}#stage{position:relative;min-width:900px;width:min(96vw,calc(90vh * 1280 / 854));aspect-ratio:1280/854;margin:auto;border:1px solid #283246;border-radius:14px;overflow:hidden;background:#070b11}#stage.grid:before{content:"";position:absolute;inset:0;z-index:50;pointer-events:none;background-image:linear-gradient(to right,#ffffff12 1px,transparent 1px),linear-gradient(to bottom,#ffffff12 1px,transparent 1px);background-size:10% 100%,100% 10%}.layer{position:absolute;user-select:none;-webkit-user-drag:none;transform-origin:center;pointer-events:none}.layer.fit{inset:0;width:100%;height:100%;object-fit:contain;transform:none}.zone{position:absolute;transform:translate(-50%,-50%);border:2px solid currentColor;background:#ffffff0d;z-index:40;cursor:move}.zone.sel{box-shadow:0 0 0 2px #fff8}.zone span{font-size:10px;background:#000a;color:#fff;padding:3px 5px;border-radius:5px;position:absolute;left:3px;top:3px;white-space:nowrap}.handle{position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;border-radius:50%;background:currentColor;border:2px solid #fff;cursor:nwse-resize}.fx{position:absolute;width:15px;height:15px;border-radius:50%;transform:translate(-50%,-50%);z-index:45;border:2px solid #fff;cursor:move}.fx:before,.fx:after{content:"";position:absolute;left:50%;top:50%;background:currentColor;transform:translate(-50%,-50%)}.fx:before{width:2px;height:23px}.fx:after{width:23px;height:2px}.ring{position:absolute;transform:translate(-50%,-50%);z-index:55;width:5%;aspect-ratio:1;border:3px solid #69ff96;border-radius:50%;box-shadow:0 0 15px #69ff96;animation:r .35s ease-out forwards;pointer-events:none}@keyframes r{from{scale:.4;opacity:1}to{scale:1.8;opacity:0}}textarea{width:100%;height:115px;background:#0b1220;color:#dbe7f8;border:1px solid #334057;border-radius:7px;font:10px monospace}.note{font-size:10px;color:#c5d1df;background:#0a111c;border-radius:8px;padding:7px;margin-top:7px}@media(max-width:1050px){.app{grid-template-columns:1fr}aside{height:46vh;border-right:none;border-bottom:1px solid #273142}main{height:54vh}}</style></head><body><div class="app"><aside><section><h1>DruMaster ドラムセット画像エディタ</h1><p>本番の現在値を初期値として同期。画像レイヤー、当たり判定、各ヒットエフェクト位置を同じ1280×854座標面で編集します。</p><div class="row"><span class="pill">PRODUCTION SYNC 2026-08-30</span></div></section><section><h2>画像追加</h2><input id="files" type="file" accept="image/*" multiple><div class="row"><button class="btn" id="add">読み込む</button></div></section><section><h2>レイヤー</h2><div id="layers" class="list"></div></section><section><h2>選択レイヤー</h2><div id="le"></div><div class="note">Bass drum は本番CSSと同じ「上端Y＋中央X」アンカー。Splash は中央アンカーです。</div></section><section><h2>ヒットゾーン</h2><div id="zones" class="list"></div><div class="row"><button class="btn" id="tz">ゾーン表示切替</button><button class="btn" id="tf">FX表示切替</button></div><div class="note">Bass drum は現在クリック判定を持たず、Space/自動キックで鳴るため、架空の当たり判定は表示していません。</div></section><section><h2>選択ヒットゾーン</h2><div id="ze"></div></section><section><h2>設定</h2><div class="row"><button class="btn" id="copy">JSONコピー</button><button class="btn" id="save">ブラウザ保存</button><button class="btn warn" id="reset">本番初期値へ戻す</button></div><textarea id="json"></textarea><div class="row"><button class="btn" id="apply">JSON適用</button></div></section></aside><main><div class="toolbar"><button class="btn" id="grid">グリッド</button><button class="btn" id="pc">PC本番値</button><button class="btn" id="mobile">Mobile本番値</button><span id="mode" class="pill">PC</span><span id="pos" class="sub">x: -- y: --</span></div><div class="holder"><div id="stage" class="grid"></div></div></main></div><script>
const pcBass={x:47.56,y:34.48,w:37.69},mobileBass={x:47.74,y:39.20,w:37.10};
const defaults=()=>({mode:'pc',layers:[{id:'splash',name:'Splash cymbal',src:'assets/splash-cymbal.svg?v=20260830-prod2',type:'center',x:34.1,y:26.5,w:57.1,r:13,z:5,opacity:100,visible:true},{id:'bass',name:'Bass drum current',src:'assets/bass-drum.webp?v=20260826-maint1',type:'top',x:pcBass.x,y:pcBass.y,w:pcBass.w,r:0,z:10,opacity:100,visible:true},{id:'kit',name:'Drum kit current',src:'assets/drum-kit.webp',type:'fit',x:50,y:50,w:100,r:0,z:20,opacity:100,visible:true}],zones:[
{id:'splash',name:'splash',x:39.7,y:16.7,w:14,h:13,fxX:39.7,fxY:16.7,color:'#69ff96',visible:true},
{id:'crashL',name:'crash-left',x:17.65,y:16.05,w:26.9,h:31.1,fxX:20.6359,fxY:25.1001,color:'#ff8e8e',visible:true},
{id:'crashR',name:'crash-right',x:76,y:15.15,w:26,h:32.9,fxX:71.996,fxY:24.5594,color:'#ffd36d',visible:true},
{id:'hh',name:'hi-hat',x:10.85,y:52.55,w:24.1,h:31.7,fxX:15.6459,fxY:57.2733,color:'#79c7ff',visible:true},
{id:'ride',name:'ride',x:84.7,y:53.55,w:29,h:41.9,fxX:78.929,fxY:56.0221,color:'#b99cff',visible:true},
{id:'highTom',name:'highTom',x:37,y:34.85,w:20.4,h:29.3,fxX:36.9796,fxY:35.436,color:'#ffb3e8',visible:true},
{id:'midTom',name:'midTom',x:59.2,y:36.45,w:20.8,h:30.5,fxX:59.6368,fxY:34.8945,color:'#9ff0c1',visible:true},
{id:'snare',name:'snare',x:32.75,y:67.7,w:25.5,h:36.4,fxX:31.322,fxY:65.334,color:'#64f0ff',visible:true},
{id:'floorTom',name:'floorTom',x:62.25,y:70.4,w:26.5,h:38.6,fxX:63.8135,fxY:68.7016,color:'#ffbf7f',visible:true},
{id:'special',name:'special',x:50,y:58,w:10,h:16,fxX:50,fxY:58,color:'#cbd5e1',visible:true}],selL:'splash',selZ:'splash',showZones:true,showFx:true});
let S=defaults(),drag=null;const $=id=>document.getElementById(id),stage=$('stage'),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pct=v=>Number(v).toFixed(2).replace(/0+$/,'').replace(/\.$/,'')+'%';const layer=id=>S.layers.find(x=>x.id===id),zone=id=>S.zones.find(x=>x.id===id);function point(e){const r=stage.getBoundingClientRect();return{x:clamp((e.clientX-r.left)/r.width*100,0,100),y:clamp((e.clientY-r.top)/r.height*100,0,100)}}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){stage.innerHTML='';[...S.layers].sort((a,b)=>a.z-b.z).forEach(l=>{const i=new Image;i.src=l.src;i.className='layer '+(l.type==='fit'?'fit':'');i.style.zIndex=l.z;i.style.opacity=l.opacity/100;i.style.display=l.visible?'':'none';if(l.type!=='fit'){i.style.left=l.x+'%';i.style.top=l.y+'%';i.style.width=l.w+'%';i.style.transform=l.type==='top'?`translateX(-50%) rotate(${l.r}deg)`:`translate(-50%,-50%) rotate(${l.r}deg)`;if(l.id===S.selL){i.style.pointerEvents='auto';i.style.cursor='move';i.onpointerdown=e=>{e.stopPropagation();const p=point(e);drag={t:'l',id:l.id,dx:l.x-p.x,dy:l.y-p.y}}}}stage.append(i)});if(S.showZones)S.zones.forEach(z=>{if(!z.visible)return;const b=document.createElement('div');b.className='zone'+(z.id===S.selZ?' sel':'');b.style.cssText=`left:${z.x}%;top:${z.y}%;width:${z.w}%;height:${z.h}%;color:${z.color}`;b.innerHTML=`<span>${esc(z.name)}</span><i class="handle"></i>`;b.onpointerdown=e=>{if(e.target.classList.contains('handle'))return;e.stopPropagation();S.selZ=z.id;const p=point(e);drag={t:'zm',id:z.id,dx:z.x-p.x,dy:z.y-p.y};side()};b.querySelector('.handle').onpointerdown=e=>{e.stopPropagation();S.selZ=z.id;drag={t:'zr',id:z.id};side()};stage.append(b);if(S.showFx){const f=document.createElement('div');f.className='fx';f.style.cssText=`left:${z.fxX}%;top:${z.fxY}%;color:${z.color};background:${z.color}`;f.onpointerdown=e=>{e.stopPropagation();S.selZ=z.id;const p=point(e);drag={t:'fx',id:z.id,dx:z.fxX-p.x,dy:z.fxY-p.y};side()};stage.append(f)}});side()}
function side(){$('mode').textContent=S.mode==='mobile'?'Mobile':'PC';$('layers').innerHTML=S.layers.map(l=>`<div class="item ${l.id===S.selL?'active':''}"><input type="checkbox" data-v="${l.id}" ${l.visible?'checked':''}><div><div class="name">${esc(l.name)}</div><div class="sub">${l.type} · z=${l.z}</div></div><button class="btn" data-l="${l.id}">選択</button></div>`).join('');document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{S.selL=b.dataset.l;render()});document.querySelectorAll('[data-v]').forEach(c=>c.onchange=()=>{layer(c.dataset.v).visible=c.checked;render()});$('zones').innerHTML=S.zones.map(z=>`<div class="item ${z.id===S.selZ?'active':''}"><input type="checkbox" data-zv="${z.id}" ${z.visible?'checked':''}><div><div class="name">${esc(z.name)}</div><div class="sub">box ${pct(z.w)}×${pct(z.h)} · FX ${pct(z.fxX)}, ${pct(z.fxY)}</div></div><button class="btn" data-z="${z.id}">選択</button></div>`).join('');document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{S.selZ=b.dataset.z;render()});document.querySelectorAll('[data-zv]').forEach(c=>c.onchange=()=>{zone(c.dataset.zv).visible=c.checked;render()});const l=layer(S.selL);$('le').innerHTML=l?`<input id="ln" type="text" value="${esc(l.name)}"><label class="ctrl">表示<input id="lv" type="checkbox" ${l.visible?'checked':''}><output></output></label><label class="ctrl">Opacity<input id="lo" type="range" min="0" max="100" value="${l.opacity}"><output>${l.opacity}%</output></label><label class="ctrl">Z<input id="lz" type="range" min="0" max="100" value="${l.z}"><output>${l.z}</output></label>${l.type!=='fit'?`<label class="ctrl">X<input id="lx" type="range" min="0" max="100" step=".01" value="${l.x}"><output>${pct(l.x)}</output></label><label class="ctrl">Y<input id="ly" type="range" min="-20" max="120" step=".01" value="${l.y}"><output>${pct(l.y)}</output></label><label class="ctrl">Size<input id="lw" type="range" min="1" max="200" step=".01" value="${l.w}"><output>${pct(l.w)}</output></label><label class="ctrl">Rotate<input id="lr" type="range" min="-180" max="180" step="1" value="${l.r}"><output>${l.r}°</output></label>`:''}`:'';if(l)bindLayer(l);const z=zone(S.selZ);$('ze').innerHTML=z?`<input id="zn" type="text" value="${esc(z.name)}"><label class="ctrl">Center X<input id="zx" type="range" min="-10" max="110" step=".01" value="${z.x}"><output>${pct(z.x)}</output></label><label class="ctrl">Center Y<input id="zy" type="range" min="-10" max="110" step=".01" value="${z.y}"><output>${pct(z.y)}</output></label><label class="ctrl">Width<input id="zw" type="range" min="1" max="60" step=".01" value="${z.w}"><output>${pct(z.w)}</output></label><label class="ctrl">Height<input id="zh" type="range" min="1" max="60" step=".01" value="${z.h}"><output>${pct(z.h)}</output></label><label class="ctrl">FX X<input id="zfx" type="range" min="-10" max="110" step=".01" value="${z.fxX}"><output>${pct(z.fxX)}</output></label><label class="ctrl">FX Y<input id="zfy" type="range" min="-10" max="110" step=".01" value="${z.fxY}"><output>${pct(z.fxY)}</output></label><div class="row"><button class="btn" id="testfx">ヒットエフェクト確認</button></div>`:'';if(z)bindZone(z);$('json').value=JSON.stringify(S,null,2)}
function bi(id,obj,key,fmt=pct){const e=$(id);if(!e)return;e.oninput=()=>{obj[key]=+e.value;e.nextElementSibling.value=fmt(obj[key]);render()}}function bindLayer(l){$('ln').oninput=e=>{l.name=e.target.value;render()};$('lv').onchange=e=>{l.visible=e.target.checked;render()};bi('lo',l,'opacity',v=>v+'%');bi('lz',l,'z',String);bi('lx',l,'x');bi('ly',l,'y');bi('lw',l,'w');bi('lr',l,'r',v=>v+'°')}function bindZone(z){$('zn').oninput=e=>{z.name=e.target.value;render()};bi('zx',z,'x');bi('zy',z,'y');bi('zw',z,'w');bi('zh',z,'h');bi('zfx',z,'fxX');bi('zfy',z,'fxY');$('testfx').onclick=()=>{const r=document.createElement('div');r.className='ring';r.style.left=z.fxX+'%';r.style.top=z.fxY+'%';stage.append(r);setTimeout(()=>r.remove(),400)}}
window.onpointermove=e=>{if(stage.matches(':hover')){const p=point(e);$('pos').textContent=`x: ${p.x.toFixed(2)} y: ${p.y.toFixed(2)}`}if(!drag)return;const p=point(e),o=drag.t==='l'?layer(drag.id):zone(drag.id);if(drag.t==='l'||drag.t==='zm'){o.x=clamp(p.x+drag.dx,-10,110);o.y=clamp(p.y+drag.dy,-10,110)}if(drag.t==='fx'){o.fxX=clamp(p.x+drag.dx,-10,110);o.fxY=clamp(p.y+drag.dy,-10,110)}if(drag.t==='zr'){o.w=clamp(Math.abs(p.x-o.x)*2,1,60);o.h=clamp(Math.abs(p.y-o.y)*2,1,60)}render()};window.onpointerup=()=>drag=null;
$('add').onclick=async()=>{for(const f of $('files').files){const src=await new Promise((res,rej)=>{const r=new FileReader;r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)}),id='layer-'+Math.random().toString(36).slice(2,8);S.layers.push({id,name:f.name,type:'center',src,x:50,y:50,w:30,r:0,z:30,opacity:100,visible:true});S.selL=id}render()};$('tz').onclick=()=>{S.showZones=!S.showZones;render()};$('tf').onclick=()=>{S.showFx=!S.showFx;render()};$('grid').onclick=()=>stage.classList.toggle('grid');$('copy').onclick=async()=>{await navigator.clipboard.writeText(JSON.stringify(S,null,2));alert('コピーしました')};$('save').onclick=()=>{localStorage.setItem('dm-kit-editor-prod',JSON.stringify(S));alert('保存しました')};$('reset').onclick=()=>{S=defaults();render()};$('apply').onclick=()=>{try{S=JSON.parse($('json').value);render()}catch(e){alert('JSONが不正です')}};function setMode(m){S.mode=m;const b=layer('bass'),v=m==='mobile'?mobileBass:pcBass;if(b){b.x=v.x;b.y=v.y;b.w=v.w}render()}$('pc').onclick=()=>setMode('pc');$('mobile').onclick=()=>setMode('mobile');try{const v=localStorage.getItem('dm-kit-editor-prod');if(v)S=JSON.parse(v)}catch{}render();
</script></body></html>
