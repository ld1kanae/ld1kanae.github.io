<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DruMaster Drum Kit Editor</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#080b11;color:#f5f7fb;font-family:Arial,"Yu Gothic",sans-serif}body{overflow:hidden}.app{display:grid;grid-template-columns:410px 1fr;height:100vh}aside{overflow:auto;padding:12px;background:#0d131d;border-right:1px solid #273142}section{padding:11px;margin-bottom:10px;border:1px solid #273142;border-radius:12px;background:#111927}h1,h2{margin:0 0 8px}h1{font-size:15px}h2{font-size:13px}.sub,.note{font-size:11px;color:#aeb8c8}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:7px}.btn{border:1px solid #3a475d;background:#172133;color:#fff;border-radius:8px;padding:7px 9px;cursor:pointer}.btn.good{background:#153224}.btn.warn{background:#3a2020}.list{display:flex;flex-direction:column;gap:6px}.item{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center;padding:7px;border:1px solid #293448;border-radius:8px;background:#0c1420}.item.active{outline:2px solid #409cff}.ctrl{display:grid;grid-template-columns:68px 1fr 78px;gap:7px;align-items:center;margin:7px 0;font-size:11px}.ctrl input[type=range]{width:100%}.ctrl input[type=number],input[type=text],input[type=password]{width:100%;background:#0b1220;border:1px solid #334057;color:#fff;border-radius:7px;padding:6px}.status{margin-top:8px;padding:8px;background:#0a111c;border:1px solid #2b3a50;border-radius:8px;font-size:11px;white-space:pre-wrap}textarea{width:100%;height:110px;background:#0b1220;color:#dbe7f8;border:1px solid #334057;border-radius:7px;padding:7px;font:10px monospace}main{position:relative;overflow:auto;background:#070b11}.toolbar{position:sticky;top:0;z-index:100;padding:8px;background:#080b11dd;border-bottom:1px solid #263144}.holder{padding:14px}#stage{position:relative;min-width:900px;width:min(96vw,calc(90vh*1280/854));aspect-ratio:1280/854;margin:auto;border:1px solid #283246;border-radius:12px;overflow:hidden}.layer{position:absolute;user-select:none;-webkit-user-drag:none;transform-origin:center;pointer-events:none}.fit{inset:0;width:100%;height:100%;object-fit:contain}.zone{position:absolute;transform:translate(-50%,-50%);border:2px solid currentColor;background:#ffffff0d;z-index:70;cursor:move}.zone.sel{box-shadow:0 0 0 2px #fff8}.zone span{font-size:10px;background:#000a;padding:2px 4px;position:absolute}.fx{position:absolute;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);z-index:80;border:2px solid #fff;cursor:move}.fx:after{content:"+";position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);font-weight:bold}.handle{position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;border-radius:50%;background:currentColor;border:2px solid #fff;cursor:nwse-resize}@media(max-width:1100px){.app{grid-template-columns:1fr}aside{height:48vh}main{height:52vh}}
</style></head><body><div class="app"><aside>
<section><h1>DruMaster ドラムセット画像エディタ</h1><div class="sub">スライダー・数値入力・ドラッグは相互同期します。</div></section>
<section><h2>画像追加</h2><input id="files" type="file" accept="image/*" multiple><div class="row"><button class="btn" id="add">読み込む</button></div></section>
<section><h2>画像レイヤー</h2><div id="layers" class="list"></div></section><section><h2>選択レイヤー</h2><div id="le"></div></section>
<section><h2>ヒットゾーン</h2><div id="zones" class="list"></div></section><section><h2>選択ヒットゾーン</h2><div id="ze"></div></section>
<section><h2>設定</h2><div class="row"><button class="btn" id="save">ブラウザ保存</button><button class="btn warn" id="reset">初期値へ戻す</button></div><textarea id="json"></textarea></section>
<section><h2>本番へサブミット</h2><input id="token" type="password" placeholder="GitHub token"><div class="row"><button class="btn good" id="submit">この値で本番にサブミット</button></div><div class="note">追加画像は DruMaster/assets/kit-editor/ に登録します。</div><div id="status" class="status">未送信</div></section>
</aside><main><div class="toolbar"><span id="pos" class="sub">x: -- y: --</span></div><div class="holder"><div id="stage"></div></div></main></div><script>
const $=id=>document.getElementById(id),stage=$('stage'),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const D=()=>({layers:[{id:'splash',name:'Splash cymbal',src:'assets/splash-cymbal.svg?v=20260830-correctpng1',type:'center',x:34.1,y:26.5,w:57.1,r:13,z:0,opacity:100,visible:true,builtin:true},{id:'bass',name:'Bass drum',src:'assets/bass-drum.webp?v=20260826-maint1',type:'top',x:47.56,y:34.48,w:37.69,r:0,z:1,opacity:100,visible:true,builtin:true},{id:'kit',name:'Drum kit',src:'assets/drum-kit.webp',type:'fit',x:50,y:50,w:100,r:0,z:2,opacity:100,visible:true,builtin:true}],zones:[{id:'splash',name:'splash',x:39.7,y:16.7,w:14,h:13,fxX:39.7,fxY:16.7,color:'#69ff96'},{id:'crashL',name:'crash-left',x:17.65,y:16.05,w:26.9,h:31.1,fxX:20.64,fxY:25.10,color:'#ff8e8e'},{id:'crashR',name:'crash-right',x:76,y:15.15,w:26,h:32.9,fxX:72,fxY:24.56,color:'#ffd36d'},{id:'hh',name:'hi-hat',x:10.85,y:52.55,w:24.1,h:31.7,fxX:15.65,fxY:57.27,color:'#79c7ff'},{id:'ride',name:'ride',x:84.7,y:53.55,w:29,h:41.9,fxX:78.93,fxY:56.02,color:'#b99cff'},{id:'highTom',name:'highTom',x:37,y:34.85,w:20.4,h:29.3,fxX:36.98,fxY:35.44,color:'#ffb3e8'},{id:'midTom',name:'midTom',x:59.2,y:36.45,w:20.8,h:30.5,fxX:59.64,fxY:34.89,color:'#9ff0c1'},{id:'snare',name:'snare',x:32.75,y:67.7,w:25.5,h:36.4,fxX:31.32,fxY:65.33,color:'#64f0ff'},{id:'floorTom',name:'floorTom',x:62.25,y:70.4,w:26.5,h:38.6,fxX:63.81,fxY:68.70,color:'#ffbf7f'}],selL:'splash',selZ:'splash'});
let S=D(),drag=null;try{const x=localStorage.getItem('dm-kit-editor-fixed');if(x)S=JSON.parse(x)}catch{}
const L=id=>S.layers.find(x=>x.id===id),Z=id=>S.zones.find(x=>x.id===id);function pt(e){const r=stage.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100}}function save(){localStorage.setItem('dm-kit-editor-fixed',JSON.stringify(S));$('json').value=JSON.stringify(S,null,2)}
function renderStage(){stage.innerHTML='';[...S.layers].sort((a,b)=>a.z-b.z).forEach(l=>{const i=new Image();i.src=l.src;i.className='layer '+(l.type==='fit'?'fit':'');i.style.zIndex=l.z;i.style.opacity=(l.opacity??100)/100;if(l.type!=='fit'){i.style.left=l.x+'%';i.style.top=l.y+'%';i.style.width=l.w+'%';i.style.transform=l.type==='top'?`translateX(-50%) rotate(${l.r}deg)`:`translate(-50%,-50%) rotate(${l.r}deg)`;if(l.id===S.selL){i.style.pointerEvents='auto';i.style.cursor='move';i.onpointerdown=e=>{e.preventDefault();const p=pt(e);drag={k:'l',id:l.id,dx:l.x-p.x,dy:l.y-p.y}}}stage.append(i)}});S.zones.forEach(z=>{const b=document.createElement('div');b.className='zone '+(z.id===S.selZ?'sel':'');b.style.cssText=`left:${z.x}%;top:${z.y}%;width:${z.w}%;height:${z.h}%;color:${z.color}`;b.innerHTML=`<span>${z.name}</span><i class="handle"></i>`;b.onpointerdown=e=>{if(e.target.classList.contains('handle'))return;const p=pt(e);drag={k:'z',id:z.id,dx:z.x-p.x,dy:z.y-p.y};S.selZ=z.id;side()};b.querySelector('.handle').onpointerdown=e=>{e.stopPropagation();drag={k:'r',id:z.id};S.selZ=z.id;side()};stage.append(b);const f=document.createElement('div');f.className='fx';f.style.cssText=`left:${z.fxX}%;top:${z.fxY}%;color:${z.color};background:${z.color}`;f.onpointerdown=e=>{const p=pt(e);drag={k:'f',id:z.id,dx:z.fxX-p.x,dy:z.fxY-p.y};S.selZ=z.id;side()};stage.append(f)})}
function ctl(label,key,obj,min,max,step=.1){return `<label class="ctrl"><span>${label}</span><input data-r="${key}" type="range" min="${min}" max="${max}" step="${step}" value="${obj[key]}"><input data-n="${key}" type="number" min="${min}" max="${max}" step="${step}" value="${obj[key]}"></label>`}
function bind(root,obj){root.querySelectorAll('[data-r],[data-n]').forEach(el=>el.oninput=()=>{const k=el.dataset.r||el.dataset.n,v=clamp(+el.value,+el.min,+el.max);obj[k]=v;root.querySelectorAll(`[data-r="${k}"],[data-n="${k}"]`).forEach(x=>{if(x!==el)x.value=v});renderStage();save()})}
function side(){$('layers').innerHTML=S.layers.map(l=>`<div class="item ${l.id===S.selL?'active':''}"><span>${l.name}</span><button class="btn" data-l="${l.id}">選択</button></div>`).join('');document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{S.selL=b.dataset.l;side();renderStage()});$('zones').innerHTML=S.zones.map(z=>`<div class="item ${z.id===S.selZ?'active':''}"><span>${z.name}</span><button class="btn" data-z="${z.id}">選択</button></div>`).join('');document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{S.selZ=b.dataset.z;side();renderStage()});const l=L(S.selL);$('le').innerHTML=l?ctl('X','x',l,-20,120)+ctl('Y','y',l,-20,120)+ctl('Size','w',l,1,150)+ctl('Rotate','r',l,-180,180,1)+ctl('Opacity','opacity',l,0,100,1)+ctl('Z','z',l,-20,100,1):'';if(l)bind($('le'),l);const z=Z(S.selZ);$('ze').innerHTML=z?ctl('Center X','x',z,-20,120)+ctl('Center Y','y',z,-20,120)+ctl('Width','w',z,1,60)+ctl('Height','h',z,1,60)+ctl('FX X','fxX',z,-20,120)+ctl('FX Y','fxY',z,-20,120):'';if(z)bind($('ze'),z);save()}
function all(){renderStage();side()}window.onpointermove=e=>{if(stage.matches(':hover')){const p=pt(e);$('pos').textContent=`x:${p.x.toFixed(1)} y:${p.y.toFixed(1)}`}if(!drag)return;const p=pt(e);if(drag.k==='l'){const o=L(drag.id);o.x=clamp(p.x+drag.dx,-20,120);o.y=clamp(p.y+drag.dy,-20,120)}else{const o=Z(drag.id);if(drag.k==='z'){o.x=clamp(p.x+drag.dx,-20,120);o.y=clamp(p.y+drag.dy,-20,120)}if(drag.k==='f'){o.fxX=clamp(p.x+drag.dx,-20,120);o.fxY=clamp(p.y+drag.dy,-20,120)}if(drag.k==='r'){o.w=clamp(Math.abs(p.x-o.x)*2,1,60);o.h=clamp(Math.abs(p.y-o.y)*2,1,60)}}renderStage();side()};window.onpointerup=()=>drag=null;
$('add').onclick=async()=>{for(const f of $('files').files){const src=await new Promise((res,rej)=>{const r=new FileReader;r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)}),id='layer-'+Date.now().toString(36);S.layers.push({id,name:f.name,fileName:f.name,mime:f.type||'image/png',src,type:'center',x:50,y:50,w:30,r:0,z:3,opacity:100,visible:true,builtin:false});S.selL=id}all()};$('save').onclick=()=>{save();$('status').textContent='保存しました'};$('reset').onclick=()=>{S=D();localStorage.removeItem('dm-kit-editor-fixed');all()};
const API='https://api.github.com/repos/ld1kanae/ld1kanae.github.io/contents/';function hdr(t,j=false){const h={Authorization:'Bearer '+t,Accept:'application/vnd.github+json'};if(j)h['Content-Type']='application/json';return h}async function get(p,t){const r=await fetch(API+p+'?ref=main',{headers:hdr(t)});if(r.status===404)return null;if(!r.ok)throw Error(p+' '+r.status);return r.json()}async function put(p,c,sha,t,msg){const b={message:msg,content:c,branch:'main'};if(sha)b.sha=sha;const r=await fetch(API+p,{method:'PUT',headers:hdr(t,true),body:JSON.stringify(b)});if(!r.ok)throw Error(p+' '+r.status+' '+await r.text());return r.json()}function b64(s){return btoa(unescape(encodeURIComponent(s)))}
$('submit').onclick=async()=>{const t=$('token').value.trim(),st=$('status');if(!t){st.textContent='GitHub tokenを入力してください';return}try{st.textContent='送信中…';const P=structuredClone(S),stamp=Date.now();for(let i=0;i<P.layers.length;i++){const l=P.layers[i];if(l.builtin||!String(l.src).startsWith('data:image/'))continue;const m=l.src.match(/^data:(image\/[^;]+);base64,(.+)$/);if(!m)continue;const ext=(m[1].split('/')[1]||'png').replace('jpeg','jpg'),name='editor-'+stamp+'-'+i+'.'+ext,path='DruMaster/assets/kit-editor/'+name;await put(path,m[2],null,t,'Add drum kit editor image');l.src='assets/kit-editor/'+name}const cfg={version:1,publishedAt:new Date().toISOString(),layers:P.layers,zones:P.zones};const p='DruMaster/kit-editor-config.json',old=await get(p,t);await put(p,b64(JSON.stringify(cfg,null,2)+'\n'),old?.sha||null,t,'Publish drum kit editor configuration');st.textContent='サブミット完了\n設定と追加画像を登録しました。'}catch(e){st.textContent='サブミット失敗: '+e.message}};all();
</script></body></html>
