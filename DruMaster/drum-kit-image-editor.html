<div class="app"><aside>
<section><h1>DruMaster ドラムセット画像エディタ</h1><p>本番の現在値を初期値として編集します。スライダー・数値入力・ドラッグは相互同期します。</p><div class="row"><span class="pill">PRODUCTION SYNC</span><span class="pill">SPLASH → BASS → KIT</span></div></section>

<section><h2>本番へサブミット</h2><label class="sub" for="githubToken">GitHub token（このページには保存しません）</label><input id="githubToken" type="password" autocomplete="off" placeholder="github_pat_... / ghp_..."><div class="row"><button class="btn good" id="submitProd" type="button">この値で本番にサブミット</button></div><div class="note">追加画像がある場合は DruMaster/assets/kit-editor/ に登録し、現在の画像配置・重ね順・当たり判定・FX位置を本番へ反映します。</div><div id="submitStatus" class="status" aria-live="polite">未送信</div></section>
</aside><main><div class="toolbar"><button class="btn" id="grid" type="button">グリッド</button><button class="btn" id="pc" type="button">PC本番値</button><button class="btn" id="mobile" type="button">Mobile本番値</button><span id="mode" class="pill">PC</span><span id="pos" class="sub">x: -- y: --</span></div><div class="holder"><div id="stage" class="grid"></div></div></main></div>

function pathUrl(p){return API+p.split("/").map(encodeURIComponent).join("/")}function headers(t,j=false){const h={Authorization:`Bearer ${t}`,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};if(j)h["Content-Type"]="application/json";return h}
async function ghGet(p,t){const r=await fetch(pathUrl(p)+"?ref="+encodeURIComponent(GH_BRANCH),{headers:headers(t)});if(r.status===404)return null;if(!r.ok)throw Error(`${p}: HTTP ${r.status} ${await r.text()}`);return r.json()}
async function ghPut(p,b64,sha,msg,t){const body={message:msg,content:b64,branch:GH_BRANCH};if(sha)body.sha=sha;const r=await fetch(pathUrl(p),{method:"PUT",headers:headers(t,true),body:JSON.stringify(body)});if(!r.ok)throw Error(`${p}: HTTP ${r.status} ${await r.text()}`);return r.json()}
function utf8b64(s){const a=new TextEncoder().encode(s);let b="";for(let i=0;i<a.length;i+=32768)b+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(b)}function b64utf8(s){const b=atob(String(s).replace(/\s/g,"")),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new TextDecoder().decode(a)}
function dataImage(u){const m=/^data:(image\/[a-zA-Z0-9.+-]+);base64,(.+)$/.exec(u);if(!m)throw Error("追加画像データが不正です");return{mime:m[1],b64:m[2]}}function ext(m){return({"image/png":"png","image/jpeg":"jpg","image/webp":"webp","image/gif":"gif","image/svg+xml":"svg"})[m]||"png"}function safe(n){return String(n||"layer").normalize("NFKC").replace(/[^a-zA-Z0-9_-]+/g,"-").replace(/^-+|-+$/g,"").slice(0,48)||"layer"}
function runtime(cfg){return `/* DM_KIT_EDITOR_CONFIG_START */\n(()=>{const CFG=${JSON.stringify(cfg)},M={splash:'.splash',crashL:'.crash.left',crashR:'.crash.right',hh:'.hh',ride:'.ride',highTom:'.high',midTom:'.mid',snare:'.snare',floorTom:'.floor',special:'.special'};function apply(){const p=document.querySelector('.kit-stage>.kit-art-plane');if(!p)return;const B={splash:p.querySelector(':scope>.splash-cymbal-art'),bass:p.querySelector(':scope>.bass-drum-art'),kit:p.querySelector(':scope>.kit-art')};p.querySelectorAll(':scope>.dm-editor-extra-layer').forEach(n=>n.remove());for(const l of CFG.layers||[]){let e=B[l.id];if(!e&&l.src){e=document.createElement('img');e.className='dm-editor-extra-layer';e.alt='';e.src=l.src;p.append(e)}if(!e)continue;e.style.setProperty('z-index',l.z??0,'important');e.style.setProperty('opacity',(l.opacity??100)/100,'important');e.style.setProperty('display',l.visible===false?'none':'','important');if(l.type==='fit')continue;e.style.setProperty('position','absolute','important');e.style.setProperty('left',(l.x??50)+'%','important');e.style.setProperty('top',(l.y??50)+'%','important');e.style.setProperty('width',(l.w??30)+'%','important');e.style.setProperty('height','auto','important');e.style.setProperty('pointer-events','none','important');e.style.setProperty('transform',l.type==='top'?'translateX(-50%) rotate('+(l.r??0)+'deg)':'translate(-50%,-50%) rotate('+(l.r??0)+'deg)','important')}let s=document.getElementById('dm-kit-editor-config-style');if(!s){s=document.createElement('style');s.id='dm-kit-editor-config-style';document.head.append(s)}const R=[];for(const z of CFG.zones||[]){const q=M[z.id];if(!q)continue;const L=z.x-z.w/2,T=z.y-z.h/2,X=(z.fxX-L)/z.w*100,Y=(z.fxY-T)/z.h*100;R.push('#hitLayer '+q+'{left:'+L+'%!important;right:auto!important;top:'+T+'%!important;bottom:auto!important;width:'+z.w+'%!important;height:'+z.h+'%!important;display:'+(z.visible===false?'none':'')+'!important}','#hitLayer '+q+'::after{left:'+X+'%!important;top:'+Y+'%!important}')}s.textContent=R.join('\\n')}if(document.readyState==='loading')addEventListener('DOMContentLoaded',()=>setTimeout(apply,0),{once:true});else setTimeout(apply,0);setTimeout(apply,250)})();\n/* DM_KIT_EDITOR_CONFIG_END */`}
$("submitProd").onclick=async()=>{const token=$("githubToken").value.trim(),btn=$("submitProd"),st=$("submitStatus");if(!token){st.textContent="GitHub tokenを入力してください。";return}btn.disabled=true;try{const P=structuredClone(S),stamp=Date.now();for(let i=0;i<P.layers.length;i++){const l=P.layers[i];if(l.builtin||!String(l.src||"").startsWith("data:image/"))continue;st.textContent=`追加画像を登録中… ${i+1}/${P.layers.length}`;const d=dataImage(l.src),f=`${safe(l.fileName||l.name)}-${stamp}-${i}.${ext(d.mime)}`,p=`DruMaster/assets/kit-editor/${f}`;await ghPut(p,d.b64,null,`Add drum kit editor image ${f}`,token);l.src=`assets/kit-editor/${f}`;l.fileName=f;l.mime=d.mime}const cfg={version:1,publishedAt:new Date().toISOString(),mode:P.mode,layers:P.layers,zones:P.zones};st.textContent="設定を登録中…";const cp="DruMaster/kit-editor-config.json",old=await ghGet(cp,token);await ghPut(cp,utf8b64(JSON.stringify(cfg,null,2)+"\n"),old?.sha||null,"Publish drum kit editor configuration",token);st.textContent="本番を更新中…";const ctl=await ghGet("DruMaster/js/controls.js",token);let text=b64utf8(ctl.content).replace(/\/\* DM_KIT_EDITOR_CONFIG_START \*\/[\s\S]*?\/\* DM_KIT_EDITOR_CONFIG_END \*\//g,"").trimEnd()+"\n\n"+runtime(cfg)+"\n";await ghPut("DruMaster/js/controls.js",utf8b64(text),ctl.sha,"Apply drum kit editor configuration",token);const ix=await ghGet("DruMaster/index.html",token),ver="kit-editor-"+stamp;let it=b64utf8(ix.content).replace(/js\/controls\.js\?v=[^\"]+/,"js/controls.js?v="+ver);await ghPut("DruMaster/index.html",utf8b64(it),ix.sha,"Refresh drum kit editor production config",token);S=normalizeState(P);renderAll();st.textContent="サブミット完了。追加画像・配置・重ね順・当たり判定・FX位置を本番へ反映しました。\nhttps://ld1kanae.github.io/DruMaster/?v="+ver}catch(e){st.textContent="サブミット失敗: "+(e.message||e)}finally{btn.disabled=false}};
try{const v=localStorage.getItem(STORAGE_KEY);if(v)S=normalizeState(JSON.parse(v))}catch{S=defaults()}renderAll();
</script></body></html>
