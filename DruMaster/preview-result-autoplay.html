<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080b11">
<title>DruMaster AUTO PLAY Result Preview</title>
<link rel="stylesheet" href="css/base.css?v=20260826-maint1">
<link rel="stylesheet" href="css/result-ui.css?v=20260830-ranking-title2">
<link rel="stylesheet" href="css/result-actions-fix.css?v=20260826-resultactions2">
<link rel="stylesheet" href="css/glass-buttons.css?v=20260828-hoverfullrestore1">
<link rel="stylesheet" href="css/pause-result-readability.css?v=20260830-pc-offsets1">
<link rel="stylesheet" href="css/result-mobile-song-offset.css?v=20260901-title-size27">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b11}
body{min-height:100dvh}
#app{width:100%;height:100%}
.result{display:flex!important;box-sizing:border-box;width:100%;height:100%;min-height:100%;flex-direction:column;align-items:center;justify-content:flex-start}
.preview-note{position:fixed;right:10px;bottom:8px;z-index:20;font:600 10px/1 system-ui,sans-serif;color:#718094;opacity:.7;pointer-events:none}
@media (hover:none) and (pointer:coarse) and (max-width:900px){
  #app{position:fixed;left:0;top:0;width:100vh;height:100vw;transform-origin:0 0;transform:translateY(100vh) rotate(-90deg)}
}
</style>
</head>
<body>
<main id="app">
<section id="result" class="screen result autoplay result-reveal">
  <h2 class="result-step result-step-1">Ray</h2>
  <p class="result-song-sub result-step result-step-1">BUMP OF CHICKEN</p>
  <p class="result-score-label result-step result-step-2">SCORE</p>
  <strong id="finalScore" class="result-step result-step-score">AUTO PLAY</strong>
  <div class="result-actions result-step result-step-5">
    <button id="retry" type="button">RETRY</button>
    <button id="home" type="button">HOME</button>
  </div>
</section>
</main>
<div class="preview-note">AUTO PLAY RESULT PREVIEW</div>
</body>
</html>
