<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DruMaster Debug</title><style>html,body{margin:0;min-height:100%;background:#080c12;color:#e8f0f8;font:14px/1.5 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:20px}.bar{display:flex;gap:8px;align-items:center;position:sticky;top:0;background:#080c12;padding:8px 0 12px}h1{font-size:18px;margin:0 auto 0 0}button,a{background:#172231;color:#fff;border:1px solid #536174;border-radius:7px;padding:8px 12px;text-decoration:none;cursor:pointer}textarea{box-sizing:border-box;width:100%;height:76vh;background:#03060a;color:#d9e7f5;border:1px solid #394657;border-radius:8px;padding:12px;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre}p{color:#9eabb9}</style></head><body><main><div class="bar"><h1>DruMaster Debug Log</h1><button id="refresh">更新</button><button id="copy">コピー</button><button id="clear">ログ消去</button><a href="./">DruMasterへ戻る</a></div><p>本体が「ページが応答しません」になった場合は、そのタブを閉じてからこのページを開いてください。最後に保存できた起動地点とハートビートを表示します。</p><textarea id="out" readonly></textarea></main><script>"use strict";(()=>{const LOG="dmBootDebugLogV1",PREV="dmBootDebugPrevV1",HB="dmBootDebugHeartbeatV1",out=document.getElementById("out");const read=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return {parseError:String(e),raw:localStorage.getItem(k)}}};function fmtSession(title,s){const a=[title];if(!s){a.push("(なし)");return a}a.push(`session: ${s.session||"?"}`,`startedAt: ${s.startedAt||"?"}`);for(const e of s.entries||[])a.push(`${String(e.t).padStart(8)}ms  ${e.kind}  ${e.detail}`);return a}function render(){const cur=read(LOG),prev=read(PREV),hb=read(HB),lines=["DruMaster DEBUG EXPORT",`generated: ${new Date().toISOString()}`,`userAgent: ${navigator.userAgent}`,`heartbeat: ${JSON.stringify(hb)}`,"",...fmtSession("CURRENT SESSION",cur),"",...fmtSession("PREVIOUS SESSION",prev)];out.value=lines.join("\n")}document.getElementById("refresh").onclick=render;document.getElementById("copy").onclick=async()=>{try{await navigator.clipboard.writeText(out.value);document.getElementById("copy").textContent="コピー済み"}catch{out.select();document.execCommand("copy")}};document.getElementById("clear").onclick=()=>{if(confirm("デバッグログを消去しますか？")){localStorage.removeItem(LOG);localStorage.removeItem(PREV);localStorage.removeItem(HB);render()}};render()})();</script></body></html>
