<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b11">
<title>DruMaster Mobile Result Y Editor</title>
<link rel="stylesheet" href="css/result-layout-preview.css?v=20260902-centerlock1">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#060a10;color:#eaf3fc;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}.app{width:min(100%,980px);margin:0 auto;padding:10px 10px max(22px,env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.title{font-size:13px;font-weight:800;letter-spacing:.12em;color:#d9e9f8}.seg{display:flex;gap:4px;padding:4px;border:1px solid #334356;border-radius:999px;background:#09111b}.seg button,.chip,.nudge,.action{border:1px solid transparent;background:#101a27;color:#b8c7d6;border-radius:999px;min-height:36px;padding:0 12px;font-weight:800}.seg button.active,.chip.active{background:#dcecff;color:#07111c}.preview-frame{position:relative;width:100%;overflow:hidden;border:1px solid #26384a;border-radius:12px;background:#05080d;box-shadow:0 10px 30px #0008}.preview-viewport{position:relative;width:100%;overflow:hidden}.canvas-shell{position:absolute;left:0;top:0;width:844px;height:390px;transform-origin:0 0}.rl-canvas{width:844px;height:390px}.guide{position:absolute;z-index:1;top:0;bottom:0;width:1px;background:rgba(113,220,255,.18);pointer-events:none}.guide.g25{left:25%}.guide.g50{left:50%;background:rgba(255,255,255,.22)}.guide.g75{left:75%;background:rgba(202,132,255,.2)}.rl-el{touch-action:none}.rl-el.selected{outline:2px solid #70dcff!important;outline-offset:2px}.hintbar{padding:7px 2px 2px;font-size:11px;line-height:1.45;color:#8597aa}.panel{margin-top:9px;padding:10px;border:1px solid #27384a;border-radius:12px;background:#0a111b}.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;min-height:34px;padding:0 11px;font-size:12px}.editrow{display:grid;grid-template-columns:minmax(110px,1fr) 90px;gap:8px;align-items:center;margin-top:8px}.selected-name{font-size:14px;font-weight:900}.ybox{display:flex;align-items:center;border:1px solid #3a4d61;border-radius:9px;background:#050a10;overflow:hidden}.ybox input{width:100%;height:40px;border:0;outline:0;background:transparent;color:#fff;text-align:right;font-weight:900;font-size:16px;padding:0 8px}.ybox span{padding-right:8px;font-size:11px;color:#8193a7}.nudges{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:8px}.nudge{min-width:0;padding:0 4px;border-color:#304255;font-size:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.action{border-radius:9px;border-color:#3a4d61}.action.primary{background:#dcecff;color:#07111c;border-color:#dcecff}.output{width:100%;height:96px;margin-top:8px;padding:9px;border:1px solid #27384a;border-radius:9px;background:#05080d;color:#a9bad0;font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;resize:none}.toast{position:fixed;z-index:30;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;padding:9px 14px;border:1px solid #526b82;border-radius:999px;background:#101a27;color:#fff;font-size:12px;transition:.18s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:700px){.app{padding:16px}.preview-frame{max-width:844px;margin:auto}.panel{max-width:844px;margin-left:auto;margin-right:auto}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="title">MOBILE RESULT Y EDITOR</div>
    <div class="seg" id="screenSeg"><button data-screen="normal" class="active">NORMAL</button><button data-screen="auto">AUTO PLAY</button></div>
  </div>
  <div class="preview-frame"><div class="preview-viewport" id="viewport"><div class="canvas-shell" id="shell"><div class="rl-canvas" id="preview"></div></div></div></div>
  <div class="hintbar">横位置は固定です。NORMAL＝左カラム25% / RANKING 75%、AUTO PLAY＝50%、RETRY/HOME＝画面全体50%。要素を直接上下ドラッグするか、下の数値でYだけ調整してください。</div>
  <section class="panel">
    <div class="chips" id="chips"></div>
    <div class="editrow"><div class="selected-name" id="selectedName">曲名</div><label class="ybox"><input id="yValue" inputmode="numeric" type="number" step="1"><span>px</span></label></div>
    <div class="nudges">
      <button class="nudge" data-dy="-10">-10</button><button class="nudge" data-dy="-5">-5</button><button class="nudge" data-dy="-1">-1</button>
      <button class="nudge" data-dy="1">+1</button><button class="nudge" data-dy="5">+5</button><button class="nudge" data-dy="10">+10</button>
    </div>
    <div class="actions"><button class="action" id="resetScreen">この画面を初期化</button><button class="action primary" id="copyValues">値をコピー</button></div>
    <textarea class="output" id="output" readonly></textarea>
  </section>
</div>
<div class="toast" id="toast"></div>
<script src="js/result-layout-shared.js?v=20260902-centerlock1"></script>
<script>
(()=>{'use strict';
const M=globalThis.DruMasterResultLayout,$=id=>document.getElementById(id),KEY='drumasterMobileResultYEditorV1';
const groups={normal:[['title','曲名'],['artist','アーティスト'],['scoreLabel','SCORE'],['score','スコア'],['summary','判定'],['ranking','ランキング'],['buttons','RETRY / HOME']],auto:[['title','曲名'],['artist','アーティスト'],['scoreLabel','SCORE'],['autoText','AUTO PLAY'],['buttons','RETRY / HOME']]};
let data=M.clone(M.base.mobile),screen='normal',selected='title',scale=1,drag=null;
function keysFor(mode,key){return key==='buttons'?['retry','home']:[key]}
function groupY(mode,key){const k=keysFor(mode,key)[0];return M.obj(data[mode][k]).y}
function setGroupY(mode,key,y){y=Math.round(Math.max(-120,Math.min(500,Number(y)||0)));for(const k of keysFor(mode,key)){if(!data[mode]?.[k])continue;const v=M.obj(data[mode][k]);v.y=y;data[mode][k]=M.arr(v)}}
try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw){for(const mode of ['normal','auto'])for(const [key] of groups[mode]){const y=raw?.[mode]?.[key];if(Number.isFinite(+y))setGroupY(mode,key,+y)}}}catch{}
function payload(){const out={version:1,unit:'844x390 design px',normal:{},auto:{}};for(const mode of ['normal','auto'])for(const [key] of groups[mode])out[mode][key]=groupY(mode,key);return out}
function save(){localStorage.setItem(KEY,JSON.stringify(payload()))}
function fit(){const w=$('viewport').clientWidth;scale=w/844;$('viewport').style.height=(390*scale)+'px';$('shell').style.transform=`scale(${scale})`}
function syncControls(){buildChips();$('selectedName').textContent=groups[screen].find(x=>x[0]===selected)?.[1]||selected;$('yValue').value=groupY(screen,selected);$('output').value=JSON.stringify(payload());$('preview').querySelectorAll('.rl-el').forEach(el=>{const g=(el.dataset.key==='retry'||el.dataset.key==='home')?'buttons':el.dataset.key;el.classList.toggle('selected',g===selected)})}
function render(){M.lockMobileCenters({mobile:data});const p=$('preview');p.innerHTML='<i class="guide g25"></i><i class="guide g50"></i><i class="guide g75"></i>';for(const [key,def] of Object.entries(M.defs[screen])){const group=(key==='retry'||key==='home')?'buttons':key;p.appendChild(M.makeElement(key,def,M.obj(data[screen][key]),group===selected))}syncControls();fit()}
function buildChips(){const c=$('chips');c.innerHTML='';for(const [key,label] of groups[screen]){const b=document.createElement('button');b.className='chip'+(key===selected?' active':'');b.textContent=label;b.onclick=()=>{selected=key;syncControls()};c.appendChild(b)}}
function move(dy){setGroupY(screen,selected,groupY(screen,selected)+dy);save();render()}
$('screenSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;screen=b.dataset.screen;selected=groups[screen][0][0];$('screenSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()};
$('yValue').onchange=()=>{setGroupY(screen,selected,$('yValue').value);save();render()};
document.querySelectorAll('[data-dy]').forEach(b=>b.onclick=()=>move(+b.dataset.dy));
$('resetScreen').onclick=()=>{if(!confirm((screen==='normal'?'NORMAL':'AUTO PLAY')+'のY位置を初期値に戻しますか？'))return;for(const [key] of groups[screen])setGroupY(screen,key,groupYBase(screen,key));save();render();toast('初期値に戻しました')};
function groupYBase(mode,key){const k=keysFor(mode,key)[0];return M.obj(M.base.mobile[mode][k]).y}
$('copyValues').onclick=async()=>{const text=JSON.stringify(payload());$('output').value=text;try{await navigator.clipboard.writeText(text)}catch{$('output').focus();$('output').select();document.execCommand('copy')}toast('値をコピーしました')};
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1300)}
$('preview').addEventListener('pointerdown',e=>{const el=e.target.closest('.rl-el');if(!el)return;e.preventDefault();const key=(el.dataset.key==='retry'||el.dataset.key==='home')?'buttons':el.dataset.key;selected=key;syncControls();drag={id:e.pointerId,start:e.clientY,y:groupY(screen,key)};el.setPointerCapture(e.pointerId)});
$('preview').addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dy=Math.round((e.clientY-drag.start)/scale),y=drag.y+dy;setGroupY(screen,selected,y);for(const k of keysFor(screen,selected)){const node=$('preview').querySelector(`.rl-el[data-key="${k}"]`);if(node)node.style.top=groupY(screen,selected)+'px'}$('yValue').value=groupY(screen,selected);$('output').value=JSON.stringify(payload())});
function end(e){if(!drag||e.pointerId!==drag.id)return;drag=null;save();render()}
$('preview').addEventListener('pointerup',end);$('preview').addEventListener('pointercancel',end);
addEventListener('resize',fit);render();
})();
</script>
</body>
</html>
