<!doctype html>
<html lang="ja" class="dm-layout-centered">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080b11">
<title>DruMaster Mobile Result Editor</title>
<link rel="stylesheet" href="css/base.css?v=20260826-maint1">
<link rel="stylesheet" href="css/mobile-game.css?v=20260826-offsets3">
<link rel="stylesheet" href="css/result-ui.css?v=20260830-ranking-title2">
<link rel="stylesheet" href="css/result-actions-fix.css?v=20260826-resultactions2">
<link rel="stylesheet" href="css/result-podium-key-tune.css?v=20260827-resultpodium2">
<link rel="stylesheet" href="css/glass-buttons.css?v=20260828-hoverfullrestore1">
<link rel="stylesheet" href="css/pause-result-readability.css?v=20260830-pc-offsets1">
<link rel="stylesheet" href="css/mobile-centered-layout.css?v=20260828-panelceiling1">
<link rel="stylesheet" href="css/result-mobile-song-offset.css?v=20260902-editor-fit1">
<link rel="stylesheet" href="css/result-mobile-centering-v2.css?v=20260902-v1">
<style>
html,body{background:#000!important}
#result{user-select:none;-webkit-user-select:none}
#result::before{animation:none!important}
#result .dm-edit-selected{outline:2px solid #71dcff!important;outline-offset:3px!important;box-shadow:0 0 0 1px #001018,0 0 12px #71dcff77!important}
#result>.result-actions.dm-edit-selected{outline-offset:5px!important}
.editor-hud{position:absolute;z-index:9999;right:8px;bottom:8px;width:min(356px,42%);padding:7px;border:1px solid rgba(127,151,176,.55);border-radius:13px;background:rgba(5,9,14,.88);box-shadow:0 8px 28px #000a;backdrop-filter:blur(8px);color:#eef6ff;font-family:Inter,system-ui,sans-serif;touch-action:manipulation}
.editor-row{display:flex;align-items:center;gap:5px}.editor-row+.editor-row{margin-top:5px}.editor-seg{display:flex;flex:1;gap:3px;padding:3px;border:1px solid #34475a;border-radius:999px;background:#08111b}.editor-seg button,.editor-hud button,.editor-hud select{height:29px;border:1px solid #3c5064;background:#111d2a;color:#d5e2ee;border-radius:8px;font:800 10px/1 system-ui,sans-serif}.editor-seg button{flex:1;border:0;border-radius:999px}.editor-seg button.active{background:#dcecff;color:#07111c}.editor-hud select{flex:1;min-width:0;padding:0 7px}.editor-hud .nudge{width:38px;flex:0 0 38px;padding:0}.editor-hud .copy{flex:1;background:#dcecff;color:#07111c;border-color:#dcecff}.editor-value{width:64px;flex:0 0 64px;text-align:center;font:800 10px/1 ui-monospace,monospace;color:#9fb3c7}.editor-note{margin-top:5px;font:10px/1.25 system-ui,sans-serif;color:#8295a8;text-align:center}.editor-toast{position:absolute;z-index:10000;left:50%;top:8px;translate:-50% 0;padding:7px 12px;border:1px solid #526a80;border-radius:999px;background:#101a27;color:#fff;font:700 10px/1 system-ui,sans-serif;opacity:0;pointer-events:none;transition:.15s}.editor-toast.show{opacity:1}
@media (hover:hover) and (pointer:fine){body{display:grid;place-items:center}#app{position:relative!important;width:844px!important;height:390px!important;transform:none!important}.screen{width:100%!important;height:100%!important;margin-left:0!important}.editor-hud{width:340px}}
</style>
</head>
<body>
<main id="app">
<section id="result" class="screen result">
  <h2>Ray</h2>
  <p class="result-song-sub">BUMP OF CHICKEN</p>
  <p class="result-score-label">SCORE</p>
  <strong id="finalScore">985,420</strong>
  <div class="result-summary" aria-label="判定内訳">
    <p><span>PERFECT</span><b>428</b></p><p><span>GREAT</span><b>37</b></p><p><span>GOOD</span><b>9</b></p><p><span>MISS</span><b>2</b></p>
  </div>
  <section class="ranking-panel" aria-label="過去のスコアランキング">
    <div class="ranking-title"><h3>RECORD RANKING</h3><span>NEW BEST</span></div>
    <div class="ranking-head"><span>RANK</span><span>SCORE</span><span style="text-align:right">DATE</span></div>
    <div class="ranking-list">
      <div class="ranking-row current best-record"><span class="rank-no">1</span><span class="rank-score-cell"><span class="rank-score">985,420</span><span class="best-badge">BEST</span></span><span class="rank-date">2026.09.01</span></div>
      <div class="ranking-row"><span class="rank-no">2</span><span class="rank-score-cell"><span class="rank-score">973,180</span></span><span class="rank-date">2026.08.31</span></div>
      <div class="ranking-row"><span class="rank-no">3</span><span class="rank-score-cell"><span class="rank-score">961,730</span></span><span class="rank-date">2026.08.30</span></div>
    </div>
  </section>
  <div class="result-actions"><button id="retry" type="button">RETRY</button><button id="home" type="button">HOME</button></div>
</section>
<div class="editor-hud" id="editorHud">
  <div class="editor-row"><div class="editor-seg" id="modeSeg"><button data-mode="normal" class="active">NORMAL</button><button data-mode="auto">AUTO PLAY</button></div></div>
  <div class="editor-row"><select id="elementSelect" aria-label="調整する要素"></select><button class="nudge" data-dy="-5">−5</button><button class="nudge" data-dy="-1">−1</button><button class="nudge" data-dy="1">+1</button><button class="nudge" data-dy="5">+5</button></div>
  <div class="editor-row"><span class="editor-value" id="valueText"></span><button class="copy" id="copyValues">値をコピー</button></div>
  <div class="editor-note">本番と同じ横画面・同じCSSです。要素を直接上下ドラッグできます。</div>
</div>
<div class="editor-toast" id="toast">COPIED</div>
</main>
<script>
(()=>{'use strict';
const root=document.documentElement,app=document.getElementById('app'),result=document.getElementById('result'),select=document.getElementById('elementSelect'),valueText=document.getElementById('valueText');
const defs={
 normal:{title:['曲名','--dm-result-normal-title-y','h2'],artist:['アーティスト','--dm-result-normal-artist-y','.result-song-sub'],scoreLabel:['SCORE','--dm-result-normal-score-label-y','.result-score-label'],score:['スコア','--dm-result-normal-score-y','#finalScore'],summary:['判定','--dm-result-normal-summary-y','.result-summary'],ranking:['ランキング','--dm-result-normal-ranking-y','.ranking-panel'],buttons:['RETRY / HOME','--dm-result-normal-buttons-y','.result-actions']},
 auto:{title:['曲名','--dm-result-auto-title-y','h2'],artist:['アーティスト','--dm-result-auto-artist-y','.result-song-sub'],scoreLabel:['SCORE','--dm-result-auto-score-label-y','.result-score-label'],autoText:['AUTO PLAY','--dm-result-auto-text-y','#finalScore'],buttons:['RETRY / HOME','--dm-result-auto-buttons-y','.result-actions']}
};
const defaults={normal:{title:12.0513,artist:23.5897,scoreLabel:33.3333,score:38.4615,summary:57.9487,ranking:5.6410,buttons:82.0513},auto:{title:12.0513,artist:26.9231,scoreLabel:39.4872,autoText:46.9231,buttons:73.3333}};
let values=JSON.parse(JSON.stringify(defaults)),mode='normal',selected='title',drag=null;
try{const saved=JSON.parse(localStorage.getItem('dm-result-y-editor-v2')||'null');if(saved?.normal&&saved?.auto){for(const m of ['normal','auto'])for(const k of Object.keys(defaults[m]))if(Number.isFinite(+saved[m][k]))values[m][k]=+saved[m][k]}}catch{}
function mobileStage(){const q=matchMedia('(hover:none) and (pointer:coarse) and (max-width:900px)');if(!q.matches)return;const vv=visualViewport,w=Math.max(1,Math.round(vv?vv.width:innerWidth)),h=Math.max(1,Math.round(vv?vv.height:innerHeight));root.style.setProperty('--dm-mobile-stage-w',h+'px');root.style.setProperty('--dm-mobile-stage-h',w+'px')}
function apply(){for(const m of ['normal','auto'])for(const [k,d] of Object.entries(defs[m]))result.style.setProperty(d[1],values[m][k].toFixed(4)+'%');localStorage.setItem('dm-result-y-editor-v2',JSON.stringify(values));valueText.textContent=values[mode][selected].toFixed(2)+'%'}
function buildSelect(){select.innerHTML='';for(const [k,d] of Object.entries(defs[mode])){const o=document.createElement('option');o.value=k;o.textContent=d[0];o.selected=k===selected;select.appendChild(o)}}
function selectedNode(){return result.querySelector(defs[mode][selected][2])}
function highlight(){result.querySelectorAll('.dm-edit-selected').forEach(n=>n.classList.remove('dm-edit-selected'));selectedNode()?.classList.add('dm-edit-selected')}
function setMode(next){mode=next;result.classList.toggle('autoplay',mode==='auto');document.getElementById('finalScore').textContent=mode==='auto'?'AUTO PLAY':'985,420';document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));selected=Object.keys(defs[mode])[0];buildSelect();apply();highlight()}
function pointLocal(e){const t=getComputedStyle(app).transform;if(!t||t==='none')return new DOMPoint(e.clientX,e.clientY);try{return new DOMPoint(e.clientX,e.clientY).matrixTransform(new DOMMatrix(t).inverse())}catch{return new DOMPoint(e.clientX,e.clientY)}}
function clamp(v){return Math.max(-20,Math.min(120,v))}
function move(deltaPct){values[mode][selected]=clamp(values[mode][selected]+deltaPct);apply();highlight()}
function selectFromTarget(target){for(const [k,d] of Object.entries(defs[mode])){const node=result.querySelector(d[2]);if(node&&(target===node||node.contains(target))){selected=k;select.value=k;apply();highlight();return true}}return false}
document.getElementById('modeSeg').onclick=e=>{const b=e.target.closest('button[data-mode]');if(b)setMode(b.dataset.mode)};
select.onchange=()=>{selected=select.value;apply();highlight()};
document.querySelectorAll('[data-dy]').forEach(b=>b.onclick=()=>move((+b.dataset.dy/result.clientHeight)*100));
result.addEventListener('pointerdown',e=>{if(e.target.closest('#editorHud'))return;if(!selectFromTarget(e.target))return;e.preventDefault();const p=pointLocal(e),node=selectedNode();drag={id:e.pointerId,startY:p.y,startValue:values[mode][selected],node};node?.setPointerCapture?.(e.pointerId)});
result.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;e.preventDefault();const p=pointLocal(e),delta=((p.y-drag.startY)/result.clientHeight)*100;values[mode][selected]=clamp(drag.startValue+delta);apply();highlight()});
function endDrag(e){if(!drag||e.pointerId!==drag.id)return;drag=null;apply()}
result.addEventListener('pointerup',endDrag);result.addEventListener('pointercancel',endDrag);
document.getElementById('copyValues').onclick=async()=>{const payload={version:2,unit:'percent of actual mobile #result height',normal:{},auto:{}};for(const m of ['normal','auto'])for(const k of Object.keys(defs[m]))payload[m][k]=+values[m][k].toFixed(4);const text=JSON.stringify(payload);try{await navigator.clipboard.writeText(text)}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}const toast=document.getElementById('toast');toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),1000)};
addEventListener('resize',mobileStage,{passive:true});addEventListener('orientationchange',()=>setTimeout(mobileStage,50),{passive:true});visualViewport?.addEventListener('resize',mobileStage,{passive:true});mobileStage();buildSelect();setMode('normal');
})();
</script>
</body>
</html>
