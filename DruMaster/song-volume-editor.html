<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070b11">
<title>DruMaster Volume Balance</title>
<link rel="stylesheet" href="css/song-tool-cyan-violet-theme.css?v=20260829-theme3">
<style>
:root{color-scheme:dark;--bg:#070b11;--panel:#101720;--line:#2d3d4e;--text:#eef5fb;--muted:#8b9aab;--accent:#63c3ff;--ok:#72d6a6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 Inter,"Noto Sans JP",system-ui,sans-serif}main{width:min(600px,calc(100% - 28px));margin:30px auto 60px}header{text-align:center;margin-bottom:20px}.eyebrow{font-size:9px;font-weight:800;letter-spacing:.18em;color:#7c8fa3;margin:0 0 5px}h1{margin:0;font-size:28px}.sub{margin:6px 0 0;color:var(--muted);font-size:11px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:17px;margin-bottom:14px}.panel h2{text-align:center;margin:0 0 16px;font-size:16px;letter-spacing:.1em;color:#c3d1df}.row{display:grid;grid-template-columns:135px 1fr 74px auto;gap:10px;align-items:center;min-height:42px;border-top:1px solid #202d39}.row:first-of-type{border-top:0}.row label{font-weight:700;color:#b4c2d1}.row input[type=range]{width:100%}.value{height:32px;border:1px solid #34485d;border-radius:7px;background:#070d13;color:#edf4fb;text-align:right;padding:0 8px;font:700 12px ui-monospace,SFMono-Regular,Consolas,monospace;width:74px}.preview{height:31px;min-width:48px;border:1px solid #35516a;border-radius:7px;background:#0a1823;color:#dcecf7;cursor:pointer}.master-row{grid-template-columns:135px 1fr 74px}.checkline{display:flex;justify-content:center;align-items:center;gap:8px;margin:10px 0 2px;color:#b6c4d2;font-weight:700}.individual{margin-top:12px;border-top:1px solid #273746;padding-top:2px}.individual[hidden]{display:none}.transport{display:flex;justify-content:center;gap:9px;margin-bottom:14px}.transport button{height:38px;padding:0 18px;border:1px solid #385c78;border-radius:8px;background:#0b1c29;color:#e5f5ff;font-weight:750;cursor:pointer}.transport button:disabled{opacity:.4;cursor:not-allowed}.status{text-align:center;color:#7f91a4;font-size:10px;min-height:18px}.status.ok{color:var(--ok)}.save-state{text-align:center;color:#7f91a4;font:10px ui-monospace,monospace;margin-top:6px}@media(max-width:560px){main{width:min(100% - 18px,600px);margin-top:20px}.row,.master-row{grid-template-columns:1fr 74px auto}.row label{grid-column:1/-1}.master-row label{grid-column:1/-1}.master-row{grid-template-columns:1fr 74px}.preview{min-width:54px}}
</style>
</head>
<body><main>
<header><p class="eyebrow">DRUMASTER / CONTENT TOOL</p><h1>音量バランス調整</h1><p id="songTitle" class="sub">ローカル素材を読み込み中…</p></header>
<div class="transport"><button id="mixPlay" type="button" disabled>▶ MIX再生</button><button id="mixStop" type="button" disabled>■ 停止</button></div>
<section class="panel"><h2>AUDIO SOURCES</h2><div id="stemRows"></div></section>
<section class="panel"><h2>MIDI DRUMS</h2>
<div class="row master-row"><label for="midiMaster">ドラム全体</label><input id="midiMaster" type="range" min="0" max="150" step="1" value="100"><input id="midiMasterValue" class="value" type="number" min="0" max="150" step="1" value="100"></div>
<label class="checkline"><input id="individualToggle" type="checkbox"> 個別に調節する</label>
<div id="individualPanel" class="individual" hidden>
<div class="row"><label for="cymbal">シンバル</label><input id="cymbal" type="range" min="0" max="200" step="1" value="120"><input id="cymbalValue" class="value" type="number" min="0" max="200" step="1" value="120"><button class="preview" data-preview="cymbal" type="button">試聴</button></div>
<div class="row"><label for="hihatRide">ハイハット／ライド</label><input id="hihatRide" type="range" min="0" max="200" step="1" value="100"><input id="hihatRideValue" class="value" type="number" min="0" max="200" step="1" value="100"><button class="preview" data-preview="hihatRide" type="button">試聴</button></div>
<div class="row"><label for="snareTom">スネア／タム</label><input id="snareTom" type="range" min="0" max="200" step="1" value="100"><input id="snareTomValue" class="value" type="number" min="0" max="200" step="1" value="100"><button class="preview" data-preview="snareTom" type="button">試聴</button></div>
<div class="row"><label for="kick">バスドラム</label><input id="kick" type="range" min="0" max="200" step="1" value="140"><input id="kickValue" class="value" type="number" min="0" max="200" step="1" value="140"><button class="preview" data-preview="kick" type="button">試聴</button></div>
<div class="row"><label for="other">その他</label><input id="other" type="range" min="0" max="200" step="1" value="100"><input id="otherValue" class="value" type="number" min="0" max="200" step="1" value="100"><button class="preview" data-preview="other" type="button">試聴</button></div>
</div>
</section>
<div id="status" class="status">調整値は自動保存されます。</div><div id="saveState" class="save-state"></div>
</main>
<script src="js/song-tool-range-theme.js?v=20260829-range1"></script>
<script src="js/song-volume-transport-ui.js?v=20260829-restore1"></script>
<script src="js/song-volume-editor-v4.js?v=20260829-lazy1"></script>
<script src="js/song-volume-existing-publish.js?v=20260829-existing1"></script>
</body></html>
