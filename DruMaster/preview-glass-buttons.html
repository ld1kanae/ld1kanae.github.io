<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070b11">
  <title>Glass Button Preview | DruMaster</title>
  <link rel="stylesheet" href="css/glass-button-lab.css?v=20260827-glasslab7">
</head>
<body>
  <main class="lab">
    <header class="lab-head">
      <p>DRUMASTER / UI MATERIAL LAB</p>
      <h1>Glass Button Preview</h1>
      <small>本番UIには未適用。透過PNGの材質をCSSだけで再現するテストです。</small>
    </header>
    <section class="preview-panel">
      <div class="preview-row"><div class="preview-label">REFERENCE SCALE / CIRCLE</div><button class="glass-btn reference-circle"><span>GLASS</span></button></div>
      <div class="preview-row"><div class="preview-label">PILL / STANDARD</div><button class="glass-btn"><span>ホーム</span></button><button class="glass-btn primary"><span>リトライ</span></button><button class="glass-btn violet"><span>終了</span></button></div>
      <div class="preview-row"><div class="preview-label">PILL / SIZE VARIATION</div><button class="glass-btn compact"><span>やり直す</span></button><button class="glass-btn wide primary"><span>演奏を開始</span></button></div>
      <div class="preview-row"><div class="preview-label">OTHER SHAPES — SAME MATERIAL</div><button class="glass-btn rounded"><span>設定</span></button><button class="glass-btn square primary"><span>Ⅱ</span></button><button class="glass-btn circle"><span>▶</span></button></div>
    </section>
    <p class="note">リムは前版を維持。内側は全高10%グラデーション＋下側内周に沿うぼかしコースティクス＋ブラー影です。円形グラデーションは使っていません。</p>
  </main>
</body>
</html>
