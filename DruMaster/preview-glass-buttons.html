<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070b11">
  <title>Glass Button Preview | DruMaster</title>
  <link rel="stylesheet" href="css/glass-button-lab.css?v=20260827-glasslab1">
</head>
<body>
  <main class="lab">
    <header class="lab-head">
      <p>DRUMASTER / UI MATERIAL LAB</p>
      <h1>Glass Button Preview</h1>
      <small>本番UIには未適用。ガラス表現だけを確認するための専用ページです。</small>
    </header>

    <section class="preview-panel">
      <div class="preview-row">
        <div class="preview-label">PILL / STANDARD</div>
        <button class="glass-btn">ホーム</button>
        <button class="glass-btn primary">リトライ</button>
        <button class="glass-btn violet">終了</button>
      </div>

      <div class="preview-row">
        <div class="preview-label">PILL / SIZE VARIATION</div>
        <button class="glass-btn compact">やり直す</button>
        <button class="glass-btn wide primary">演奏を開始</button>
      </div>

      <div class="preview-row">
        <div class="preview-label">OTHER SHAPES — SAME GLASS MATERIAL</div>
        <button class="glass-btn rounded">設定</button>
        <button class="glass-btn square primary">Ⅱ</button>
        <button class="glass-btn circle">▶</button>
      </div>
    </section>

    <p class="note">hover / press も確認できます。形状は border-radius とサイズだけ変更し、ガラス材質は共通です。</p>
  </main>
</body>
</html>
