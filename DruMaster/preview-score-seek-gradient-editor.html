<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DruMaster Seekbar Spectrum Editor</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
html,body{margin:0;min-height:100%;background:#050a12;color:#edf5fc;font-family:Inter,"Noto Sans JP",system-ui,sans-serif}
button,input,textarea{font:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:9px;min-height:50px;padding:9px 14px;background:rgba(3,8,15,.95);backdrop-filter:blur(14px);border-bottom:1px solid rgba(158,190,215,.16)}
.top strong{font-size:11px;letter-spacing:.16em}.top span{font-size:9px;color:#8193a5}.top .spacer{flex:1}
.preset{border:1px solid rgba(152,187,214,.22);border-radius:8px;background:#0d1723;color:#9dafc0;padding:7px 9px;font-size:9px;font-weight:850;cursor:pointer}.preset:hover,.preset.active{background:#17283a;border-color:rgba(173,214,241,.5);color:#fff}
.layout{display:grid;grid-template-columns:370px minmax(0,1fr);min-height:calc(100vh - 50px)}
.panel{padding:14px 16px 28px;background:#07101a;border-right:1px solid rgba(145,175,198,.14)}
h2{margin:0;font-size:12px;letter-spacing:.13em}.desc{margin:6px 0 14px;color:#8092a5;font-size:10px;line-height:1.55}.section{margin:17px 0 9px;padding-top:10px;border-top:1px solid rgba(145,175,198,.14);font-size:9px;font-weight:900;letter-spacing:.14em;color:#80ddff}
.ctrl{margin:0 0 11px}.head{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-bottom:5px}.head label{font-size:10px;color:#9eafbf}.head output{font-size:10px;color:#f0f7fd;font-weight:800;font-variant-numeric:tabular-nums}.ctrl input[type=range]{width:100%;accent-color:#7ddcff}.check{display:flex;gap:7px;align-items:center;margin:0 0 9px;color:#9eafbf;font-size:10px}.check input{accent-color:#7ddcff}.colorrow{display:grid;grid-template-columns:44px 1fr;gap:7px}.colorrow input[type=color]{width:44px;height:29px;padding:2px;border:1px solid #34485b;border-radius:6px;background:#0a1320}.colorrow input[type=text]{height:29px;border:1px solid #34485b;border-radius:6px;background:#0a1320;color:#dce8f4;padding:0 8px;font:10px ui-monospace,Consolas,monospace;text-transform:uppercase}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:15px}.actions button{border:1px solid rgba(151,186,214,.26);border-radius:8px;background:#111e2b;color:#dceaf6;padding:9px 7px;font-size:9px;font-weight:850;cursor:pointer}.json{width:100%;height:180px;margin-top:8px;padding:9px;border:1px solid rgba(149,181,207,.18);border-radius:8px;background:#050b13;color:#91a7ba;font:9px/1.5 ui-monospace,Consolas,monospace;resize:vertical}
.preview{display:flex;align-items:center;justify-content:center;padding:24px;min-width:0;background:radial-gradient(circle at 50% 30%,#132235,#050a12 68%)}
.stage{width:min(900px,100%);padding:28px;border:1px solid rgba(158,190,215,.18);border-radius:16px;background:linear-gradient(180deg,rgba(16,25,37,.95),rgba(5,10,17,.96));box-shadow:0 24px 60px rgba(0,0,0,.4)}
.modebar{display:flex;align-items:center;gap:8px;margin-bottom:38px}.song{min-width:0}.song b{display:block;font-size:14px}.song small{font-size:9px;color:#8897a7}.spacer2{flex:1}.sq{width:42px;height:42px;border:1px solid rgba(203,222,235,.28);border-radius:12px;background:rgba(7,17,24,.42);display:grid;place-items:center;color:#eaf3fa}.sq svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.sq .fill{fill:currentColor;stroke:none}
.preview-title{font-size:9px;font-weight:900;letter-spacing:.16em;color:#7e91a4;margin-bottom:8px}.seek-shell{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid rgba(100,120,139,.30);border-radius:999px;background:rgba(6,16,26,.76);backdrop-filter:blur(5px)}
.trackbox{position:relative;flex:1;min-width:0;height:24px;display:flex;align-items:center}.track{position:relative;width:100%;height:7px;border:1px solid rgba(255,255,255,.14);border-radius:999px;overflow:hidden;background:var(--base,#171e26)}
.spectrum{position:absolute;top:-1px;bottom:-1px;left:var(--left,0%);width:var(--width,100%);background:linear-gradient(90deg,#d759a8 0%,#cf6f8b 14%,#bfbc4b 29%,#6bb77e 43%,#47c9be 57%,#4095cf 71%,#4d65be 86%,#c25cc5 100%);opacity:var(--op,.7);filter:brightness(var(--br,1)) saturate(var(--sat,1));-webkit-mask-image:var(--mask);mask-image:var(--mask);-webkit-mask-size:100% 100%;mask-size:100% 100%}
.unreached{position:absolute;top:-1px;bottom:-1px;right:-1px;width:calc(100% - var(--progress,55%));background:var(--unreached,#343c44)}
.thumb{position:absolute;z-index:3;top:50%;left:var(--progress,55%);width:15px;height:15px;border-radius:50%;background:#c8d7e2;box-shadow:0 0 7px rgba(123,220,255,.08);transform:translate(-50%,-50%)}
.time{min-width:78px;text-align:right;color:#b1bfcc;font:800 9px/1 ui-monospace,Consolas,monospace;white-space:nowrap}
.mobile-demo{margin-top:32px;width:min(520px,100%)}.mobile-demo .seek-shell{height:25px;padding:3px 8px}.mobile-demo .time{font-size:8px;min-width:64px}.mobile-demo .trackbox{height:18px}
.legend{margin-top:30px;padding-top:14px;border-top:1px solid rgba(145,175,198,.12);color:#8192a3;font-size:10px;line-height:1.55}.legend b{color:#d7e4ef}
@media(max-width:950px){.layout{grid-template-columns:1fr}.panel{border-right:0;border-bottom:1px solid rgba(145,175,198,.14)}.preview{padding:16px}.stage{padding:20px}}
</style>
</head>
<body>
<div class="top"><strong>SEEK SPECTRUM EDITOR</strong><span>楽譜再生モード / 本番未反映</span><div class="spacer"></div><button class="preset" data-preset="current">CURRENT</button><button class="preset" data-preset="muted">MUTED</button><button class="preset" data-preset="air">AIR GAP</button><button class="preset" data-preset="hover">HOVER-LIKE</button></div>
<div class="layout">
<aside class="panel">
<h2>虹色グラデーション</h2><p class="desc">虹色の帯幅と位置を変え、途中に背景が透ける「抜け」を作れます。透明度・明度・彩度は虹色だけに作用します。</p>
<div class="section">虹色の範囲</div>
<div class="ctrl"><div class="head"><label>虹色帯の幅</label><output id="oWidth"></output></div><input id="width" type="range" min="30" max="180" step="1" value="100"></div>
<div class="ctrl"><div class="head"><label>虹色帯の中心位置</label><output id="oCenter"></output></div><input id="center" type="range" min="0" max="100" step="1" value="50"></div>
<div class="ctrl"><div class="head"><label>両端フェード</label><output id="oEdge"></output></div><input id="edge" type="range" min="0" max="25" step="1" value="0"></div>
<div class="section">虹色の質感</div>
<div class="ctrl"><div class="head"><label>虹色の透明度</label><output id="oOpacity"></output></div><input id="opacity" type="range" min="0" max="1" step="0.01" value="1"></div>
<div class="ctrl"><div class="head"><label>明度</label><output id="oBrightness"></output></div><input id="brightness" type="range" min="40" max="130" step="1" value="100"></div>
<div class="ctrl"><div class="head"><label>彩度</label><output id="oSaturation"></output></div><input id="saturation" type="range" min="20" max="160" step="1" value="100"></div>
<div class="section">背景が抜ける部分</div>
<label class="check"><input id="gap1On" type="checkbox">抜け 1 を使用</label>
<div class="ctrl"><div class="head"><label>抜け1 中心</label><output id="oGap1Center"></output></div><input id="gap1Center" type="range" min="0" max="100" step="1" value="38"></div>
<div class="ctrl"><div class="head"><label>抜け1 幅</label><output id="oGap1Width"></output></div><input id="gap1Width" type="range" min="0" max="35" step="1" value="12"></div>
<label class="check"><input id="gap2On" type="checkbox">抜け 2 を使用</label>
<div class="ctrl"><div class="head"><label>抜け2 中心</label><output id="oGap2Center"></output></div><input id="gap2Center" type="range" min="0" max="100" step="1" value="72"></div>
<div class="ctrl"><div class="head"><label>抜け2 幅</label><output id="oGap2Width"></output></div><input id="gap2Width" type="range" min="0" max="35" step="1" value="10"></div>
<div class="ctrl"><div class="head"><label>抜けの境界ぼかし</label><output id="oSoft"></output></div><input id="soft" type="range" min="0" max="12" step="1" value="4"></div>
<div class="section">シークバー全体</div>
<div class="ctrl"><div class="head"><label>再生位置</label><output id="oProgress"></output></div><input id="progress" type="range" min="0" max="100" step="1" value="58"></div>
<div class="ctrl"><div class="head"><label>未到達部分の明るさ</label><output id="oUnreached"></output></div><input id="unreachedLight" type="range" min="8" max="38" step="1" value="24"></div>
<div class="ctrl"><div class="head"><label>下地</label><output id="oBase">#171E26</output></div><div class="colorrow"><input id="base" type="color" value="#171e26"><input id="baseHex" type="text" value="#171E26" maxlength="7"></div></div>
<div class="actions"><button id="copy">設定値をコピー</button><button id="reset">CURRENTへ戻す</button></div><textarea id="json" class="json" readonly></textarea>
</aside>
<main class="preview"><div class="stage">
<div class="modebar"><div class="song"><b>なないろ</b><small>BUMP OF CHICKEN</small></div><div class="spacer2"></div><div class="sq"><svg viewBox="0 0 24 24"><path d="M6 5v14"/><path class="fill" d="M18 5.5 9 12l9 6.5z"/></svg></div><div class="sq"><svg viewBox="0 0 24 24"><path d="M18 5v14"/><path class="fill" d="m6 5.5 9 6.5-9 6.5z"/></svg></div><div class="sq"><svg viewBox="0 0 24 24"><path d="m17 4 3 3-3 3"/><path d="M4 11V9a2 2 0 0 1 2-2h14"/><path d="m7 20-3-3 3-3"/><path d="M20 13v2a2 2 0 0 1-2 2H4"/></svg></div><div class="sq"><svg viewBox="0 0 18 18"><rect x="2" y="1" width="4" height="16" rx="1.5" fill="currentColor" stroke="none"/><rect x="12" y="1" width="4" height="16" rx="1.5" fill="currentColor" stroke="none"/></svg></div></div>
<div class="preview-title">PC SIZE</div><div class="seek-shell"><div class="trackbox"><div class="track"><div class="spectrum"></div><div class="unreached"></div></div><div class="thumb"></div></div><div class="time">1:34 / 2:42</div></div>
<div class="mobile-demo"><div class="preview-title">SMARTPHONE SIZE</div><div class="seek-shell"><div class="trackbox"><div class="track"><div class="spectrum"></div><div class="unreached"></div></div><div class="thumb"></div></div><div class="time">1:34 / 2:42</div></div></div>
<div class="legend"><b>「抜け」</b>は虹色レイヤーのalphaだけを落とすので、そこでは下地色が見えます。未到達部分は本番と同じく上からニュートラルグレーを被せています。</div>
</div></main></div>
<script>
const $=id=>document.getElementById(id);const ids=['width','center','edge','opacity','brightness','saturation','gap1On','gap1Center','gap1Width','gap2On','gap2Center','gap2Width','soft','progress','unreachedLight','base'];const c=Object.fromEntries(ids.map(id=>[id,$(id)]));
const presets={current:{width:100,center:50,edge:0,opacity:1,brightness:100,saturation:100,gap1On:false,gap1Center:38,gap1Width:12,gap2On:false,gap2Center:72,gap2Width:10,soft:4,progress:58,unreachedLight:24,base:'#171e26'},muted:{width:94,center:50,edge:7,opacity:.62,brightness:76,saturation:82,gap1On:false,gap1Center:38,gap1Width:12,gap2On:false,gap2Center:72,gap2Width:10,soft:4,progress:58,unreachedLight:20,base:'#151c23'},air:{width:108,center:49,edge:8,opacity:.68,brightness:80,saturation:88,gap1On:true,gap1Center:42,gap1Width:13,gap2On:true,gap2Center:76,gap2Width:8,soft:5,progress:58,unreachedLight:19,base:'#151c23'},hover:{width:116,center:48,edge:12,opacity:.58,brightness:82,saturation:92,gap1On:true,gap1Center:34,gap1Width:18,gap2On:true,gap2Center:70,gap2Width:14,soft:7,progress:58,unreachedLight:18,base:'#131a21'}};
function hexok(v){return /^#[0-9a-f]{6}$/i.test(v)}
function alphaAt(p){let a=1,edge=+c.edge.value;if(edge>0){a*=Math.min(1,p/edge,(100-p)/edge)}const soft=+c.soft.value;for(const n of [1,2]){if(!c['gap'+n+'On'].checked)continue;const center=+c['gap'+n+'Center'].value,w=+c['gap'+n+'Width'].value/2,d=Math.abs(p-center);if(d<=w)a=0;else if(soft>0&&d<w+soft)a*=Math.min(1,(d-w)/soft)}return Math.max(0,Math.min(1,a))}
function mask(){const stops=[];for(let p=0;p<=100;p+=2)stops.push(`rgba(0,0,0,${alphaAt(p).toFixed(3)}) ${p}%`);return `linear-gradient(90deg,${stops.join(',')})`}
function config(){return {spectrumWidthPercent:+c.width.value,spectrumCenterPercent:+c.center.value,edgeFadePercent:+c.edge.value,opacity:+c.opacity.value,brightnessPercent:+c.brightness.value,saturationPercent:+c.saturation.value,gap1:{enabled:c.gap1On.checked,centerPercent:+c.gap1Center.value,widthPercent:+c.gap1Width.value},gap2:{enabled:c.gap2On.checked,centerPercent:+c.gap2Center.value,widthPercent:+c.gap2Width.value},gapSoftnessPercent:+c.soft.value,previewProgressPercent:+c.progress.value,unreachedLightnessPercent:+c.unreachedLight.value,baseColor:c.base.value.toUpperCase()}}
function apply(){const width=+c.width.value,center=+c.center.value,left=center-width/2,m=mask(),un=`hsl(210 12% ${c.unreachedLight.value}%)`;document.querySelectorAll('.track').forEach(t=>{t.style.setProperty('--base',c.base.value);t.querySelector('.spectrum').style.setProperty('--left',left+'%');t.querySelector('.spectrum').style.setProperty('--width',width+'%');t.querySelector('.spectrum').style.setProperty('--op',c.opacity.value);t.querySelector('.spectrum').style.setProperty('--br',(+c.brightness.value/100).toFixed(2));t.querySelector('.spectrum').style.setProperty('--sat',(+c.saturation.value/100).toFixed(2));t.querySelector('.spectrum').style.setProperty('--mask',m);t.querySelector('.unreached').style.setProperty('--unreached',un);t.querySelector('.unreached').style.setProperty('--progress',c.progress.value+'%')});document.querySelectorAll('.trackbox').forEach(t=>t.querySelector('.thumb').style.setProperty('--progress',c.progress.value+'%'));
$('oWidth').textContent=c.width.value+'%';$('oCenter').textContent=c.center.value+'%';$('oEdge').textContent=c.edge.value+'%';$('oOpacity').textContent=(+c.opacity.value).toFixed(2);$('oBrightness').textContent=c.brightness.value+'%';$('oSaturation').textContent=c.saturation.value+'%';$('oGap1Center').textContent=c.gap1Center.value+'%';$('oGap1Width').textContent=c.gap1Width.value+'%';$('oGap2Center').textContent=c.gap2Center.value+'%';$('oGap2Width').textContent=c.gap2Width.value+'%';$('oSoft').textContent=c.soft.value+'%';$('oProgress').textContent=c.progress.value+'%';$('oUnreached').textContent=c.unreachedLight.value+'%';$('oBase').textContent=c.base.value.toUpperCase();$('baseHex').value=c.base.value.toUpperCase();$('json').value=JSON.stringify(config(),null,2);document.querySelectorAll('.preset').forEach(b=>b.classList.remove('active'))}
function preset(name){const p=presets[name];for(const [k,v] of Object.entries(p)){const el=c[k];if(!el)continue;if(el.type==='checkbox')el.checked=v;else el.value=v}document.querySelectorAll('.preset').forEach(b=>b.classList.toggle('active',b.dataset.preset===name));apply();document.querySelector(`[data-preset="${name}"]`)?.classList.add('active')}
Object.values(c).forEach(el=>{el.addEventListener('input',apply);el.addEventListener('change',apply)});$('baseHex').addEventListener('change',()=>{let v=$('baseHex').value.trim();if(v[0]!=='#')v='#'+v;if(hexok(v)){c.base.value=v;apply()}else $('baseHex').value=c.base.value.toUpperCase()});document.querySelectorAll('.preset').forEach(b=>b.addEventListener('click',()=>preset(b.dataset.preset)));$('reset').addEventListener('click',()=>preset('current'));$('copy').addEventListener('click',async()=>{const s=JSON.stringify(config(),null,2);try{await navigator.clipboard.writeText(s);$('copy').textContent='コピーしました';setTimeout(()=>$('copy').textContent='設定値をコピー',900)}catch{$('json').select()}});preset('current');
</script>
</body></html>
