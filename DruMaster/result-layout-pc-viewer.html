<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DruMaster PC Result Viewer</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b11;color:#fff;font-family:Arial,Helvetica,sans-serif}
#viewer{position:fixed;inset:0;background:
radial-gradient(circle at 22% 26%,rgba(72,129,190,.20),transparent 34%),
radial-gradient(circle at 24% 76%,rgba(177,104,255,.12),transparent 38%),
linear-gradient(180deg,#0d1723 0%,#070b11 70%);}
.el{position:absolute;box-sizing:border-box;text-align:center}
.title{font-weight:800;font-style:italic}
.artist,.score-label{color:#8a98aa}
.score-label{font-weight:800}
.score{font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-style:italic;color:transparent;-webkit-text-fill-color:transparent;-webkit-text-stroke:1.2px #fff;background:linear-gradient(105deg,#fff 0%,#ffd8f6 13%,#6cecff 29%,#fff1a0 44%,#d18cff 62%,#72edff 81%,#fff 100%);background-clip:text;-webkit-background-clip:text;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 8px rgba(95,226,255,.58))}
.summary{display:grid;grid-template-columns:repeat(4,1fr);align-items:start}.summary small{display:block;color:#8794a6}.summary b{display:block;margin-top:3px;color:#eef6ff}
.ranking{border:1px solid rgba(147,169,195,.34);border-radius:16px;background:rgba(9,15,23,.68);padding:13px 18px;overflow:hidden;text-align:left}.ranking h3{margin:0 0 12px;text-align:center;letter-spacing:.12em}.rhead,.rrow{display:grid;grid-template-columns:64px 1fr 130px;align-items:center;min-height:34px}.rhead{color:#738195;font-size:.55em;border-bottom:1px solid rgba(255,255,255,.08)}.rrow{border-bottom:1px solid rgba(255,255,255,.045)}.rrow.best{background:linear-gradient(90deg,rgba(255,232,145,.12),rgba(102,231,255,.13) 45%,rgba(199,137,255,.12));box-shadow:inset 2px 0 #ffe77a}.right{text-align:right}.badge{display:inline-block;margin-left:8px;padding:2px 6px;border:1px solid rgba(255,234,145,.72);border-radius:999px;color:#fff2ad;font-size:.55em}
.btn{display:grid;place-items:center;border:1px solid #7890a9;border-radius:999px;background:rgba(18,28,41,.65);font-weight:900;letter-spacing:.08em}
#mode{position:absolute;left:20px;bottom:18px;display:flex;border:1px solid #28374a;border-radius:999px;overflow:hidden;background:#0b111b;font-size:12px;z-index:5}#mode button{border:0;background:transparent;color:#c9d3df;padding:10px 16px;cursor:pointer}#mode button.on{background:#dbeeff;color:#0b1824}
</style>
</head>
<body>
<div id="viewer"></div>
<div id="mode"><button data-mode="normal" class="on">NORMAL</button><button data-mode="auto">AUTO PLAY</button></div>
<script>
(()=>{
 const V=document.getElementById('viewer');
 const base={
 normal:{title:[180,125,280,58,48,1.05,1],artist:[160,200,320,34,24,1.15,1],scoreLabel:[230,270,180,28,21,1,7],score:[60,305,520,110,92,.9,1],summary:[85,420,470,78,16,1.1,1],ranking:[665,113,590,390,20,1.1,1],retry:[441,600,190,48,15,1.2,1],home:[649,600,190,48,15,1.2,1]},
 auto:{title:[500,91,280,58,48,1.05,1],artist:[500,166,300,36,24,1.15,1],scoreLabel:[560,245,160,30,21,1,7],score:[395,285,490,120,92,.9,1],retry:[438,455,190,48,15,1.2,1],home:[652,455,190,48,15,1.2,1]}
 };
 let mode='normal';
 const pct=(n,d)=>n/d*100+'%';
 function add(key,v,html,cls){const e=document.createElement('div');e.className='el '+cls;e.innerHTML=html;e.style.left=pct(v[0],1280);e.style.top=pct(v[1],720);e.style.width=pct(v[2],1280);e.style.height=pct(v[3],720);e.style.fontSize=`calc(${v[4]/720*100}vh)`;e.style.lineHeight=v[5];e.style.letterSpacing=v[6]+'px';V.appendChild(e)}
 function render(){V.innerHTML='';const d=base[mode];add('title',d.title,'なないろ','title');add('artist',d.artist,'BUMP OF CHICKEN','artist');add('scoreLabel',d.scoreLabel,'S C O R E','score-label');
 if(mode==='normal'){
  add('score',d.score,'990,158','score');
  add('summary',d.summary,'<div><small>PERFECT</small><b>1037</b></div><div><small>GREAT</small><b>206</b></div><div><small>GOOD</small><b>8</b></div><div><small>MISS</small><b>16</b></div>','summary');
  add('ranking',d.ranking,'<h3>RECORD RANKING</h3><div class="rhead"><span>RANK</span><span>SCORE</span><span class="right">DATE</span></div><div class="rrow best"><span>1</span><b>990,158 <span class="badge">BEST</span></b><span class="right">2026.09.04</span></div><div class="rrow"><span>2</span><b>985,420</b><span class="right">2026.09.01</span></div><div class="rrow"><span>3</span><b>973,180</b><span class="right">2026.08.31</span></div>','ranking');
 }else add('score',d.score,'AUTO PLAY','score');
 add('retry',d.retry,'RETRY','btn');add('home',d.home,'HOME','btn');
 }
 document.getElementById('mode').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.mode;document.querySelectorAll('#mode button').forEach(x=>x.classList.toggle('on',x===b));render()};
 render();
})();
</script>
</body>
</html>
