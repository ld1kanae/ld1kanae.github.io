<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DruMaster 過去記録復旧</title><style>body{font-family:system-ui,sans-serif;background:#080b11;color:#eef6ff;margin:0;padding:24px}main{max-width:980px;margin:auto}button{font:inherit;padding:10px 16px;margin:8px 8px 8px 0}pre{white-space:pre-wrap;word-break:break-word;background:#111923;padding:14px;border-radius:8px;max-height:55vh;overflow:auto}.ok{color:#8ff0b0}.warn{color:#ffd37a}</style></head><body><main><h1>DruMaster 過去記録復旧</h1><p>このページは同じ GitHub Pages オリジンに残っているブラウザ保存領域を直接走査します。</p><button id="run">保存領域を再走査して同期</button><button id="copy">診断結果をコピー</button><p id="state">待機中</p><pre id="report"></pre></main><script>
(()=>{'use strict';
const API='https://drumaster-ranking-api.aoka45utau.workers.dev',TARGET_DB='drumaster-ranking',TARGET_STORE='plays';
const $=s=>document.querySelector(s),state=$('#state'),out=$('#report');let lastReport=null;
const safe=s=>String(s??'').trim().replace(/[^A-Za-z0-9._:-]/g,'_');
const hash32=t=>{let h=2166136261;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16).padStart(8,'0')};
const lowerObject=o=>{const m={};if(o&&typeof o==='object'&&!Array.isArray(o))for(const[k,v]of Object.entries(o))m[String(k).toLowerCase()]=v;return m};
const pick=(m,names)=>{for(const n of names){const v=m[n.toLowerCase()];if(v!=null)return v}return null};
const num=v=>{if(typeof v==='string')v=v.replace(/[,\s]/g,'');const n=Number(v);return Number.isFinite(n)?n:null};
const int=v=>Math.max(0,Math.trunc(num(v)||0));
const score=v=>{const n=num(v);return n!=null&&n>0&&n<=1000000?Math.trunc(n):null};
function parseText(s){if(typeof s!=='string')return s;const t=s.trim();if(!t)return null;try{return JSON.parse(t)}catch{};try{const u=new URLSearchParams(t);if([...u.keys()].length>=2)return Object.fromEntries(u)}catch{};return t}
function normalize(v,source,ctx={}){if(v==null)return null;if(typeof v==='number'){const n=score(v);return n&&/(score|best|record|result|play|history|drum)/i.test(source)?{source,score:n,songId:ctx.songId||'nanairo',scoreOnly:true}:null}if(typeof v==='string'){const m=v.match(/(?:score|best|point|result)\D{0,12}([0-9][0-9,]{2,7})/i);if(m){const n=score(m[1]);if(n)return{source,score:n,songId:ctx.songId||'nanairo',scoreOnly:true}}return null}if(typeof v!=='object'||Array.isArray(v))return null;const m=lowerObject(v);const sc=score(pick(m,['score','finalScore','resultScore','totalScore','points','point','bestScore','best','highScore','hiscore','value']));if(!sc)return null;const p=int(pick(m,['perfect','perfectCount','perfects'])),g=int(pick(m,['great','greatCount','greats'])),gd=int(pick(m,['good','goodCount','goods'])),mi=int(pick(m,['miss','missCount','misses'])),noteCount=p+g+gd+mi;const rawSong=pick(m,['songId','musicId','trackId','chartSongId','song','music','songKey','musicKey']);let song=rawSong&&typeof rawSong==='object'?(rawSong.id||rawSong.songId||rawSong.slug):rawSong;song=safe(song||ctx.songId||'nanairo').slice(0,80)||'nanairo';const rawDate=pick(m,['playedAtClient','playedAt','timestamp','createdAt','date','time','datetime']);let playedAt=null;if(rawDate!=null){const d=typeof rawDate==='number'&&rawDate>1e11?new Date(rawDate):new Date(String(rawDate));if(Number.isFinite(d.getTime()))playedAt=d.toISOString()}const auto=Boolean(pick(m,['autoPlay','autoplay','auto']))||String(pick(m,['playMode','mode'])||'').toLowerCase()==='auto';const noScore=Boolean(pick(m,['noScore','noscore']));if(auto||noScore)return null;return{source,score:sc,songId:song,chartId:safe(pick(m,['chartId','difficulty','chart'])||'default').slice(0,80)||'default',rankingVersion:safe(pick(m,['rankingVersion'])||'1').slice(0,32)||'1',perfect:p,great:g,good:gd,miss:mi,noteCount,maxCombo:pick(m,['maxCombo','comboMax','bestCombo','combo'])==null?null:int(pick(m,['maxCombo','comboMax','bestCombo','combo'])),playedAtClient:playedAt,scoreOnly:noteCount<1}}
function walk(v,source,cands,seen,depth=0,ctx={}){if(v==null||depth>10)return;if(typeof v==='object'){if(seen.has(v))return;seen.add(v)}const c=normalize(v,source,ctx);if(c)cands.push(c);if(typeof v==='string'){const p=parseText(v);if(p!==v&&p!=null)walk(p,source+':parsed',cands,seen,depth+1,ctx);return}if(!v||typeof v!=='object')return;if(Array.isArray(v)){for(let i=0;i<Math.min(v.length,100000);i++)walk(v[i],`${source}[${i}]`,cands,seen,depth+1,ctx);return}for(const[k,x]of Object.entries(v)){const next={...ctx};if(/song|music|track/i.test(k)&&typeof x==='string')next.songId=x;walk(x,`${source}.${k}`,cands,seen,depth+1,next)}}
function scanWebStorage(storage,label,cands,diag){diag[label]={keys:storage.length,names:[]};for(let i=0;i<storage.length;i++){const k=storage.key(i);if(!k)continue;diag[label].names.push(k);if(/^drumasterRanking|^drumasterLegacyRecovered|^drumasterRecovery/i.test(k))continue;const raw=storage.getItem(k);walk(parseText(raw),`${label}:${k}`,cands,new WeakSet(),0,{songId:/best[.:_-]([^.:_-]+)$/i.exec(k)?.[1]})}}
function openDb(name,version){return new Promise((res,rej)=>{const r=version?indexedDB.open(name,version):indexedDB.open(name);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))})}
async function scanIdb(cands,diag){diag.indexedDB={supported:typeof indexedDB.databases==='function',databases:[]};let infos=[];if(typeof indexedDB.databases==='function'){try{infos=await indexedDB.databases()}catch(e){diag.indexedDB.error=String(e)}}for(const info of infos){const name=info.name;if(!name)continue;let db;try{db=await openDb(name)}catch(e){diag.indexedDB.databases.push({name,error:String(e)});continue}const stores=[...db.objectStoreNames],entry={name,stores:[]};db.close();for(const storeName of stores){if(name===TARGET_DB&&storeName===TARGET_STORE){entry.stores.push({name:storeName,skipped:'current ranking store'});continue}let db2;try{db2=await openDb(name);const rows=await new Promise((res,rej)=>{const tx=db2.transaction(storeName,'readonly'),r=tx.objectStore(storeName).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)});entry.stores.push({name:storeName,rows:rows.length});for(let i=0;i<rows.length;i++)walk(rows[i],`idb:${name}/${storeName}[${i}]`,cands,new WeakSet())}catch(e){entry.stores.push({name:storeName,error:String(e)})}finally{try{db2?.close()}catch{}}}diag.indexedDB.databases.push(entry)}}
async function scanCaches(cands,diag){diag.cacheStorage={caches:[]};if(!('caches'in window))return;for(const name of await caches.keys()){const cache=await caches.open(name),reqs=await cache.keys(),entry={name,entries:reqs.length,scanned:0};for(const req of reqs.slice(0,500)){try{const res=await cache.match(req);const type=res?.headers.get('content-type')||'';const len=Number(res?.headers.get('content-length')||0);if(res&&(len===0||len<2000000)&&(/json|text|javascript|octet-stream/i.test(type)||/score|result|history|record|play/i.test(req.url))){const text=await res.clone().text();if(text.length<2000000){walk(parseText(text),`cache:${name}:${req.url}`,cands,new WeakSet());entry.scanned++}}}catch{}}diag.cacheStorage.caches.push(entry)}}
async function scanOpfs(cands,diag){diag.opfs={supported:Boolean(navigator.storage?.getDirectory),files:[]};if(!navigator.storage?.getDirectory)return;try{const root=await navigator.storage.getDirectory();async function rec(dir,path,depth){if(depth>6)return;for await(const[name,h]of dir.entries()){const p=path+'/'+name;if(h.kind==='directory')await rec(h,p,depth+1);else{try{const f=await h.getFile();diag.opfs.files.push({path:p,size:f.size});if(f.size<2000000){const text=await f.text();walk(parseText(text),'opfs:'+p,cands,new WeakSet())}}catch{}}}}await rec(root,'',0)}catch(e){diag.opfs.error=String(e)}}
async function targetPut(play){const db=await openDb(TARGET_DB);await new Promise((res,rej)=>{const tx=db.transaction(TARGET_STORE,'readwrite');tx.objectStore(TARGET_STORE).put(play);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)});db.close()}
async function getExistingIds(){const db=await openDb(TARGET_DB);const rows=await new Promise((res,rej)=>{const tx=db.transaction(TARGET_STORE,'readonly'),r=tx.objectStore(TARGET_STORE).getAllKeys();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)});db.close();return new Set(rows.map(String))}
function dedupe(xs){const m=new Map();for(const c of xs){const k=`${c.source}|${c.songId}|${c.score}|${c.perfect||0}|${c.great||0}|${c.good||0}|${c.miss||0}|${c.playedAtClient||''}`;if(!m.has(k))m.set(k,c)}return[...m.values()]}
async function importCandidates(cands,diag){let playerId=localStorage.getItem('drumasterPlayerId');if(!playerId){playerId=crypto.randomUUID();localStorage.setItem('drumasterPlayerId',playerId)}let displayName=localStorage.getItem('drumasterPlayerName')||`PLAYER-${playerId.replace(/-/g,'').slice(-6).toUpperCase()}`;localStorage.setItem('drumasterPlayerName',displayName);const existing=await getExistingIds();let imported=0,uploaded=0,failed=0;for(const c of cands){const sid=hash32(`${c.source}|${c.songId}|${c.score}|${c.perfect||0}|${c.great||0}|${c.good||0}|${c.miss||0}|${c.playedAtClient||''}`);if(c.scoreOnly){try{const legacySource=('recovery-'+sid).slice(0,64),r=await fetch(API+'/v1/legacy-best',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({playerId,displayName,songId:c.songId,chartId:c.chartId||'default',rankingVersion:c.rankingVersion||'1',score:c.score,legacySource})});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json().catch(()=>({})),playId=j.playId||`recovered-best:${safe(playerId).slice(0,32)}:${sid}`;if(!existing.has(playId)){await targetPut({playId,playerId,displayName,songId:c.songId,chartId:c.chartId||'default',rankingVersion:c.rankingVersion||'1',chartVersion:'legacy-best-only',gameVersion:'standalone-recovery',score:c.score,perfect:0,great:0,good:0,miss:0,noteCount:0,maxCombo:null,playMode:'legacy',autoPlay:false,noScore:false,playedAtClient:new Date().toISOString(),createdAtLocal:new Date().toISOString(),syncStatus:'synced',retryCount:0,lastAttemptAt:new Date().toISOString(),lastError:null,serverResult:{recovered:true,source:c.source}});existing.add(playId);imported++}uploaded++}catch(e){failed++}}else{const playId=`recovered:${safe(playerId).slice(0,32)}:${sid}`.slice(0,128);if(existing.has(playId))continue;const now=new Date().toISOString(),play={playId,playerId,displayName,songId:c.songId,chartId:c.chartId||'default',rankingVersion:c.rankingVersion||'1',chartVersion:'recovered-browser-storage',gameVersion:'standalone-recovery',score:c.score,perfect:c.perfect,great:c.great,good:c.good,miss:c.miss,noteCount:c.noteCount,maxCombo:c.maxCombo,playMode:'recovered',autoPlay:false,noScore:false,playedAtClient:c.playedAtClient||now,createdAtLocal:now,syncStatus:'pending',retryCount:0,lastAttemptAt:null,lastError:null,serverResult:{recovered:true,source:c.source}};await targetPut(play);existing.add(playId);imported++;try{const r=await fetch(API+'/v1/plays',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(play)});if(r.ok){play.syncStatus='synced';play.lastAttemptAt=new Date().toISOString();await targetPut(play);uploaded++}else failed++}catch{failed++}}}diag.import={candidates:cands.length,imported,uploaded,failed,totalInRankingDb:existing.size};return diag.import}
async function run(){state.textContent='保存領域を走査中…';const diag={at:new Date().toISOString(),origin:location.origin,userAgent:navigator.userAgent};try{diag.storageEstimate=await navigator.storage?.estimate?.()}catch{}const cands=[];scanWebStorage(localStorage,'localStorage',cands,diag);try{scanWebStorage(sessionStorage,'sessionStorage',cands,diag)}catch(e){diag.sessionStorage={error:String(e)}}await scanIdb(cands,diag);await scanCaches(cands,diag);await scanOpfs(cands,diag);const unique=dedupe(cands);diag.candidates=unique.map(c=>({source:c.source,score:c.score,songId:c.songId,full:!c.scoreOnly,judgements:c.scoreOnly?null:[c.perfect,c.great,c.good,c.miss]}));await importCandidates(unique,diag);lastReport=diag;localStorage.setItem('drumasterRecoveryInspectorReport:v2',JSON.stringify(diag));out.textContent=JSON.stringify(diag,null,2);state.innerHTML=`<span class="ok">完了：候補 ${unique.length}件 / 新規取込 ${diag.import.imported}件 / ランキングDB ${diag.import.totalInRankingDb}件</span>`}catch(e){diag.fatal=String(e?.stack||e);lastReport=diag;out.textContent=JSON.stringify(diag,null,2);state.innerHTML=`<span class="warn">走査エラー: ${String(e)}</span>`}}
$('#run').onclick=run;$('#copy').onclick=async()=>{if(lastReport)await navigator.clipboard.writeText(JSON.stringify(lastReport,null,2))};run();
})();
</script></body></html>
