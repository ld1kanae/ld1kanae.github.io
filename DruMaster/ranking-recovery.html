<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DruMaster 過去記録復旧</title><style>body{font-family:system-ui,sans-serif;background:#080b11;color:#eef6ff;margin:0;padding:24px}main{max-width:980px;margin:auto}button{font:inherit;padding:10px 16px;margin:8px 8px 8px 0;cursor:pointer}button:disabled{opacity:.55;cursor:wait}pre{white-space:pre-wrap;word-break:break-word;background:#111923;padding:14px;border-radius:8px;max-height:55vh;overflow:auto}.ok{color:#8ff0b0}.warn{color:#ffd37a}</style><script>window.addEventListener('error',function(e){var s=document.getElementById('state');if(s)s.textContent='スクリプトエラー: '+(e.message||'unknown');});window.addEventListener('unhandledrejection',function(e){var s=document.getElementById('state');if(s)s.textContent='処理エラー: '+String(e.reason||e);});</script></head><body><main><h1>DruMaster 過去記録復旧</h1><p>このページは同じ GitHub Pages オリジンに残っている保存領域を直接走査します。</p><button id="run" type="button">保存領域を再走査して同期</button><button id="copy" type="button">診断結果をコピー</button><p id="state">準備中…</p><pre id="report"></pre></main><script>
(function(){'use strict';
var API='https://drumaster-ranking-api.aoka45utau.workers.dev';
var DB='drumaster-ranking', STORE='plays';
var runBtn=document.getElementById('run'), copyBtn=document.getElementById('copy'), state=document.getElementById('state'), out=document.getElementById('report');
var lastReport=null, running=false;
function setState(t,cls){state.className=cls||'';state.textContent=t;}
function safe(v){return String(v==null?'':v).trim().replace(/[^A-Za-z0-9._:-]/g,'_');}
function hash32(t){var h=2166136261;for(var i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(16).padStart(8,'0');}
function parse(v){if(typeof v!=='string')return v;var t=v.trim();if(!t)return null;try{return JSON.parse(t);}catch(e){}var n=Number(t.replace(/[,\s]/g,''));return Number.isFinite(n)?n:t;}
function score(v){var n=Number(typeof v==='string'?v.replace(/[,\s]/g,''):v);return Number.isFinite(n)&&n>0&&n<=1000000?Math.trunc(n):null;}
function pick(o,keys){if(!o||typeof o!=='object')return null;var lower={};Object.keys(o).forEach(function(k){lower[k.toLowerCase()]=o[k];});for(var i=0;i<keys.length;i++){var v=lower[keys[i].toLowerCase()];if(v!=null)return v;}return null;}
function normalize(v,source){if(v==null)return null;if(typeof v==='number'){var sn=score(v);return sn&&/(score|best|record|result|play|history|drum)/i.test(source)?{source:source,score:sn,songId:'nanairo',scoreOnly:true}:null;}if(!v||typeof v!=='object'||Array.isArray(v))return null;var sc=score(pick(v,['score','finalScore','resultScore','totalScore','points','bestScore','best','highScore','hiscore']));if(!sc)return null;var p=Number(pick(v,['perfect','perfectCount']))||0,g=Number(pick(v,['great','greatCount']))||0,gd=Number(pick(v,['good','goodCount']))||0,m=Number(pick(v,['miss','missCount']))||0;var note=Math.max(0,Math.trunc(p+g+gd+m));var rawSong=pick(v,['songId','musicId','trackId','song','music']);var songId=(rawSong&&typeof rawSong==='object'?(rawSong.id||rawSong.songId):rawSong)||'nanairo';if(Boolean(pick(v,['autoPlay','autoplay','auto']))||Boolean(pick(v,['noScore','noscore'])))return null;return{source:source,score:sc,songId:safe(songId)||'nanairo',chartId:safe(pick(v,['chartId','difficulty'])||'default')||'default',rankingVersion:safe(pick(v,['rankingVersion'])||'1')||'1',perfect:Math.trunc(p),great:Math.trunc(g),good:Math.trunc(gd),miss:Math.trunc(m),noteCount:note,maxCombo:Math.trunc(Number(pick(v,['maxCombo','bestCombo']))||0),scoreOnly:note<1};}
function walk(v,source,out,depth){depth=depth||0;if(v==null||depth>8)return;var c=normalize(v,source);if(c)out.push(c);if(typeof v==='string'){var p=parse(v);if(p!==v)walk(p,source+':parsed',out,depth+1);return;}if(!v||typeof v!=='object')return;if(Array.isArray(v)){for(var i=0;i<Math.min(v.length,20000);i++)walk(v[i],source+'['+i+']',out,depth+1);return;}Object.keys(v).forEach(function(k){walk(v[k],source+'.'+k,out,depth+1);});}
function scanStorage(storage,label,cands,diag){var info={keys:storage.length,names:[]};for(var i=0;i<storage.length;i++){var k=storage.key(i);if(!k)continue;info.names.push(k);if(/^drumasterRanking|^drumasterRecoveryInspector/i.test(k))continue;try{walk(parse(storage.getItem(k)),label+':'+k,cands,0);}catch(e){}}diag[label]=info;}
function openDb(name,version){return new Promise(function(resolve,reject){var r=version?indexedDB.open(name,version):indexedDB.open(name);r.onupgradeneeded=function(){if(name===DB&&!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'playId'});};r.onsuccess=function(){resolve(r.result);};r.onerror=function(){reject(r.error||new Error('indexedDB open failed'));};r.onblocked=function(){reject(new Error('indexedDB blocked'));};});}
async function scanIdb(cands,diag){diag.indexedDB={supported:typeof indexedDB!=='undefined',databases:[]};if(typeof indexedDB==='undefined')return;var infos=[];if(typeof indexedDB.databases==='function'){try{infos=await indexedDB.databases();}catch(e){diag.indexedDB.error=String(e);}}if(!infos.length){infos=[{name:DB}];}
for(var i=0;i<infos.length;i++){var name=infos[i]&&infos[i].name;if(!name)continue;var db;try{db=await openDb(name);var stores=Array.from(db.objectStoreNames);var d={name:name,stores:[]};db.close();for(var j=0;j<stores.length;j++){var storeName=stores[j];if(name===DB&&storeName===STORE){var db0=await openDb(name);var count=await new Promise(function(res,rej){var tx=db0.transaction(STORE,'readonly'),r=tx.objectStore(STORE).count();r.onsuccess=function(){res(r.result||0);};r.onerror=function(){rej(r.error);};});db0.close();d.stores.push({name:storeName,rows:count,currentRanking:true});continue;}var db2=await openDb(name);try{var rows=await new Promise(function(res,rej){var tx=db2.transaction(storeName,'readonly'),r=tx.objectStore(storeName).getAll();r.onsuccess=function(){res(r.result||[]);};r.onerror=function(){rej(r.error);};});d.stores.push({name:storeName,rows:rows.length});for(var x=0;x<rows.length;x++)walk(rows[x],'idb:'+name+'/'+storeName+'['+x+']',cands,0);}finally{db2.close();}}diag.indexedDB.databases.push(d);}catch(e){try{db&&db.close();}catch(_){}diag.indexedDB.databases.push({name:name,error:String(e)});}}}
async function existingIds(){var db=await openDb(DB,1);var ids=await new Promise(function(res,rej){var tx=db.transaction(STORE,'readonly'),r=tx.objectStore(STORE).getAllKeys();r.onsuccess=function(){res(r.result||[]);};r.onerror=function(){rej(r.error);};});db.close();return new Set(ids.map(String));}
async function put(play){var db=await openDb(DB,1);await new Promise(function(res,rej){var tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(play);tx.oncomplete=function(){res();};tx.onerror=function(){rej(tx.error);};tx.onabort=function(){rej(tx.error);};});db.close();}
function dedupe(xs){var m=new Map();xs.forEach(function(c){var k=[c.source,c.songId,c.score,c.perfect||0,c.great||0,c.good||0,c.miss||0].join('|');if(!m.has(k))m.set(k,c);});return Array.from(m.values());}
async function importAll(cands,diag){var playerId=localStorage.getItem('drumasterPlayerId');if(!playerId){playerId=(crypto.randomUUID?crypto.randomUUID():'player-'+Date.now()+'-'+Math.random().toString(16).slice(2));localStorage.setItem('drumasterPlayerId',playerId);}var displayName=localStorage.getItem('drumasterPlayerName')||('PLAYER-'+playerId.replace(/-/g,'').slice(-6).toUpperCase());localStorage.setItem('drumasterPlayerName',displayName);var ids=await existingIds();var imported=0,uploaded=0,failed=0;
for(var i=0;i<cands.length;i++){var c=cands[i],sid=hash32([c.source,c.songId,c.score,c.perfect||0,c.great||0,c.good||0,c.miss||0].join('|'));try{if(c.scoreOnly){var lr=await fetch(API+'/v1/legacy-best',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({playerId:playerId,displayName:displayName,songId:c.songId,chartId:c.chartId||'default',rankingVersion:c.rankingVersion||'1',score:c.score,legacySource:'recovery-'+sid})});if(!lr.ok)throw new Error('legacy HTTP '+lr.status);uploaded++;continue;}var playId=('recovered:'+safe(playerId).slice(0,32)+':'+sid).slice(0,128);if(ids.has(playId))continue;var now=new Date().toISOString();var play={playId:playId,playerId:playerId,displayName:displayName,songId:c.songId,chartId:c.chartId||'default',rankingVersion:c.rankingVersion||'1',chartVersion:'recovered-browser-storage',gameVersion:'standalone-recovery-v2',score:c.score,perfect:c.perfect,great:c.great,good:c.good,miss:c.miss,noteCount:c.noteCount,maxCombo:c.maxCombo||0,playMode:'recovered',autoPlay:false,noScore:false,playedAtClient:now,createdAtLocal:now,syncStatus:'pending',retryCount:0,lastAttemptAt:null,lastError:null};await put(play);ids.add(playId);imported++;var r=await fetch(API+'/v1/plays',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(play)});if(r.ok){play.syncStatus='synced';play.lastAttemptAt=new Date().toISOString();await put(play);uploaded++;}else failed++;}catch(e){failed++;}}
diag.import={candidates:cands.length,imported:imported,uploaded:uploaded,failed:failed,totalInRankingDb:ids.size};}
async function run(){if(running)return;running=true;runBtn.disabled=true;setState('保存領域を走査中…');out.textContent='';var diag={at:new Date().toISOString(),origin:location.origin,userAgent:navigator.userAgent};try{var cands=[];scanStorage(localStorage,'localStorage',cands,diag);try{scanStorage(sessionStorage,'sessionStorage',cands,diag);}catch(e){diag.sessionStorage={error:String(e)};}setState('IndexedDB を走査中…');await scanIdb(cands,diag);var unique=dedupe(cands);diag.candidates=unique.map(function(c){return{source:c.source,score:c.score,songId:c.songId,full:!c.scoreOnly,judgements:c.scoreOnly?null:[c.perfect,c.great,c.good,c.miss]};});setState('候補 '+unique.length+'件を同期中…');await importAll(unique,diag);lastReport=diag;localStorage.setItem('drumasterRecoveryInspectorReport:v3',JSON.stringify(diag));out.textContent=JSON.stringify(diag,null,2);setState('完了：候補 '+unique.length+'件 / 新規取込 '+diag.import.imported+'件 / アップロード '+diag.import.uploaded+'件 / ランキングDB '+diag.import.totalInRankingDb+'件','ok');}catch(e){diag.fatal=String(e&&e.stack?e.stack:e);lastReport=diag;out.textContent=JSON.stringify(diag,null,2);setState('走査エラー: '+String(e),'warn');}finally{running=false;runBtn.disabled=false;}}
runBtn.addEventListener('click',function(){setState('再走査を開始します…');run();});copyBtn.addEventListener('click',async function(){try{await navigator.clipboard.writeText(JSON.stringify(lastReport||{},null,2));setState('診断結果をコピーしました','ok');}catch(e){setState('コピーできません: '+String(e),'warn');}});
window.__dmRecoveryRun=run;setState('待機中');run();
})();
</script></body></html>
