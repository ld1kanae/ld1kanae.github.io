<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DruMaster Song Sync Editor</title>
</head>
<body>
<script>
(async()=>{
  try{
    const r=await fetch('song-sync-editor-v2.html?v=20260828-history2',{cache:'no-store'});
    if(!r.ok)throw Error(`Editor load failed: HTTP ${r.status}`);
    let html=await r.text();
    const theme='<link rel="stylesheet" href="css/song-tool-cyan-violet-theme.css?v=20260829-theme1">';
    const local='<scr'+'ipt src="js/song-sync-local-session.js?v=20260828-volume1"></scr'+'ipt>';
    const history='<scr'+'ipt src="js/song-sync-history.js?v=20260828-mswheel1"></scr'+'ipt>';
    const audioOffsetUi='<scr'+'ipt src="js/song-sync-audio-offset-ui.js?v=20260829-audiooffset1"></scr'+'ipt>';
    const heading='<scr'+'ipt>(()=>{const fix=()=>{const h=document.getElementById("heading");if(h&&h.textContent!=="Timing Correction")h.textContent="Timing Correction"};new MutationObserver(fix).observe(document.documentElement,{subtree:true,childList:true,characterData:true});addEventListener("DOMContentLoaded",fix);setTimeout(fix,0);setTimeout(fix,500)})();</scr'+'ipt>';
    const rayTimeline='<scr'+'ipt src="js/song-sync-ray-timeline.js?v=20260828-raytimeline1"></scr'+'ipt>';
    html=html.replace('</head>',theme+local+'</head>');
    html=html.replace('</body>',history+audioOffsetUi+heading+rayTimeline+'</body>');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error(e);
    document.body.textContent='タイミングエディタを読み込めませんでした。再読み込みしてください。';
  }
})();
</script>
</body>
</html>
