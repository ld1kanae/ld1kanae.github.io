<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DruMaster Song Sync Editor</title>
</head>
<body>
<script>
(async()=>{
  try{
    const r=await fetch('song-sync-editor-v2.html?v=20260828-history2',{cache:'no-store'});
    if(!r.ok)throw Error(`Editor load failed: HTTP ${r.status}`);
    let html=await r.text();
    const local='<scr'+'ipt src="js/song-sync-local-session.js?v=20260828-volume1"></scr'+'ipt>';
    const history='<scr'+'ipt src="js/song-sync-history.js?v=20260828-mswheel1"></scr'+'ipt>';
    const audioOffsetUi='<scr'+'ipt src="js/song-sync-audio-offset-ui.js?v=20260829-audiooffset1"></scr'+'ipt>';
    const rayTimeline='<scr'+'ipt src="js/song-sync-ray-timeline.js?v=20260828-raytimeline1"></scr'+'ipt>';
    html=html.replace('</head>',local+'</head>');
    html=html.replace('</body>',history+audioOffsetUi+rayTimeline+'</body>');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error(e);
    document.body.textContent='タイミングエディタを読み込めませんでした。再読み込みしてください。';
  }
})();
</script>
</body>
</html>
