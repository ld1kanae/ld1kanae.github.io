<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DruMaster Song Sync Editor</title>
</head>
<body>
<script>
(async()=>{
  try{
    const r=await fetch('song-sync-editor-v2.html?v=20260830-midibounds3',{cache:'no-store'});
    if(!r.ok)throw Error(`Editor load failed: HTTP ${r.status}`);
    let html=await r.text();

    html=html.replace('id="audioOffset" type="number" min="-500" max="500" step="0.1"','id="audioOffset" type="number" step="0.1"');
    html=html.replace('audioOffsetMs=Math.max(-500,Math.min(500,Number($("audioOffset").value)||0));','audioOffsetMs=Number($("audioOffset").value)||0;');
    html=html.replace('$("audioOffset").value=Math.max(-500,Math.min(500,drag.start-delta)).toFixed(1);','$("audioOffset").value=(drag.start-delta).toFixed(1);');
    html=html.replace('>最終 PUBLISH<','>PUBLISH<');
    html=html.replace('調整後に最終PUBLISHしてください。','調整後にPUBLISHしてください。');
    html=html.replace('波形とMIDIを同一時間軸で比較し、最終値をPublishします。','波形とMIDIを同一時間軸で比較し、補正値をPUBLISHします。');

    html=html.replace(
      'const need=(n,end=d.byteLength)=>{if(p+n>end)throw Error("MIDIが途中で切れています")}',
      'const need=(n,end=d.byteLength)=>{const limit=Math.min(Number.isFinite(end)?end:d.byteLength,d.byteLength);if(!Number.isFinite(n)||n<0||p<0||p+n>limit)throw Error("MIDIが途中で切れています")}'
    );
    html=html.replace(
      'p=8+hl;const raw=[],tempoRaw=[{tick:0,us:500000}],sigs=[];',
      'p=8+hl;if(hl<6||p>d.byteLength)throw Error("MIDIヘッダーが不正です");const raw=[],tempoRaw=[{tick:0,us:500000}],sigs=[];'
    );
    html=html.replace(
      'const len=u32(),end=p+len;let tick=0,run=0;',
      'const len=u32(),end=p+len;if(end>d.byteLength)throw Error("MIDIトラックが途中で切れています");let tick=0,run=0;'
    );

    /* The game uses playback.midiOffsetSec as the authoritative MIDI timing.
       Keep the exact live-game second offset even when the editor UI expresses
       adjustments in whole measures. */
    html=html.replace(
      'let draft=null,tokenFromPrevious="",ac=null,audioBuffer=null,audioSource=null,notes=[],measureLengthSec=2,measureOffset=0,audioOffsetMs=0,pxPerSec=260,viewStart=0,cursor=0,playing=false,logicalStart=0,contextStart=0,raf=0,scheduler=0,nextClick=0,drag=null,renderReq=0;',
      'let draft=null,tokenFromPrevious="",ac=null,audioBuffer=null,audioSource=null,notes=[],measureLengthSec=2,measureOffset=0,midiOffsetBaseSec=0,audioOffsetMs=0,pxPerSec=260,viewStart=0,cursor=0,playing=false,logicalStart=0,contextStart=0,raf=0,scheduler=0,nextClick=0,drag=null,renderReq=0;'
    );
    html=html.replace(
      'function midiOffsetSec(){return measureOffset*measureLengthSec}',
      'function midiOffsetSec(){return midiOffsetBaseSec+measureOffset*measureLengthSec}'
    );
    html=html.replace(
      'const meta=await apiGet(`${ROOT}/${id}/song-draft.json`,tokenFromPrevious),text=decodeContent(meta.content);draft=JSON.parse(text);',
      'const meta=await apiGet(`${ROOT}/${id}/song-draft.json`,tokenFromPrevious),text=decodeContent(meta.content);draft=JSON.parse(text);try{const regMeta=await apiGet(`${ROOT}/registry.json`,tokenFromPrevious),reg=JSON.parse(decodeContent(regMeta.content)||"{}"),live=reg?.[id];if(live?.playback)draft.playback={...(draft.playback||{}),...live.playback}}catch(e){console.warn("Live game timing load failed; using draft timing",e)}'
    );
    html=html.replace(
      'measureOffset=Number(draft.playback?.midiMeasureOffset)||0;audioOffsetMs=(Number(draft.playback?.stemOffsetSec)||0)*1000;',
      'measureOffset=Number(draft.playback?.midiMeasureOffset)||0;{const liveMidiSec=Number(draft.playback?.midiOffsetSec);midiOffsetBaseSec=Number.isFinite(liveMidiSec)?liveMidiSec-measureOffset*measureLengthSec:0}audioOffsetMs=(Number(draft.playback?.stemOffsetSec)||0)*1000;'
    );
    html=html.replace(
      '$("midiReset").addEventListener("click",()=>{measureOffset=0;updateOffsetUi()});',
      '$("midiReset").addEventListener("click",()=>{measureOffset=0;midiOffsetBaseSec=0;updateOffsetUi()});'
    );
    html=html.replace(
      'await putText(`${ROOT}/${id}/song.json`,JSON.stringify({...draft,state:"published",playback},null,2)+"\n",`Publish song settings: ${id}`,t,songMeta?.sha||null);',
      'await putText(`${ROOT}/${id}/song.json`,JSON.stringify({...draft,state:"published",playback},null,2)+"\n",`Publish song settings: ${id}`,t,songMeta?.sha||null);const draftMeta=await apiMaybeGet(`${ROOT}/${id}/song-draft.json`,t);if(draftMeta)await putText(`${ROOT}/${id}/song-draft.json`,JSON.stringify({...draft,playback},null,2)+"\n",`Sync draft timing: ${id}`,t,draftMeta.sha);'
    );

    html=html.replace('function startPlayback(){if(!audioBuffer||playing)return;void ac.resume();playing=true;','async function startPlayback(){if(!audioBuffer||playing)return;await ac.resume();if($("midiClick").checked)await globalThis.DruMasterTimingMidi?.ready?.(ac);playing=true;');
    html=html.replace('playing=false;stopSource();clearInterval(scheduler);','playing=false;stopSource();globalThis.DruMasterTimingMidi?.stop?.();clearInterval(scheduler);');
    html=html.replace('const when=contextStart+(t-logicalStart),osc=ac.createOscillator(),g=ac.createGain(),at=Math.max(ac.currentTime,when);osc.frequency.value=n.note<42?130:n.note<49?220:420;g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.08,at+.002);g.gain.exponentialRampToValueAtTime(.0001,at+.025);osc.connect(g).connect(ac.destination);osc.start(at);osc.stop(at+.03)','const when=contextStart+(t-logicalStart),at=Math.max(ac.currentTime,when);if(!globalThis.DruMasterTimingMidi?.play?.(n,at,ac)){const osc=ac.createOscillator(),g=ac.createGain();osc.frequency.value=n.note<42?130:n.note<49?220:420;g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.12,at+.002);g.gain.exponentialRampToValueAtTime(.0001,at+.05);osc.connect(g).connect(ac.destination);osc.start(at);osc.stop(at+.06)}');

    const theme='<link rel="stylesheet" href="css/song-tool-cyan-violet-theme.css?v=20260829-theme3">';
    const local='<scr'+'ipt src="js/song-sync-local-session.js?v=20260829-volumeflow1"></scr'+'ipt>';
    const midiAudio='<scr'+'ipt src="js/song-sync-midi-audio.js?v=20260829-timingfix2"></scr'+'ipt>';
    const history='<scr'+'ipt src="js/song-sync-history.js?v=20260829-offset2"></scr'+'ipt>';
    const audioOffsetUi='<scr'+'ipt src="js/song-sync-audio-offset-ui.js?v=20260829-audiooffset1"></scr'+'ipt>';
    const heading='<scr'+'ipt>(()=>{const fix=()=>{const h=document.getElementById("heading");if(h&&h.textContent!=="Timing Correction")h.textContent="Timing Correction"};new MutationObserver(fix).observe(document.documentElement,{subtree:true,childList:true,characterData:true});addEventListener("DOMContentLoaded",fix);setTimeout(fix,0);setTimeout(fix,500)})();</scr'+'ipt>';
    const existingToken='<scr'+'ipt>(()=>{const sentinel="__dm_existing_edit__";const setup=()=>{const t=document.getElementById("token"),p=document.getElementById("publish");if(t&&t.value===sentinel)t.value="";if(p&&!p.dataset.dmExistingTokenGuard){p.dataset.dmExistingTokenGuard="1";p.addEventListener("click",e=>{let w={};try{w=JSON.parse(window.name||"{}").dmSongPublisher||{}}catch{}if(w.token===sentinel&&!t?.value.trim()){e.preventDefault();e.stopImmediatePropagation();const m=document.getElementById("message");if(m){m.textContent="GitHub tokenを入力してください。";m.className="bad"}}},true)}};addEventListener("DOMContentLoaded",()=>setTimeout(setup,250));setTimeout(setup,700)})();</scr'+'ipt>';
    const ranges='<scr'+'ipt src="js/song-tool-range-theme.js?v=20260829-range1"></scr'+'ipt>';
    const clickSeek='<scr'+'ipt src="js/song-sync-click-seek.js?v=20260829-clickseek1"></scr'+'ipt>';
    const seekbar='<scr'+'ipt src="js/song-sync-seekbar.js?v=20260829-restore1"></scr'+'ipt>';
    const rayTimeline='<scr'+'ipt src="js/song-sync-ray-timeline-loader.js?v=20260830-midibounds3"></scr'+'ipt>';
    html=html.replace('</head>',theme+local+midiAudio+'</head>');
    html=html.replace('</body>',history+audioOffsetUi+heading+existingToken+ranges+clickSeek+seekbar+rayTimeline+'</body>');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error(e);
    document.body.textContent='タイミングエディタを読み込めませんでした。再読み込みしてください。';
  }
})();
</script>
</body>
</html>
