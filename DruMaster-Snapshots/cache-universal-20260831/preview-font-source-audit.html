<style>

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans JP",system-ui,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 12% 0%,rgba(67,139,201,.15),transparent 32%),radial-gradient(circle at 88% 10%,rgba(153,92,205,.10),transparent 28%),#070b11}
main{width:min(1500px,96vw);margin:0 auto;padding:28px 0 70px}
h1{margin:0;font-size:28px;letter-spacing:.03em}.lead{margin:8px 0 6px;color:#9cabb9;font-size:13px;line-height:1.7}.note{margin:0 0 26px;color:#6f8091;font-size:11px}
.section{margin-top:30px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:12px}.section h2{margin:0;font-size:20px}.count{color:#718294;font-size:11px}

.mini-hud{width:170px;height:42px;padding:6px 9px;background:linear-gradient(90deg,#101823ed,#080c13f5);display:grid;grid-template-columns:1fr auto;align-items:center}.mini-hud .song b,.mini-hud .song small{display:block}.mini-hud .bpm{color:#aab8c8}.mini-result{width:170px;padding:9px 11px;background:linear-gradient(180deg,#0d1723,#070b11);text-align:center}.mini-result .ey{color:#98a7ba;letter-spacing:.25em}.mini-result .sub{color:#77879a;letter-spacing:.12em}.mini-load{padding:8px 12px;border-radius:8px;background:#0d151f;color:#9ba6b5}.mini-volume{width:170px;padding:10px 12px;border:1px solid #2d3745;border-radius:10px;background:rgba(220,240,255,.06)}.mini-volume .row{display:flex;justify-content:space-between}.mini-volume .bar{height:5px;margin-top:9px;border-radius:99px;background:linear-gradient(90deg,#66d5ff,#8c8aff 55%,#ffffff2d 55%)}.mini-rank{width:180px;border:1px solid #283748;border-radius:9px;background:#0b141e}.mini-rank .head,.mini-rank .row{display:grid;grid-template-columns:34px 1fr 56px;align-items:center;padding:5px 7px}.mini-rank .head{color:#697788;border-bottom:1px solid #ffffff12}.mini-rank .row{color:#dce6ef}.mini-hint{width:170px}.mini-hint .scale{display:flex;justify-content:space-between;color:#7f8996}.mini-hint .hint{margin-top:7px;text-align:center;color:#67717f}.mini-dropdown{width:170px;border:1px solid #3a5169;border-radius:8px;background:#0d1824;padding:8px 10px;color:#e7eef7}.mini-button{min-width:126px;height:34px;border:1px solid rgba(22,39,48,.88);border-radius:999px;background:rgba(7,17,24,.27);display:grid;place-items:center;color:#eef3f7}.mini-mic-step{width:150px;padding:8px;border:1px solid #283748;border-radius:10px;background:#0c141e;text-align:center}.mini-mic-step .num{display:grid;place-items:center;width:20px;height:20px;margin:0 auto 4px;border:1px solid #46596e;border-radius:50%;color:#9aa9ba}.mini-mic-action{min-width:140px;height:36px;border:1px solid #586a7d;border-radius:999px;background:#131e2b;display:grid;place-items:center}.mini-score-label{text-align:center;color:#8d9caf;letter-spacing:.32em}.mini-note{color:#8190a2}.mini-fingerprint{width:150px;padding:10px;border:1px solid #2b3a49;border-radius:11px;background:#0b141e;text-align:center}.mini-key{min-width:24px;height:22px;padding:0 5px;border:1px solid #ffffff90;border-radius:6px;background:#080c12b8;display:grid;place-items:center}.mini-acoustic{width:170px;padding:10px;border:1px solid #324557;border-radius:12px;background:#08101a;text-align:center}.mini-badge{display:inline-flex;align-items:center;height:17px;padding:0 6px;border:1px solid #6d7d8e;border-radius:999px;background:#121b25}.mini-mono{padding:7px 9px;border:1px solid #314455;border-radius:7px;background:#071019;color:#b9c7d7}.mini-song-card{width:180px;padding:10px 12px;border:1px solid #2d3745;border-radius:11px;background:rgba(220,240,255,.06);position:relative}.mini-song-card h4{margin:0}.mini-song-card .bpm{position:absolute;right:11px;top:9px}.mini-mode-row{width:170px;padding:8px 10px;border:1px solid #324457;border-radius:9px;background:rgba(220,240,255,.06)}.mini-score{width:150px;padding:7px 10px;background:#0b121b;text-align:right}.mini-score small{display:block;color:#8793a0}.mini-score strong{display:block}.mini-judge{font-weight:900;background:linear-gradient(105deg,#fff8ff,#69e9ff,#fff2a3,#d18cff);background-clip:text;-webkit-background-clip:text;color:transparent}.mini-loading{color:#8996a5;letter-spacing:.04em}.mini-option-row{padding:5px 10px;border-radius:6px;background:#29465d;color:#fff;width:150px}
.output{margin-top:30px;padding:16px;border:1px solid #2a3c4e;border-radius:14px;background:#0b121b}.output h2{margin:0 0 8px;font-size:15px}.output p{margin:0 0 9px;color:#7f90a1;font-size:11px}.output textarea{width:100%;min-height:300px;resize:vertical;border:1px solid #314558;border-radius:9px;background:#060b11;color:#dce7f1;padding:12px;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}.actions{display:flex;gap:8px;margin-top:9px}.actions button{border:1px solid #38516a;border-radius:8px;background:#122131;color:#e8f2fa;padding:8px 12px;font-weight:700;cursor:pointer}
@media(max-width:900px){.audit-top{grid-template-columns:1fr}.toggle-control{border-left:0;border-top:1px solid #253648;padding:10px}.previews{min-width:0}}
</style>

<body>
<main>
<h1>Font / Font-size Commonization Audit</h1>
<p class="lead">PC版・スマホ版を別々に監査し、現在の最終CSSで <b>font-family と font-size が一致</b>しているのに、別セレクタ／別ファイルで個別指定されている候補だけを並べています。</p>
<p class="note">font-weight、line-height、letter-spacing、色、余白、形状は判定条件に含めていません。共通化する場合もその差は残す前提です。チェック状態はこのブラウザに保存されます。</p>
<section class="section"><div class="section-head"><h2>PC版</h2><span class="count" id="pcCount"></span></div><div class="audit-list" id="pcList"></div></section>
<section class="section"><div class="section-head"><h2>スマホ版</h2><span class="count" id="mobileCount"></span></div><div class="audit-list" id="mobileList"></div></section>
<section class="output"><h2>選択結果 JSON</h2><p>共通化したいものをONにして、このJSONをそのままチャットへ貼ってください。</p><textarea id="jsonOut" readonly></textarea><div class="actions"><button id="copyBtn">JSONをコピー</button><button id="resetBtn">すべてOFF</button></div></section>
</main>

function sampleHTML(kind,label,size,family){const ff=family;const s=`font-family:${ff};font-size:${size}`;switch(kind){

case 'song-option':return `<div class="mini-option-row" style="${s};font-weight:700">なないろ — BUMP OF CHICKEN</div>`;
case 'mode-option':return `<div class="mini-option-row" style="${s};font-weight:700">通常</div>`;
case 'judge':return `<div class="mini-judge" style="${s};font-weight:900">PERFECT</div>`;
case 'fingerprint-title':return `<div class="mini-fingerprint"><b style="${s};font-weight:900">SNARE</b><small>READY</small></div>`;
case 'fingerprint-action':return `<div class="mini-mic-action" style="${s};font-weight:900">再測定</div>`;
case 'score-loading':return `<div class="mini-loading" style="${s};font-weight:700">譜面を読み込み中…</div>`;
case 'seek-time':return `<div class="mini-mono" style="${s};font-weight:800">01:24 / 04:11</div>`;
default:return `<span style="${s}">${label}</span>`}}
function render(platform){const root=document.getElementById(platform==='pc'?'pcList':'mobileList');const items=DATA.filter(x=>x.platform===platform);document.getElementById(platform==='pc'?'pcCount':'mobileCount').textContent=`${items.length} groups`;root.innerHTML=items.map(item=>{const checked=!!saved[item.id];return `<article class="audit${checked?' on':''}" data-id="${item.id}"><div class="audit-top"><div class="meta"><h3>${item.label}</h3><div class="chips"><span class="chip">${item.size}</span><span class="chip">${item.family}</span></div><div class="source">現在の参照元：${item.source}</div></div><div class="previews">${item.samples.map(([kind,label])=>`<div class="sample"><div class="sample-label">${label}</div><div class="sample-stage">${sampleHTML(kind,label,item.size,item.family)}</div></div>`).join('')}</div><div class="toggle-control"><label><input type="checkbox" ${checked?'checked':''}> 共通化する</label></div></div></article>`}).join('');root.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.addEventListener('change',e=>{const card=e.target.closest('.audit');saved[card.dataset.id]=e.target.checked;card.classList.toggle('on',e.target.checked);persist()}))}
function output(){const arr=DATA.map(x=>({id:x.id,platform:x.platform,label:x.label,fontFamily:x.family,fontSize:x.size,commonize:!!saved[x.id]}));document.getElementById('jsonOut').value=JSON.stringify({fontCommonization:arr},null,2)}
function persist(){localStorage.setItem(KEY,JSON.stringify(saved));output()}
render('pc');render('mobile');output();
document.getElementById('copyBtn').onclick=async()=>{const t=document.getElementById('jsonOut');try{await navigator.clipboard.writeText(t.value);document.getElementById('copyBtn').textContent='コピーしました';setTimeout(()=>document.getElementById('copyBtn').textContent='JSONをコピー',1200)}catch(e){t.select();document.execCommand('copy')}};
document.getElementById('resetBtn').onclick=()=>{saved={};localStorage.removeItem(KEY);render('pc');render('mobile');output()};
</script>
</body>
</html>
