<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DruMaster Design Token Audit</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#070a0f;color:#eaf1f7;font-family:system-ui,sans-serif}main{width:min(1450px,96vw);margin:auto;padding:28px 0 60px}h1{margin:0 0 8px;font-size:26px}.lead{color:#91a0ae;font-size:12px;line-height:1.7;margin:0}.sub{margin:5px 0 0;color:#68798a;font-size:10px}.list{display:grid;gap:12px;margin-top:22px}.item{display:grid;grid-template-columns:74px 205px minmax(330px,1fr) minmax(360px,1.25fr) 145px;gap:12px;align-items:center;border:1px solid #293949;border-radius:13px;background:#0c131d;padding:12px}.item.on{border-color:#53819a;box-shadow:0 0 0 1px rgba(99,195,255,.08)}.p{font-size:10px;font-weight:800}.name{font-size:13px;font-weight:800}.desc{font-size:10px;color:#8fa0af;line-height:1.55}.toggle label{display:flex;gap:7px;align-items:center;font-size:11px}.toggle input{width:20px;height:20px;accent-color:#63c3ff}.visual{min-height:104px;border:1px solid #26394a;border-radius:10px;background:#070b10;padding:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}.visual small{color:#6f8090}.pair{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}.vlabel{display:block;margin-bottom:4px;text-align:center;color:#768898;font-size:8px}.btn{display:grid;place-items:center;border:1px solid #6c8094;background:#101820;color:#eef4fa}.squareA{width:42px;height:42px;border-radius:12px}.squareB{width:42px;height:42px;border-radius:12px}.toggle-ui{width:50px;height:28px;border:1px solid #61778b;border-radius:99px;padding:3px;display:flex;align-items:center}.toggle-ui i{display:block;width:20px;height:20px;border-radius:50%;background:#dce8f1}.drop{width:165px;height:36px;border:1px solid #4f6478;border-radius:8px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;background:#111820}.drop.alt{height:34px;border-radius:7px}.stack{position:relative;width:230px;height:86px}.layer{position:absolute;border:1px solid currentColor;background:#0b1016;padding:4px 7px;font-size:8px}.l1{left:5px;top:50px;color:#627080}.l2{left:28px;top:38px;color:#4fa7ff}.l3{left:55px;top:27px;color:#49dca8}.l4{left:83px;top:15px;color:#ffce5b}.l5{left:115px;top:3px;color:#ff70d9}.phone{width:240px;height:82px;border:1px solid #60768a;position:relative}.safe{position:absolute;left:24px;top:0;bottom:0;border-left:2px solid #ff5a8a}.headerline{position:absolute;left:24px;right:0;top:28px;border-top:2px solid #59d4ff}.chartline{position:absolute;left:24px;right:10px;top:50px;border-top:2px solid #ffe55b}.focusbox{width:155px;height:38px;border:1px solid #4a5f72;border-radius:8px;display:grid;place-items:center;outline:2px solid #63c3ff;outline-offset:3px}.borders{display:flex;gap:10px;align-items:end}.borders i{display:block;width:52px;height:38px;background:#0e151d}.b1{border:1px solid #e9f3fa}.b2{border:2px solid #e9f3fa}.b3{border:.75px solid #e9f3fa}.actionA{width:140px;height:38px;border-radius:999px}.actionB{width:148px;height:38px;border-radius:999px}.hit{position:relative;width:26px;height:26px;border:1px solid #7c8fa0;border-radius:7px;display:grid;place-items:center}.hit:before{content:"";position:absolute;width:44px;height:44px;border:1px dashed #63c3ff;border-radius:10px}.motion{display:flex;gap:10px;align-items:center}.motion i{width:52px;height:28px;border:1px solid #698093;display:grid;place-items:center;font-style:normal;font-size:9px}.m1{transition:.12s}.m2{transition:.16s}.m3{transition:.20s}.radii{display:flex;gap:8px}.radii i{width:45px;height:36px;border:1px solid #71869a;background:#0e151d}.r6{border-radius:6px!important}.r8{border-radius:8px!important}.r12{border-radius:12px!important}.r14{border-radius:14px!important}.rpill{border-radius:999px!important;width:62px!important}.space{display:flex;align-items:flex-end;gap:7px}.space i{display:block;width:26px;background:#27445c;border:1px solid #5c85a4}.s4{height:12px}.s6{height:18px}.s8{height:24px}.s10{height:30px}.s12{height:36px}.s16{height:48px}.shadows{display:flex;gap:14px}.shadow{width:74px;height:46px;border:1px solid #42576a;background:#0f161f}.sh1{box-shadow:0 2px 5px #000}.sh2{box-shadow:0 8px 18px #000}.sh3{box-shadow:0 15px 30px #000}.disabled{display:flex;gap:10px}.disabled .btn{width:90px;height:34px;border-radius:8px}.d1{opacity:.68}.d2{opacity:.55}.d3{opacity:.34}.typegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}.typegrid div{border:1px solid #334657;padding:7px;text-align:center}.typegrid b{display:block}.typegrid small{display:block;margin-top:4px}.json-head{margin:24px 0 8px;font-size:13px}textarea{width:100%;min-height:300px;background:#05080c;color:#dce7f1;border:1px solid #314457;border-radius:8px;padding:11px;font:11px/1.5 monospace}.legend{margin-top:14px;display:flex;gap:15px;flex-wrap:wrap;color:#718394;font-size:9px}.legend b{color:#b8c8d5}@media(max-width:1100px){.item{grid-template-columns:65px 180px 1fr 1fr}.toggle{grid-column:1/-1;justify-self:end}}@media(max-width:760px){.item{grid-template-columns:1fr}.visual{min-height:90px}.toggle{grid-column:auto;justify-self:start}}
</style></head><body><main><h1>Design-system Commonization Audit</h1><p class="lead">色・font-family・font-size以外で、共通トークン化しておくと保守事故を減らせる候補です。各項目に「今どこがバラバラなのか」を模式図で追加しました。</p><p class="sub">プレビューは本番の装飾を再現するものではなく、共通化対象の寸法・階層・間隔などを見比べるための図です。</p><div class="legend"><span><b>同じ形が並ぶ</b>＝同じ役割なのに別指定</span><span><b>破線</b>＝見た目とは別の領域</span><span><b>色分け</b>＝現在別トークン候補</span></div><div class="list" id="list"></div><h2 class="json-head">選択結果 JSON</h2><textarea id="out" readonly></textarea></main><script>
const D=[
['transport-geometry','最高','Transportボタン寸法','一時停止／楽譜再生の幅・高さ・radius・icon寸法。PC/スマホ差は別トークンで維持','transport'],
['toggle-geometry','最高','セットアップToggle寸法','本体幅・高さ・thumb径・移動距離・border幅','toggle'],
['dropdown-geometry','最高','Dropdown形状','曲名／演奏モードのtrigger高さ・padding・radius・option高さ・矢印寸法','dropdown'],
['z-index-layers','最高','z-index階層','background / content / chart / HUD / feedback / overlay / dropdown / top-effect','zindex'],
['mobile-layout-bases','高','スマホ基準座標','safe-left・header-height・chart-top等','mobile'],
['focus-ring','高','Focus ring','focus色・太さ・offset。形状は各controlへ追従','focus'],
['border-widths','高','Border width','default / focus / touch-optical','border'],
['action-button-geometry','高','Action button寸法','リザルト／マイク調整等の高さ・基本padding','action'],
['touch-hit-area','高','タップ領域','見た目と分離した最小hit-area。見た目寸法は維持','hit'],
['motion-timing','中','Motion timing','hover / press / popupのduration・easing。ゲーム固有演出は対象外','motion'],
['radius-scale','中','Radius scale','control / card / panel / pill','radius'],
['spacing-scale','中','Spacing scale','gap / padding / marginの基本scale','spacing'],
['elevation-shadow','中','Elevation / shadow','control / popup / panel / overlay。発光演出は対象外','shadow'],
['disabled-states','中','Disabled / locked','control / option / lockedの用途別opacity・filter','disabled'],
['typography-style','中','Typography style','weight / line-height / letter-spacing。ロゴ・score・判定など表現文字は対象外','type']
];
function V(k){switch(k){
case'transport':return `<div class="pair"><div><span class="vlabel">一時停止</span><div class="btn squareA">Ⅱ</div></div><div><span class="vlabel">楽譜再生</span><div class="btn squareB">▶</div></div></div>`;
case'toggle':return `<div class="pair"><div><span class="vlabel">PC</span><div class="toggle-ui"><i></i></div></div><div><span class="vlabel">スマホ</span><div class="toggle-ui" style="width:43px;height:24px"><i style="width:16px;height:16px"></i></div></div></div>`;
case'dropdown':return `<div class="pair"><div><span class="vlabel">曲名</span><div class="drop">なないろ <b>⌄</b></div></div><div><span class="vlabel">演奏モード</span><div class="drop alt">通常 <b>⌄</b></div></div></div>`;
case'zindex':return `<div class="stack"><span class="layer l1">BG</span><span class="layer l2">CHART</span><span class="layer l3">HUD</span><span class="layer l4">OVERLAY</span><span class="layer l5">DROPDOWN</span></div>`;
case'mobile':return `<div><span class="vlabel">safe-left / header / chart top</span><div class="phone"><i class="safe"></i><i class="headerline"></i><i class="chartline"></i></div></div>`;
case'focus':return `<div><span class="vlabel">focus-visible</span><div class="focusbox">SELECT / BUTTON</div></div>`;
case'border':return `<div class="borders"><div><span class="vlabel">1px</span><i class="b1"></i></div><div><span class="vlabel">2px</span><i class="b2"></i></div><div><span class="vlabel">0.75px</span><i class="b3"></i></div></div>`;
case'action':return `<div class="pair"><div><span class="vlabel">リザルト</span><div class="btn actionA">リトライ</div></div><div><span class="vlabel">マイク調整</span><div class="btn actionB">測定開始</div></div></div>`;
case'hit':return `<div><span class="vlabel">見た目26px / hit-area 44px例</span><div class="hit">▶</div></div>`;
case'motion':return `<div class="motion"><i class="m1">.12s</i><i class="m2">.16s</i><i class="m3">.20s</i></div>`;
case'radius':return `<div class="radii"><i class="r6"></i><i class="r8"></i><i class="r12"></i><i class="r14"></i><i class="rpill"></i></div>`;
case'spacing':return `<div class="space"><i class="s4"></i><i class="s6"></i><i class="s8"></i><i class="s10"></i><i class="s12"></i><i class="s16"></i></div>`;
case'shadow':return `<div class="shadows"><div><span class="vlabel">control</span><i class="shadow sh1"></i></div><div><span class="vlabel">popup</span><i class="shadow sh2"></i></div><div><span class="vlabel">panel</span><i class="shadow sh3"></i></div></div>`;
case'disabled':return `<div class="disabled"><div><span class="vlabel">control .68</span><div class="btn d1">START</div></div><div><span class="vlabel">option .55</span><div class="btn d2">MODE</div></div><div><span class="vlabel">locked .34</span><div class="btn d3">LOCKED</div></div></div>`;
case'type':return `<div class="typegrid"><div><b style="font-weight:700;line-height:1.1;letter-spacing:.02em">CONTROL</b><small>weight / line-height / tracking</small></div><div><b style="font-weight:800;line-height:1.3;letter-spacing:.12em">LABEL</b><small>weight / line-height / tracking</small></div><div><b style="font-weight:600;line-height:1.5;letter-spacing:0">DETAIL</b><small>weight / line-height / tracking</small></div></div>`;
default:return '<small>preview</small>'}}
const K='dm-token-audit-v1';let S={};try{S=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
function r(){list.innerHTML=D.map(x=>`<div class="item ${S[x[0]]?'on':''}" data-id="${x[0]}"><div class="p">${x[1]}</div><div class="name">${x[2]}</div><div class="desc">${x[3]}</div><div class="visual">${V(x[4])}</div><div class="toggle"><label><input type="checkbox" ${S[x[0]]?'checked':''}>共通化する</label></div></div>`).join('');document.querySelectorAll('.toggle input').forEach(i=>i.onchange=e=>{S[e.target.closest('.item').dataset.id]=e.target.checked;localStorage.setItem(K,JSON.stringify(S));r()});out.value=JSON.stringify({designSystemCommonization:D.map(x=>({id:x[0],priority:x[1],label:x[2],commonize:!!S[x[0]]}))},null,2)}r()
</script></body></html>
