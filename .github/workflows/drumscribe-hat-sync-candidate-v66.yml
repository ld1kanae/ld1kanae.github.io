name: DrumScribe synchronized hat candidate v66

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "drumscribe/models/hat-sync-candidate-rf-v66.json"
      - "drumscribe/hat-context-v57.js"
      - "drumscribe/transcribe.js"
      - "drumscribe/experiments/browser_hat_sync_candidate_production_v66.mjs"
      - "drumscribe/experiments/evaluate_hat_sync_candidate_production_v66.py"
      - ".github/workflows/drumscribe-hat-sync-candidate-v66.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install mido
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve repository
        run: |
          python -m http.server 8000 >/tmp/drumscribe-http.log 2>&1 &
          sleep 2
      - name: Generate fresh browser predictions
        run: node drumscribe/experiments/browser_hat_sync_candidate_production_v66.mjs
      - name: Score baseline and v66
        run: python drumscribe/experiments/evaluate_hat_sync_candidate_production_v66.py
      - name: Commit reproducible results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/experiments/results-hat-sync-candidate-production-predictions-v66.json
          git add drumscribe/experiments/results-hat-sync-candidate-production-v66.json
          git add drumscribe/experiments/HAT_SYNC_CANDIDATE_PRODUCTION_V66.md
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "drumscribe: record synchronized hat candidate v66 replay"
            git pull --rebase origin main
            git push
          fi
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: drumscribe-hat-sync-candidate-v66
          path: |
            drumscribe/experiments/results-hat-sync-candidate-production-predictions-v66.json
            drumscribe/experiments/results-hat-sync-candidate-production-v66.json
            drumscribe/experiments/HAT_SYNC_CANDIDATE_PRODUCTION_V66.md
          retention-days: 14
