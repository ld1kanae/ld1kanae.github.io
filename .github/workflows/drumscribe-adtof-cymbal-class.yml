name: DrumScribe ADTOF cymbal classification

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/iterative_search_adtof_cymbal_class.py"
      - ".github/workflows/drumscribe-adtof-cymbal-class.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy scipy
      - name: Run ADTOF cymbal classification cycles 169 to 171
        run: python drumscribe/experiments/iterative_search_adtof_cymbal_class.py
      - name: Commit MIDI and metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          git add drumscribe/experiments/generated-search-adtof-cymbal-class drumscribe/experiments/results-iterative-adtof-cymbal-class.json
          git diff --cached --quiet && exit 0
          git commit -m "Record ADTOF cymbal classification PDCA results [skip ci]"
          git push origin HEAD:drumscribe-v2-eval
