name: DrumScribe open-hat arrangement v43

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "drumscribe/open-hat.js"
      - "drumscribe/transcribe.js"
      - "drumscribe/arrangement/**"
      - "drumscribe/experiments/browser_openhat_arrangement_v43.mjs"
      - "drumscribe/experiments/evaluate_openhat_arrangement_v43.py"
      - ".github/workflows/drumscribe-openhat-arrangement-v43.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          pip install mido
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve repository
        run: |
          python -m http.server 8000 >/tmp/drumscribe-http.log 2>&1 &
          sleep 2
      - name: Generate articulation variants from drums plus offvocal
        run: node drumscribe/experiments/browser_openhat_arrangement_v43.mjs
      - name: Score strict articulation and ride-collapsed utility
        run: python drumscribe/experiments/evaluate_openhat_arrangement_v43.py
      - name: Commit reproducible results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/experiments/results-openhat-arrangement-predictions-v43.json
          git add drumscribe/experiments/results-openhat-arrangement-v43.json
          git add drumscribe/experiments/OPENHAT_ARRANGEMENT_V43.md
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "drumscribe: record open-hat arrangement v43 results"
            git pull --rebase origin main
            git push
          fi
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: drumscribe-openhat-arrangement-v43
          path: |
            drumscribe/experiments/results-openhat-arrangement-predictions-v43.json
            drumscribe/experiments/results-openhat-arrangement-v43.json
            drumscribe/experiments/OPENHAT_ARRANGEMENT_V43.md
          retention-days: 14
