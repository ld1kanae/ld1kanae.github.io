name: DrumScribe export open-hat overlay model
on:
  push:
    branches: [drumscribe-v2-eval]
    paths:
      - "drumscribe/experiments/export_open_hat_overlay_v1.py"
      - ".github/workflows/drumscribe-export-open-hat-overlay-v1.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: drumscribe-v2-eval, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install numpy scipy scikit-learn requests remotezip
      - name: Export overlay forest
        run: python drumscribe/experiments/export_open_hat_overlay_v1.py
      - name: Commit model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/models/open-hat-overlay-extra-trees-v1.json drumscribe/experiments/results-open-hat-overlay-model-export-v1.json
          git commit -m "Export browser open-hat overlay forest v1 [skip ci]" || exit 0
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin drumscribe-v2-eval
            if git push origin HEAD:drumscribe-v2-eval; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
