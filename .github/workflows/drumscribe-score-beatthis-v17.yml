name: DrumScribe score BeatThis v17

on:
  push:
    branches: [drumscribe-v2-eval]
    paths:
      - "drumscribe/experiments/score_beatthis_v17.py"
      - ".github/workflows/drumscribe-score-beatthis-v17.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mido numpy
      - run: python drumscribe/experiments/score_beatthis_v17.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/experiments/results-beatthis-v17.json
          git diff --cached --quiet && exit 0
          git commit -m "Score BeatThis arcaround benchmark v17 [skip ci]"
          git pull --rebase origin drumscribe-v2-eval
          git push origin HEAD:drumscribe-v2-eval
