name: DrumScribe open-hat production v47

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/drumscribe-openhat-production-v47.yml"

permissions:
  contents: write

jobs:
  adopt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Adopt validated open-hat policy
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f"replacement not found in {path}: {old}")
              p.write_text(s.replace(old,new))

          replace('drumscribe/transcribe.js',
                  "import {promoteOpenHats} from './open-hat.js?v=20260923-openhat-v42';",
                  "import {promoteOpenHats} from './open-hat.js?v=20260923-openhat-v47';")
          replace('drumscribe/transcribe.js',
                  "variant:options.openHatVariant||'decay-rescue',",
                  "variant:options.openHatVariant||'ride-open-decay-rescue',")
          replace('drumscribe/app.js',
                  "import {transcribe} from './transcribe.js?v=20260923-openhat-v42';",
                  "import {transcribe} from './transcribe.js?v=20260923-openhat-v47';")
          replace('drumscribe/index.html',
                  'app.js?v=20260923-timeline-v7-openhat-v42-arrangement-kst-v47',
                  'app.js?v=20260923-timeline-v7-openhat-v47-arrangement-kst-v47')
          replace('drumscribe/feedback.html',
                  'app.js?v=20260923-timeline-v8',
                  'app.js?v=20260923-timeline-v8-openhat-v47')

          handoff=Path('drumscribe/AI_HANDOFF.md')
          hs=handoff.read_text()
          marker='## 2026-09-23 Open/Closed Hi-Hat production v47'
          if marker not in hs:
              hs += '''\n\n---\n\n## 2026-09-23 Open/Closed Hi-Hat production v47\n\nproduction既定を `ride-open-decay-rescue` に更新。\n\n採用内容:\n- 5–18 kHz帯を中心とした局所減衰・tail persistenceをborderline 42/46判定に使用\n- GMD aggregate transition priorでopen→open runをrecall方向にのみ救済\n- Ride判定を重視しない要件に基づき、残存Ride候補をOpen HHへ丸める\n- A/A'による42/46 rescoringはv43で悪化したためproduction不採用\n- onset追加・削除は行わず、hat-family articulationのみ変更\n\n5曲fresh Chromium:\n- HH macro F1 0.719507 -> **0.745832** (+0.026325)\n- Closed F1 0.843292 -> **0.843895**\n- Open F1 0.595722 -> **0.647770**\n- collapsed hat/ride onset F1 0.812081 -> **0.817466**\n- Kick/Tom非退行、同一fresh run基準でK/S/Tへの悪影響なし\n\n注意:\n- strict Ride F1は0になる。これはRideをOpenへ丸める明示要件に沿った設計判断。\n- `OPENHAT_DEFAULT_VS_COMBINED_V46.md` のstrict metal macro guardrailは、Rideを保持する用途ではcombinedを採用しないという意味。現在の用途ではRide識別を優先しない。\n- 完全同期Diamond Virgin pairはopen→open教師468件を含む。保存場所は `experiments/reference-sync/README.md`。\n'''
              handoff.write_text(hs)

          validation=Path('drumscribe/VALIDATION.md')
          vs=validation.read_text()
          if marker not in vs:
              vs += '''\n\n---\n\n## 2026-09-23 Open/Closed Hi-Hat production v47\n\n採用variant: `ride-open-decay-rescue`\n\n| 指標 | baseline | adopted | delta |\n|---|---:|---:|---:|\n| HH macro F1 | 0.719507 | **0.745832** | **+0.026325** |\n| Closed HH F1 | 0.843292 | **0.843895** | **+0.000604** |\n| Open HH F1 | 0.595722 | **0.647770** | **+0.052047** |\n| collapsed HH/Ride onset F1 | 0.812081 | **0.817466** | **+0.005385** |\n\n- A/A' articulation rescoringはHH macroを悪化させたため不採用。\n- Ride識別を捨ててOpen HHへ丸める。strict Ride F1低下は仕様上許容。\n- onsetは増減せず、既存hat/ride onsetのarticulationのみ変更。\n- 詳細: `experiments/results-openhat-combined-v44.json`, `experiments/OPENHAT_DEFAULT_VS_COMBINED_V46.md`\n- 完全同期対照データ概要: `experiments/reference-sync/README.md`\n'''
              validation.write_text(vs)

          Path('.github/workflows/drumscribe-openhat-production-v47.yml').unlink()
          PY
      - name: Static checks
        run: |
          grep -q "ride-open-decay-rescue" drumscribe/open-hat.js
          grep -q "variant:options.openHatVariant||'ride-open-decay-rescue'" drumscribe/transcribe.js
          node --check drumscribe/open-hat.js
          node --check drumscribe/transcribe.js
          node --check drumscribe/app.js
      - name: Commit adoption
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "drumscribe: adopt stable open-hat v47 runtime"
          git pull --rebase origin main
          git push origin HEAD:main
