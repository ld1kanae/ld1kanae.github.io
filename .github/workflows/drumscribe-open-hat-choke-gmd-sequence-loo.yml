name: DrumScribe Open HH choke + GMD sequence LOO

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/models/gmd-kst/hihat-sequence-patterns-v2.json"
      - ".github/workflows/drumscribe-open-hat-choke-gmd-sequence-loo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install numpy scipy scikit-learn requests remotezip
      - name: Evaluate next-hit choke and GMD sequence ranking
        run: python drumscribe/experiments/open_hat_choke_gmd_sequence_loo.py
      - name: Commit benchmark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/experiments/results-open-hat-choke-gmd-sequence-loo.json
          git commit -m "Record Open HH choke plus GMD sequence LOO [skip ci]" || exit 0
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin drumscribe-v2-eval
            if git push origin HEAD:drumscribe-v2-eval; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
