name: DrumScribe fix open-hat handoff v47

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/drumscribe-fix-openhat-handoff-v47.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Clarify authoritative current state
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('drumscribe/AI_HANDOFF.md')
          s=p.read_text()
          title='# DrumScribe AI Handoff\n\n'
          current='''## CURRENT AUTHORITATIVE STATUS — Open/Closed Hi-Hat v47\n\n- production既定: `ride-open-decay-rescue`\n- 音響減衰 + open-run救済 + Ride→Open HH丸めを採用\n- 5曲fresh Chromium: HH macro F1 **0.719507 → 0.745832**、Open F1 **0.595722 → 0.647770**\n- K/S/T非退行\n- A/A\'による42/46再判定は悪化したため不採用\n- strict Ride精度は意図的に優先しない。下記v46節は、Ride保持を優先した場合の過去評価であり、現行方針を上書きしない\n- Diamond Virgin完全同期対照の識別情報・検証結果: `experiments/reference-sync/README.md`\n\n'''
          if current not in s:
              s=s.replace(title,title+current,1)
          s=s.replace(
            '## 2026-09-23 Open Hat / Ride strict check v46 — all-Ride→Open案は不採用',
            '## 2026-09-23 Open Hat / Ride strict check v46 — historical strict-Ride evaluation'
          )
          old='''結論:\n- Open改善のかなりの部分は既存RideをOpenへ丸めたことによる。\n- strict metal精度を悪化させるため**production不採用**。\n- defaultは引き続き `decay-rescue`。\n- 次実験v47ではRideのopen-hat acoustic probabilityが高い場合だけOpenへ変更し、その他はRideのまま保持するselective閾値 .70/.80/.90 を比較する。'''
          new='''当時のstrict-Ride評価:\n- Open改善のかなりの部分は既存RideをOpenへ丸めたことによる。\n- Rideを独立クラスとして守る評価軸ではmetal macroが低下した。\n- その後、ユーザー要件としてRide識別を優先せずOpen/Closed HHへ丸めてよいことが明示されたため、この不採用判断はv47で上書きされた。\n- 現行productionは `ride-open-decay-rescue`。'''
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s)
          Path('.github/workflows/drumscribe-fix-openhat-handoff-v47.yml').unlink()
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "drumscribe: clarify current open-hat v47 handoff"
          git pull --rebase origin main
          git push origin HEAD:main
