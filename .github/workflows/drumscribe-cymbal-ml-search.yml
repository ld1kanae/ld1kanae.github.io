name: DrumScribe cymbal ML search

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/iterative_search_cymbal_ml.py"
      - ".github/workflows/drumscribe-cymbal-ml-search.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install numpy scipy scikit-learn
      - name: Run search cycles 13 to 15
        run: python drumscribe/experiments/iterative_search_cymbal_ml.py
      - name: Commit ML-search MIDI and metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/experiments/generated-search-ml drumscribe/experiments/results-iterative-ml.json
          git diff --cached --quiet && exit 0
          git commit -m "Record DrumScribe cymbal ML search results [skip ci]"
          git pull --rebase origin drumscribe-v2-eval
          git push origin HEAD:drumscribe-v2-eval
