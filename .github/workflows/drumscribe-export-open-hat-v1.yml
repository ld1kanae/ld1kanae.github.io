name: DrumScribe export open-hat forest v1

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/export_open_hat_forest_v1.py"
      - ".github/workflows/drumscribe-export-open-hat-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install numpy scipy scikit-learn
      - name: Export open-hat forest
        run: python drumscribe/experiments/export_open_hat_forest_v1.py
      - name: Commit exported model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          git add drumscribe/models/open-hat-extra-trees-v1.json
          git add drumscribe/experiments/results-open-hat-model-export-v1.json
          git diff --cached --quiet && exit 0
          git commit -m "Export browser open-hat forest v1 [skip ci]"
          git push origin HEAD:drumscribe-v2-eval
