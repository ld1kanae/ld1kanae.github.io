name: DrumScribe beat phase

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/estimate_beat_phase.py"
      - ".github/workflows/drumscribe-beat-phase.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install numpy scipy
      - name: Estimate beat phase
        run: python drumscribe/experiments/estimate_beat_phase.py
      - name: Commit benchmark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          git add drumscribe/experiments/results-beat-phase.json
          git diff --cached --quiet && exit 0
          git commit -m "Record beat-phase benchmark [skip ci]"
          git push origin HEAD:drumscribe-v2-eval
