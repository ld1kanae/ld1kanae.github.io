name: DrumScribe runtime bundle

# refresh: alternating-hat-review-v1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/drumscribe-runtime-bundle.yml"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Package runtime subset
        run: |
          mkdir -p /tmp/runtime/drumscribe
          rsync -a \
            --exclude 'experiments' \
            --exclude 'review-manifest.json' \
            drumscribe/ /tmp/runtime/drumscribe/
          cp -a DruMaster/assets /tmp/runtime/DruMaster-assets
      - uses: actions/upload-artifact@v4
        with:
          name: drumscribe-runtime-main
          path: /tmp/runtime
          retention-days: 1
