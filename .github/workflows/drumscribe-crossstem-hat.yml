name: DrumScribe crossstem hat search

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/iterative_search_crossstem_hat.py"
      - ".github/workflows/drumscribe-crossstem-hat.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
          python -m pip install --upgrade pip
          pip install numpy scipy 'drumsep @ git+https://github.com/cukas/drumsep.git'
      - name: Run crossstem hat cycles 91 to 93
        run: python drumscribe/experiments/iterative_search_crossstem_hat.py
      - name: Commit MIDI and metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          git add drumscribe/experiments/generated-search-crossstem-hat drumscribe/experiments/results-iterative-crossstem-hat.json
          git diff --cached --quiet && exit 0
          git commit -m "Record crossstem hat PDCA results [skip ci]"
          git push origin HEAD:drumscribe-v2-eval
