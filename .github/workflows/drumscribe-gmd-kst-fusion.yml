name: DrumScribe GMD KST fusion

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/build_gmd_kst_prior.py"
      - "drumscribe/experiments/browser_gmd_kst_fusion.py"
      - ".github/workflows/drumscribe-gmd-kst-fusion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install mido numpy scipy
      - name: Download GMD MIDI only
        run: |
          mkdir -p /tmp/gmd
          curl -L --fail --retry 3 -o /tmp/gmd/groove.zip             https://storage.googleapis.com/magentadata/datasets/groove/groove-v1.0.0-midionly.zip
          echo "651cbc524ffb891be1a3e46d89dc82a1cecb09a57c748c7b45b844c4841dcc1e  /tmp/gmd/groove.zip" | sha256sum -c -
          unzip -q /tmp/gmd/groove.zip -d /tmp/gmd/data
      - name: Build KST prior
        run: |
          python drumscribe/experiments/build_gmd_kst_prior.py             --gmd-root /tmp/gmd/data             --output drumscribe/models/gmd-kst-prior.json
      - name: Benchmark three KST fusion hypotheses
        run: python drumscribe/experiments/browser_gmd_kst_fusion.py
      - name: Write attribution
        run: |
          cat > drumscribe/models/gmd-kst-prior-LICENSE.txt <<'TXT'
          This derived aggregate model uses the Groove MIDI Dataset v1.0.0
          by Google LLC, licensed under CC BY 4.0.
          Dataset: https://magenta.tensorflow.org/datasets/groove
          Paper: Jon Gillick, Adam Roberts, Jesse Engel, Douglas Eck, and
          David Bamman, "Learning to Groove with Inverse Sequence Transformations,"
          ICML 2019.
          Only aggregate statistics are stored here; source MIDI files are not committed.
          TXT
      - name: Commit aggregate and benchmark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          git add drumscribe/models/gmd-kst-prior.json drumscribe/models/gmd-kst-prior-LICENSE.txt             drumscribe/experiments/results-browser-gmd-kst-fusion.json
          git diff --cached --quiet && exit 0
          git commit -m "Record GMD kick snare tom fusion benchmark [skip ci]"
          git push origin HEAD:drumscribe-v2-eval
