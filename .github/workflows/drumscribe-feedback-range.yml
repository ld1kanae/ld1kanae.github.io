name: DrumScribe feedback range selection

on:
  push:
    branches: [main]
    paths:
      - "drumscribe/feedback.html"
      - "drumscribe/feedback.js"
      - "drumscribe/app.js"
      - "drumscribe/style.css"
      - "drumscribe/experiments/feedback_range_smoke.mjs"
      - ".github/workflows/drumscribe-feedback-range.yml"
  workflow_dispatch:

concurrency:
  group: drumscribe-feedback-range
  cancel-in-progress: true

jobs:
  range-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve checked-out site
        run: |
          python3 -m http.server 8000 > /tmp/drumscribe-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsSL "http://127.0.0.1:8000/drumscribe/feedback.html" | grep -q "feedback.js?v=20260923-timeline-v7"; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/drumscribe-http.log >&2 || true
          exit 1
      - name: Verify waveform range selection
        env:
          DRUMSCRIBE_FEEDBACK_URL: "http://127.0.0.1:8000/drumscribe/feedback.html?ci=${{ github.sha }}"
        run: node drumscribe/experiments/feedback_range_smoke.mjs
