name: DrumScribe browser component fusion

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/iterative_search_browser_component_fusion.py"
      - ".github/workflows/drumscribe-browser-component-fusion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install evaluator dependencies
        run: pip install numpy scipy
      - name: Run cycles 195 to 197
        run: python drumscribe/experiments/iterative_search_browser_component_fusion.py
      - name: Commit MIDI and metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          git add drumscribe/experiments/generated-search-browser-component-fusion drumscribe/experiments/results-iterative-browser-component-fusion.json
          git diff --cached --quiet && exit 0
          git commit -m "Record browser component fusion cycles [skip ci]"
          git push origin HEAD:drumscribe-v2-eval
