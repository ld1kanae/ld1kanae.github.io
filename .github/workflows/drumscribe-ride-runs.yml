name: DrumScribe ride run search

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/iterative_search_ride_runs.py"
      - ".github/workflows/drumscribe-ride-runs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy scipy
      - name: Run ride-run cycles 91 to 93
        run: python drumscribe/experiments/iterative_search_ride_runs.py
      - name: Commit MIDI and metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          git add drumscribe/experiments/generated-search-ride-runs drumscribe/experiments/results-iterative-ride-runs.json
          git diff --cached --quiet && exit 0
          git commit -m "Record periodic ride-run PDCA results [skip ci]"
          git push origin HEAD:drumscribe-v2-eval
