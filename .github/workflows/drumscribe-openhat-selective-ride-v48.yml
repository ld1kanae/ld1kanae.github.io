name: DrumScribe openhat selective ride v48

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "drumscribe/open-hat.js"
      - "drumscribe/experiments/browser_openhat_selective_ride_v48.mjs"
      - "drumscribe/experiments/evaluate_openhat_selective_ride_v48.py"
      - ".github/workflows/drumscribe-openhat-selective-ride-v48.yml"

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install mido
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve repository
        run: |
          python -m http.server 8000 >/tmp/drumscribe-http.log 2>&1 &
          sleep 2
      - name: Generate selective Ride-to-Open predictions
        run: node drumscribe/experiments/browser_openhat_selective_ride_v48.mjs
      - name: Score Open Closed Ride and KST
        run: python drumscribe/experiments/evaluate_openhat_selective_ride_v48.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/experiments/results-openhat-selective-ride-predictions-v48.json
          git add drumscribe/experiments/results-openhat-selective-ride-v48.json
          git add drumscribe/experiments/OPENHAT_SELECTIVE_RIDE_V48.md
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "drumscribe: record selective ride open-hat v48"
            git pull --rebase origin main
            git push
          fi
