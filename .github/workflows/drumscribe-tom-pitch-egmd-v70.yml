name: DrumScribe tom pitch E-GMD v70

on:
  push:
    branches: [main]
    paths:
      - "drumscribe/experiments/train_egmd_tom_pitch_v70.py"
      - ".github/workflows/drumscribe-tom-pitch-egmd-v70.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install numpy scipy scikit-learn mido requests remotezip
      - name: Train on E-GMD and transfer-test
        run: python drumscribe/experiments/train_egmd_tom_pitch_v70.py
      - name: Commit reproducible experiment outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/experiments/tom-pitch-model-v70.json
          git add drumscribe/experiments/results-tom-pitch-v70.json
          git add drumscribe/experiments/TOM_PITCH_V70.md
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "drumscribe: record E-GMD tom pitch v70 results"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: drumscribe-tom-pitch-egmd-v70
          path: |
            drumscribe/experiments/tom-pitch-model-v70.json
            drumscribe/experiments/results-tom-pitch-v70.json
            drumscribe/experiments/TOM_PITCH_V70.md
          retention-days: 14
