name: DrumScribe Proof v34 runtime bundle

on:
  workflow_dispatch:
  push:
    branches:
      - drumscribe-proof-v34
    paths:
      - ".github/workflows/drumscribe-proof-v34-runtime-bundle.yml"

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-proof-v34
      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: proof-v34-runtime
          path: |
            drumscribe/
            DruMaster/assets/
          retention-days: 2
