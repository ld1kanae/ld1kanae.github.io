name: DrumScribe crash low-mid tail v57
on:
  push:
    branches: [main]
    paths:
      - "drumscribe/crash-competition.js"
      - "drumscribe/experiments/browser_validate_crash_tail_v57.mjs"
      - "drumscribe/experiments/compare_crash_tail_v57.py"
      - ".github/workflows/drumscribe-crash-tail-v57.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          pip install numpy scipy
      - name: Serve repository
        run: |
          python -m http.server 8000 >/tmp/drumscribe-http.log 2>&1 &
          sleep 2
      - name: Fresh-generate tail variants
        run: node drumscribe/experiments/browser_validate_crash_tail_v57.mjs
      - name: Score crash and KST non-regression
        run: python drumscribe/experiments/compare_crash_tail_v57.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/experiments/results-crash-tail-v57.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "drumscribe: record crash low-mid tail v57"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
