name: DrumScribe LOSO ML component export

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/evaluate_ml_cv.py"
      - ".github/workflows/drumscribe-ml-component-export.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install numpy scipy scikit-learn
      - name: Re-run LOSO ML and export prediction MIDI
        run: python drumscribe/experiments/evaluate_ml_cv.py
      - name: Commit exported component MIDI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/experiments/generated-round4-ml drumscribe/experiments/results-v2-round4-ml.json
          git diff --cached --quiet && exit 0
          git commit -m "Export LOSO ML component MIDI [skip ci]"
          git pull --rebase origin drumscribe-v2-eval
          git push origin HEAD:drumscribe-v2-eval
