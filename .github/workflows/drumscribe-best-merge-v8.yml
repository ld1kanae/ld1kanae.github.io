name: DrumScribe best merge v8

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/iterative_search_best_merge_v8.py"
      - ".github/workflows/drumscribe-best-merge-v8.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install evaluator dependencies
        run: pip install numpy scipy
      - name: Run cycles 216 to 218
        run: python drumscribe/experiments/iterative_search_best_merge_v8.py
      - name: Commit MIDI and metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          git add drumscribe/experiments/generated-search-best-merge-v8 drumscribe/experiments/results-iterative-best-merge-v8.json
          git diff --cached --quiet && exit 0
          git commit -m "Record best merge v8 cycles [skip ci]"
          git push origin HEAD:drumscribe-v2-eval
