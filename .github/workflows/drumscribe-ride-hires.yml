name: DrumScribe 44k ride search

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/iterative_search_ride_hires.py"
      - ".github/workflows/drumscribe-ride-hires.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install numpy scipy scikit-learn
      - name: Run ride cycles 82 to 84
        run: python drumscribe/experiments/iterative_search_ride_hires.py
      - name: Commit MIDI and metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          git add drumscribe/experiments/generated-search-ride-hires drumscribe/experiments/results-iterative-ride-hires.json
          git diff --cached --quiet && exit 0
          git commit -m "Record 44k ride PDCA results [skip ci]"
          git push origin HEAD:drumscribe-v2-eval
