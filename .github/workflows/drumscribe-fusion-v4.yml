name: DrumScribe fusion v4 search

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/iterative_search_fusion_v4.py"
      - ".github/workflows/drumscribe-fusion-v4.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy scipy
      - name: Run fusion-v4 cycles 121 to 123
        run: python drumscribe/experiments/iterative_search_fusion_v4.py
      - name: Commit MIDI and metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          git add drumscribe/experiments/generated-search-fusion-v4 drumscribe/experiments/results-iterative-fusion-v4.json
          git diff --cached --quiet && exit 0
          git commit -m "Record latest all-part fusion v4 results [skip ci]"
          git push origin HEAD:drumscribe-v2-eval || {
            git pull --rebase origin drumscribe-v2-eval
            git push origin HEAD:drumscribe-v2-eval
          }
