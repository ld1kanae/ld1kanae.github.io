name: DrumScribe current precision report

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/build_current_precision_report.py"
      - "drumscribe/experiments/generated-search-*/**/*.mid"
      - ".github/workflows/drumscribe-current-precision.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy scipy
      - name: Build current precision report
        run: python drumscribe/experiments/build_current_precision_report.py
      - name: Commit precision report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          python drumscribe/experiments/build_current_precision_report.py
          git add drumscribe/experiments/CURRENT_PRECISION_REPORT.md drumscribe/experiments/current-precision-report.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh current detailed precision report [skip ci]"
          git push origin HEAD:drumscribe-v2-eval || {
            git pull --rebase origin drumscribe-v2-eval
            git push origin HEAD:drumscribe-v2-eval
          }
