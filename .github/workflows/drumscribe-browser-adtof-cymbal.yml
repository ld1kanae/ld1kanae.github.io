name: DrumScribe browser ADTOF cymbal search

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/browser_adtof_cymbal_search.py"
      - ".github/workflows/drumscribe-browser-adtof-cymbal.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy scipy
      - name: Search ADTOF cymbal browser policy
        run: python drumscribe/experiments/browser_adtof_cymbal_search.py
      - name: Commit benchmark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/experiments/results-browser-adtof-cymbal-search.json
          git diff --cached --quiet && exit 0
          git commit -m "Record browser ADTOF cymbal search [skip ci]"
          git pull --rebase origin drumscribe-v2-eval
          git push origin HEAD:drumscribe-v2-eval
