name: DrumScribe fixed-threshold 44k hat v11

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/iterative_search_hat_fixed_threshold_v11.py"
      - ".github/workflows/drumscribe-hat-fixed-threshold-v11.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install numpy scipy scikit-learn
      - name: Run fixed-threshold hat cycles
        run: python drumscribe/experiments/iterative_search_hat_fixed_threshold_v11.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          git add drumscribe/experiments/results-iterative-hat-fixed-threshold-v11.json
          git add drumscribe/experiments/generated-search-hat-fixed-threshold-v11
          git diff --cached --quiet && exit 0
          git commit -m "Record fixed-threshold hat cycles 225-227 [skip ci]"
          git push origin HEAD:drumscribe-v2-eval
