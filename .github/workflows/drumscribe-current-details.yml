name: DrumScribe current detailed metrics

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/materialize_current_details.py"
      - ".github/workflows/drumscribe-current-details.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  details:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy scipy
      - name: Write full timing/detail metrics
        run: python drumscribe/experiments/materialize_current_details.py
      - name: Commit detailed metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          git add drumscribe/experiments/detailed-current
          git diff --cached --quiet && exit 0
          git commit -m "Record full timing metrics for current leaders [skip ci]"
          git push origin HEAD:drumscribe-v2-eval
