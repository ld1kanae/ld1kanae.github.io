- current Open ratio <= 0.12

既存5曲では0/5発火し、全イベント/指標がbaselineと一致。

### v52 production fresh validation

Defaultを `inversion-guarded-rescue` に変更。

既存5曲:
- exact event equality vs v51 off: true
- kick F1 0.962571 delta 0
- snare F1 0.900035 delta 0
- tom F1 0.784091 delta 0
- closed F1 0.843895 delta 0
- open F1 0.602285 delta 0
- collapsed HH/Ride F1 0.812081 delta 0

対象upload fresh default:
- gate true
- accepted windows 425 / runs 17 / selected slots 581
- changed 211 / cymbal->HH 18 / off-grid removed 25 / rescued 96
- output event listはselected v51 H3と完全一致。

Reference MIDIはpredictionでは読まず、5曲の生成後scoringだけに使用。
'''
          if vtitle not in v:
              val.write_text(v+vblock)

          for path in ['.github/workflows/drumscribe-runtime-bundle.yml','.github/workflows/drumscribe-hat-sequence-docs-v52.yml']:
              p=Path(path)
              if p.exists():p.unlink()
          PY
      - name: Commit documentation and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "drumscribe: document alternating hi-hat v52 adoption"
          git pull --rebase origin main
          git push origin HEAD:main
