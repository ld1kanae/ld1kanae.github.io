name: DrumScribe alternating hi-hat v52 docs cleanup

on:
  push:
    branches: [main]
    paths: [".github/workflows/drumscribe-hat-sequence-docs-v52.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Update handoff and validation
        run: |
          python - <<'PY'
          from pathlib import Path
          handoff=Path('drumscribe/AI_HANDOFF.md')
          s=handoff.read_text()
          title='## 2026-09-23 Alternating Hi-Hat v52 — production採用済み'
          block='''## 2026-09-23 Alternating Hi-Hat v52 — production採用済み

対象レビュー:
- uploaded `君は詩人になった [drums].wav`
- 10個のユーザー指定区間。多くが8分の Closed/Open 交互列。

原因:
- 対象音源では従来Open確率が最大0.6565、Open比率5.24%まで圧縮され、trusted-open anchorが0だった。
- 既存decay self-calibration / GMD open-run rescueが起動できなかった。
- 交互列でsequence上のOpen位置の従来確率がClosed位置より低い（0.3827 vs 0.4816、delta -0.0989）というdomain inversionが起きていた。
- 一部は42/46分類だけでなく、HH候補の事前削除、Crash誤分類、余分な16分metalを含んだ。

採用runtime:
- `models/alternating-hi-hat-review-v1.json`
- `hat-sequence.js`
- default `hatSequenceVariant = inversion-guarded-rescue`
- 3–21 kHzを4bandに分け、pre-hit / current tail / next eighth直前 / next articulation後の減衰・chokeを使用。
- 強い8分交互列でのみ42/46を再判定。
- in-run Crash/RideをHHへ丸め、off-eighth metalを削除。
- broad ADTOF metalまたは強いhigh-band onsetがあり、二手制約を守れる欠落slotだけ救済。

重要gate:
- 曲名・file名・レビュー絶対時刻を使わない。
- legacy probability sample数、negative parity correlation、max legacy probability、current Open ratioをsong-local判定。
- v50 ungatedは既存5曲467音を書き換えHH macro F1を0.7231→0.6304以下へ悪化させたため不採用。
- v51 inversion gateでは既存5曲0/5発火。

対象10区間:
- exact 42/46 F1: 0.357143 -> **0.877193**
- exact precision: 0.415020 -> **0.941781**
- exact recall: 0.313433 -> **0.820896**
- onset F1: 0.755102 -> **0.880383**
- target K/S/T counts: 418 / 260 / 18、変更なし。
- 完全復元ではない。Review 4は125期待中87 exact、Review 10は53中45 exact。

既存5曲fresh default runtime v52:
- exact event-list equality vs previous default: true
- gate fired: 0/5
- kick/snare/tom delta: 0 / 0 / 0
- closed/open/ride/pedal/crash delta: すべて0
- chart.midはbrowser prediction後のscoringだけに使用。

検証:
- `experiments/KIMIHASHIJIN_HAT_REVIEW_V52.md`
- `experiments/HAT_SEQUENCE_REVIEW_V50.md`（不採用ungated）
- `experiments/HAT_SEQUENCE_REVIEW_V51.md`（gate校正）
- `experiments/HAT_SEQUENCE_RUNTIME_V52.md`（fresh default）
- `experiments/results-hat-sequence-v50.json`
- `experiments/results-hat-sequence-v51.json`
- `experiments/results-hat-sequence-runtime-v52.json`

'''
          if title not in s:
              marker='# DrumScribe AI Handoff\n\n'
              if marker in s:s=s.replace(marker,marker+block,1)
              else:s=block+s
              handoff.write_text(s)

          val=Path('drumscribe/VALIDATION.md');v=val.read_text()
          vtitle='## 2026-09-23: Alternating Hi-Hat v50-v52 — 君は詩人 review修正'
          vblock='''

---

## 2026-09-23: Alternating Hi-Hat v50-v52 — 君は詩人 review修正

### 入力

- uploaded `君は詩人になった [drums].wav`
- duration 181.79104166666667 sec
- SHA-256 `2a27998b8c38f0a80bfacc6605ba8a2e9674a6739cb4f3e96b03cac30993bda0`
- user review 10 ranges
- fresh BPM 134.00772874831776 / bar phase 0.012158813638728061 sec

この曲にはgold chart.midがない。期待slotはユーザーコメントとBPM/phaseの8分gridから解釈。短区間のexact alignmentは評価上の推論でありruntimeには絶対時刻を埋め込まない。

### 原因

- Open probability max 0.656499、current Open ratio 0.052419、trusted Open anchor 0。
- sequence Open位置のlegacy p 0.382673、Closed位置0.481576、parity delta -0.098903。
- 既存self-calibrationがbootstrap不能。
- articulation errorに加えて、missing HH onset / Crash誤分類 / off-grid 16th metalが混在。

### 3仮説

| Variant | exact 42/46 F1 | precision | recall | onset F1 |
|---|---:|---:|---:|---:|
| off | 0.357143 | 0.415020 | 0.313433 | 0.755102 |
| inversion-articulation | 0.751701 | 0.873518 | 0.659701 | 0.755102 |
| inversion-metal-grid | 0.779541 | 0.952586 | 0.659701 | 0.783069 |
| **inversion-guarded-rescue** | **0.877193** | **0.941781** | **0.820896** | **0.880383** |

target K/S/T countsは全variantで kick 418 / snare 260 / tom 18。

### v50 rejection

Ungated sequence repairは5曲で467音を変更し、HH macro F1 0.723090から:
- articulation 0.630352
- metal-grid 0.615958
- guarded-rescue 0.615707

へ悪化。不採用。

### v51 inversion gate

Runtime identity-independent gate:
- probability samples >= 24
- legacy parity delta <= -0.055
