name: DrumScribe GMD pedal low-candidate extension

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/browser_gmd_pedal_lowcand.py"
      - "drumscribe/models/gmd-metal-prior.json"
      - ".github/workflows/drumscribe-gmd-pedal-lowcand.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU inference stack
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install --no-deps "git+https://github.com/xavriley/ADTOF-pytorch.git"
          pip install librosa pretty_midi numpy scipy scikit-learn mido
      - name: Evaluate low-candidate pedal extension
        run: python drumscribe/experiments/browser_gmd_pedal_lowcand.py
      - name: Commit benchmark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          git add drumscribe/experiments/results-browser-gmd-pedal-lowcand.json
          git diff --cached --quiet && exit 0
          git commit -m "Record low-candidate GMD pedal extension [skip ci]"
          git push origin HEAD:drumscribe-v2-eval
