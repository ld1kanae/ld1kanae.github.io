name: DrumScribe train raw acoustic hat v64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "drumscribe/experiments/train_hat_raw_acoustic_v64.py"
      - "drumscribe/experiments/results-hat-raw-acoustic-candidates-v63.json"
      - ".github/workflows/drumscribe-train-hat-raw-acoustic-v64.yml"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mido numpy scikit-learn
      - name: Train
        run: python drumscribe/experiments/train_hat_raw_acoustic_v64.py
      - name: Commit model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/models/hat-raw-acoustic-v64.json
          git add drumscribe/experiments/HAT_RAW_ACOUSTIC_MODEL_V64.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "drumscribe: train raw acoustic hi-hat v64"
            git pull --rebase origin main
            git push
          fi
