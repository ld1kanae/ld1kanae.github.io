name: DrumScribe export hat forest v11

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/export_hat_forest_v11.py"
      - ".github/workflows/drumscribe-export-hat-forest-v11.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install numpy scipy scikit-learn
      - name: Export forest
        run: python drumscribe/experiments/export_hat_forest_v11.py
      - name: Commit exported model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          git add drumscribe/models/hat-extra-trees-v11.json
          git add drumscribe/experiments/results-hat-model-export-v11.json
          git diff --cached --quiet && exit 0
          git commit -m "Export browser hat forest v11 [skip ci]"
          git push origin HEAD:drumscribe-v2-eval
