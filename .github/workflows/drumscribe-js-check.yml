name: DrumScribe JS check

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/app.js"
      - "drumscribe/transcribe.js"
      - "drumscribe/midi.js"
      - "drumscribe/fft-worker.js"\n      - "drumscribe/hat-forest.js"\n      - "drumscribe/models/hat-extra-trees-v11.json"
      - "drumscribe/index.html"
      - "drumscribe/style.css"
      - "drumscribe/review.js"
      - "drumscribe/review.html"
      - "drumscribe/review.css"
      - "drumscribe/review-manifest.json"
      - ".github/workflows/drumscribe-js-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check drumscribe/app.js
          node --check drumscribe/transcribe.js
          node --check drumscribe/midi.js
          node --check drumscribe/review.js
          node --check drumscribe/fft-worker.js\n          node --check drumscribe/hat-forest.js
