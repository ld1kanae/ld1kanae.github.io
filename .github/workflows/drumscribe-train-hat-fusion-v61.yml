name: DrumScribe train hat fusion v61

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "drumscribe/experiments/train_hat_fusion_model_v61.py"
      - "drumscribe/experiments/results-hat-fusion-candidates-v60.json"
      - ".github/workflows/drumscribe-train-hat-fusion-v61.yml"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install mido numpy scikit-learn
      - name: Train production acoustic articulation model
        run: python drumscribe/experiments/train_hat_fusion_model_v61.py
      - name: Commit model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/models/hat-articulation-fusion-v61.json
          git add drumscribe/experiments/HAT_FUSION_MODEL_V61.md
          if git diff --cached --quiet; then
            echo "No model changes"
          else
            git commit -m "drumscribe: train hat articulation fusion v61"
            git pull --rebase origin main
            git push
          fi
