name: DrumScribe arrangement E-GMD portable v46

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "drumscribe/experiments/evaluate_arrangement_egmd_portable_v46.py"
      - "drumscribe/experiments/results-arrangement-kst-candidates-v44.json"
      - ".github/workflows/drumscribe-arrangement-egmd-portable-v46.yml"

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install mido numpy scikit-learn
      - name: Evaluate portable residual gates
        run: python drumscribe/experiments/evaluate_arrangement_egmd_portable_v46.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/experiments/results-arrangement-egmd-portable-v46.json
          git add drumscribe/experiments/ARRANGEMENT_EGMD_PORTABLE_V46.md
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "drumscribe: record portable E-GMD residual v46 results"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: drumscribe-arrangement-egmd-portable-v46
          path: |
            drumscribe/experiments/results-arrangement-egmd-portable-v46.json
            drumscribe/experiments/ARRANGEMENT_EGMD_PORTABLE_V46.md
          retention-days: 14
