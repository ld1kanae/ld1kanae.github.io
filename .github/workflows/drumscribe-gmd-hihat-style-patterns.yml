name: DrumScribe GMD hi-hat style patterns

on:
  push:
    branches: [drumscribe-v2-eval]
    paths:
      - "drumscribe/experiments/build_gmd_hihat_style_patterns.py"
      - ".github/workflows/drumscribe-gmd-hihat-style-patterns.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install mido requests
      - name: Build GMD style pattern data
        run: python drumscribe/experiments/build_gmd_hihat_style_patterns.py
      - name: Commit generated learning data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/models/gmd-kst/hihat-style-patterns-v1.json
          git commit -m "Build GMD genre hi-hat pattern data [skip ci]" || exit 0
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin drumscribe-v2-eval
            if git push origin HEAD:drumscribe-v2-eval; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
