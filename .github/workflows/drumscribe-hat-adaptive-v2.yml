name: DrumScribe hat adaptive v2

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/iterative_search_hat_adaptive_v2.py"
      - ".github/workflows/drumscribe-hat-adaptive-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install evaluator dependencies
        run: pip install numpy scipy
      - name: Run cycles 207 to 209
        run: python drumscribe/experiments/iterative_search_hat_adaptive_v2.py
      - name: Commit MIDI and metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          git add drumscribe/experiments/generated-search-hat-adaptive-v2 drumscribe/experiments/results-iterative-hat-adaptive-v2.json
          git diff --cached --quiet && exit 0
          git commit -m "Record adaptive c200 hat-filter cycles [skip ci]"
          git push origin HEAD:drumscribe-v2-eval
