name: DrumScribe GMD E-GMD open-hat augmentation

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/external_hat_augmentation.py"
      - ".github/workflows/drumscribe-open-hat-external.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install numpy scipy scikit-learn requests remotezip
      - name: Run GMD / E-GMD augmentation
        run: python drumscribe/experiments/external_hat_augmentation.py
      - name: Commit benchmark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/experiments/results-open-hat-external-augmentation.json
          git diff --cached --quiet && exit 0
          git commit -m "Record GMD E-GMD open-hat augmentation benchmark [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin drumscribe-v2-eval
            if git push origin HEAD:drumscribe-v2-eval; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
