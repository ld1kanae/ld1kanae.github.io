name: DrumScribe detailed history backfill

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/generated*/**/*.mid"
      - "drumscribe/experiments/backfill_detailed_history.py"
      - "drumscribe/experiments/detailed_metrics.py"
      - ".github/workflows/drumscribe-detailed-history.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install evaluator dependencies
        run: pip install numpy scipy
      - name: Re-score every generated candidate
        run: python drumscribe/experiments/backfill_detailed_history.py
      - name: Commit detailed history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/experiments/detailed-history
          git diff --cached --quiet && exit 0
          git commit -m "Backfill canonical detailed validation history [skip ci]"
          git pull --rebase origin drumscribe-v2-eval
          git push origin HEAD:drumscribe-v2-eval
