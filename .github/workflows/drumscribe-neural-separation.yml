name: DrumScribe neural separation search

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/iterative_search_neural_separation.py"
      - ".github/workflows/drumscribe-neural-separation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
          python -m pip install --upgrade pip
          pip install numpy scipy scikit-learn mdxnet-infer 'drumsep @ git+https://github.com/cukas/drumsep.git'
      - name: Run cycles 49 to 51
        run: python drumscribe/experiments/iterative_search_neural_separation.py
      - name: Refresh validation catalog
        run: python drumscribe/experiments/build_validation_catalog.py
      - name: Commit MIDI, metrics and component bank
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             drumscribe/experiments/generated-search-neural-separation             drumscribe/experiments/results-iterative-neural-separation.json             drumscribe/experiments/validation-history.json             drumscribe/experiments/component-bank.json
          git diff --cached --quiet && exit 0
          git commit -m "Record neural separation PDCA results [skip ci]"
          git pull --rebase origin drumscribe-v2-eval
          git push origin HEAD:drumscribe-v2-eval
