name: DrumScribe export GMD open-hat forest v2

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/export_open_hat_forest_v2.py"
      - ".github/workflows/drumscribe-export-open-hat-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install numpy scipy scikit-learn requests remotezip
      - name: Export retained GMD open-hat forest
        run: python drumscribe/experiments/export_open_hat_forest_v2.py
      - name: Commit exported model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/models/open-hat-extra-trees-v2.json
          git add drumscribe/experiments/results-open-hat-model-export-v2.json
          git diff --cached --quiet && exit 0
          git commit -m "Export GMD browser open-hat forest v2 [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin drumscribe-v2-eval
            if git push origin HEAD:drumscribe-v2-eval; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
