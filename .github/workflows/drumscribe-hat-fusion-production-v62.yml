name: DrumScribe production hat fusion v62

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "drumscribe/hat-context-v57.js"
      - "drumscribe/transcribe.js"
      - "drumscribe/models/hat-articulation-fusion-v61.json"
      - "drumscribe/experiments/browser_hat_fusion_production_v62.mjs"
      - "drumscribe/experiments/evaluate_hat_fusion_production_v62.py"
      - ".github/workflows/drumscribe-hat-fusion-production-v62.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install mido
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve
        run: |
          python -m http.server 8000 >/tmp/drumscribe-http.log 2>&1 &
          sleep 2
      - name: Generate fresh production OFF/ON predictions
        run: node drumscribe/experiments/browser_hat_fusion_production_v62.mjs
      - name: Score
        run: python drumscribe/experiments/evaluate_hat_fusion_production_v62.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/experiments/results-hat-fusion-production-predictions-v62.json
          git add drumscribe/experiments/results-hat-fusion-production-v62.json
          git add drumscribe/experiments/HAT_FUSION_PRODUCTION_V62.md
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "drumscribe: record production hat fusion v62 results"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: drumscribe-hat-fusion-production-v62
          path: |
            drumscribe/experiments/results-hat-fusion-production-predictions-v62.json
            drumscribe/experiments/results-hat-fusion-production-v62.json
            drumscribe/experiments/HAT_FUSION_PRODUCTION_V62.md
          retention-days: 14
