name: DrumScribe hat sequence diagnostic hook

on:
  push:
    branches: [main]
    paths: [".github/workflows/drumscribe-hat-sequence-debug-hook.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Add opt-in diagnostic payload
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('drumscribe/transcribe.js');s=p.read_text()
          old="    diagnostics:options.diagnosticKst===true?{"
          new="    hatSequenceDebug:options.diagnosticHatSequence===true?{events:pruned,broadMetal:adtofBroadMetal}:undefined,\n    diagnostics:options.diagnosticKst===true?{"
          if old not in s: raise SystemExit('return insertion not found')
          p.write_text(s.replace(old,new,1))
          Path('.github/workflows/drumscribe-hat-sequence-debug-hook.yml').unlink()
          PY
      - run: node --check drumscribe/transcribe.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "drumscribe: expose opt-in hat sequence diagnostics"
          git pull --rebase origin main
          git push origin HEAD:main
