name: DrumScribe hat choke learning v44

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "drumscribe/experiments/analyze_hat_choke_five_v44.py"
      - ".github/workflows/drumscribe-hat-choke-v44.yml"

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install numpy scipy scikit-learn mido
      - name: Learn persistent vs choked open-hi-hat decay
        run: python drumscribe/experiments/analyze_hat_choke_five_v44.py
      - name: Commit research results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/experiments/results-hat-choke-five-v44.json
          git add drumscribe/experiments/hat-choke-logreg-candidate-v44.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "drumscribe: record hi-hat choke learning v44"
            git pull --rebase origin main
            git push
          fi
