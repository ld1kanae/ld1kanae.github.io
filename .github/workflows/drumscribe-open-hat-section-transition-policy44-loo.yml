name: DrumScribe Open HH transition policy44 LOO

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/open_hat_section_transition_policy44_loo.py"
      - ".github/workflows/drumscribe-open-hat-section-transition-policy44-loo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install numpy scipy scikit-learn requests remotezip mido
      - name: Materialize canonical arrangement analyzer from main
        run: |
          git fetch origin main
          mkdir -p drumscribe/arrangement
          git show origin/main:drumscribe/arrangement/index.js > drumscribe/arrangement/index.js
          git show origin/main:drumscribe/arrangement/section-analysis.js > drumscribe/arrangement/section-analysis.js
      - name: Evaluate O-O / O-Closed transition selector
        run: python drumscribe/experiments/open_hat_section_transition_policy44_loo.py
      - name: Commit benchmark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/experiments/results-open-hat-section-transition-policy44-loo.json
          git commit -m "Record Open HH transition policy44 LOO [skip ci]" || exit 0
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin drumscribe-v2-eval
            if git push origin HEAD:drumscribe-v2-eval; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
