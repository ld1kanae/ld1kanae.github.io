name: DrumScribe hybrid bar phase

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/estimate_bar_phase_hybrid.py"
      - ".github/workflows/drumscribe-bar-phase-hybrid.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install numpy scipy
      - name: Benchmark hybrid bar phase
        run: python drumscribe/experiments/estimate_bar_phase_hybrid.py
      - name: Commit benchmark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          git add drumscribe/experiments/results-bar-phase-hybrid.json
          git diff --cached --quiet && exit 0
          git commit -m "Record hybrid bar-phase benchmark [skip ci]"
          git push origin HEAD:drumscribe-v2-eval
