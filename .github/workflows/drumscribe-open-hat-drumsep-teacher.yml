name: DrumScribe DrumSep HH teacher diagnostic

on:
  push:
    branches: [drumscribe-v2-eval]
    paths:
      - "drumscribe/experiments/open_hat_drumsep_teacher.py"
      - ".github/workflows/drumscribe-open-hat-drumsep-teacher.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install numpy scipy mdxnet-infer
      - name: Run DrumSep hi-hat teacher diagnostic
        run: python drumscribe/experiments/open_hat_drumsep_teacher.py
      - name: Commit diagnostic result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/experiments/results-open-hat-drumsep-teacher.json
          git commit -m "Record DrumSep hi-hat teacher diagnostic [skip ci]" || exit 0
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin drumscribe-v2-eval
            if git push origin HEAD:drumscribe-v2-eval; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
