name: DrumScribe arrangement domain calibration v45

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "drumscribe/experiments/evaluate_arrangement_domain_calibration_v45.py"
      - "drumscribe/experiments/results-arrangement-kst-candidates-v44.json"
      - ".github/workflows/drumscribe-arrangement-domain-calibration-v45.yml"

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install mido numpy scikit-learn
      - name: Evaluate song-local E-GMD calibration
        run: python drumscribe/experiments/evaluate_arrangement_domain_calibration_v45.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/experiments/results-arrangement-domain-calibration-v45.json
          git add drumscribe/experiments/ARRANGEMENT_DOMAIN_CALIBRATION_V45.md
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "drumscribe: record arrangement domain calibration v45"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: drumscribe-arrangement-domain-calibration-v45
          path: |
            drumscribe/experiments/results-arrangement-domain-calibration-v45.json
            drumscribe/experiments/ARRANGEMENT_DOMAIN_CALIBRATION_V45.md
          retention-days: 14
