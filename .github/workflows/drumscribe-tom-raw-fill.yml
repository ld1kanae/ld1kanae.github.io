name: DrumScribe tom raw fill search

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/iterative_search_tom_raw_fill.py"
      - ".github/workflows/drumscribe-tom-raw-fill.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install numpy scipy
      - name: Run raw tom fill cycles 151 to 153
        run: python drumscribe/experiments/iterative_search_tom_raw_fill.py
      - name: Commit MIDI and metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          git add drumscribe/experiments/generated-search-tom-raw-fill drumscribe/experiments/results-iterative-tom-raw-fill.json
          git diff --cached --quiet && exit 0
          git commit -m "Record raw tom fill PDCA results [skip ci]"
          git push origin HEAD:drumscribe-v2-eval
