name: DruMaster Ranking Deploy

on:
  push:
    branches: [main]
    paths:
      - 'DruMaster-Backend/**'
      - '.github/workflows/drumaster-ranking-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drumaster-ranking-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DruMaster-Backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: DruMaster-Backend/package.json

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing GitHub secret: CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Install Wrangler
        run: npm install

      - name: Apply D1 migrations
        run: npm run d1:migrate:remote

      - name: Deploy Worker
        run: npm run deploy

      - name: Verify production health
        working-directory: .
        shell: bash
        run: |
          for i in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 \
              https://drumaster-ranking-api.aoka45utau.workers.dev/health \
              | tee /tmp/drumaster-ranking-health.json \
              | grep -q '"ok":true'; then
              cat /tmp/drumaster-ranking-health.json
              exit 0
            fi
            sleep 5
          done
          echo 'Production health check failed after deploy.'
          exit 1
