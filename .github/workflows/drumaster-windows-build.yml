name: DruMaster Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - drumaster-pc-web-app-20260831-2351
    paths:
      - 'DruMaster/**'
      - 'DruMaster-App/Windows/**'
      - '.github/workflows/drumaster-windows-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: DruMaster-App/Windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Sync current DruMaster web core
        run: npm run sync:web

      - name: Prepare square D-mark icon source
        shell: pwsh
        run: |
          $src = Get-Content '../../DruMaster/assets/DruMaster-D-white.svg' -Raw
          $src = $src.Replace('viewBox="0 0 130 145"', 'viewBox="-7.5 0 145 145"')
          Set-Content 'DruMaster-D-icon-square.svg' $src -Encoding utf8

      - name: Generate D-mark Windows icons
        run: npx tauri icon DruMaster-D-icon-square.svg

      - name: Build Windows app
        run: npx tauri build

      - name: Prepare direct-download installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not generated' }
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          if ($env:GITHUB_REF_NAME -eq 'drumaster-pc-web-app-20260831-2351') {
            $name = "DruMaster-Windows-2351-$env:GITHUB_RUN_NUMBER-$shortSha-Setup.exe"
          } else {
            $name = "DruMaster-Windows-$env:GITHUB_RUN_NUMBER-$shortSha-Setup.exe"
          }
          Copy-Item $installer.FullName $name
          "INSTALLER_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DruMaster-Windows-${{ github.run_number }}
          path: |
            DruMaster-App/Windows/${{ env.INSTALLER_NAME }}
            DruMaster-App/Windows/src-tauri/target/release/drumaster.exe
          if-no-files-found: error

      - name: Publish direct Windows installer on GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view windows-latest 2>$null) {
            gh release upload windows-latest $env:INSTALLER_NAME
          } else {
            gh release create windows-latest $env:INSTALLER_NAME --title 'DruMaster Windows Latest' --notes 'Latest DruMaster Windows build.'
          }
