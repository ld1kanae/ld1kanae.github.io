name: DruMaster Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'DruMaster/**'
      - 'DruMaster-App/Windows/**'
      - '.github/workflows/drumaster-windows-build.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: DruMaster-App/Windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Sync current DruMaster web core
        run: npm run sync:web

      - name: Generate D-mark Windows icons
        run: npx tauri icon ../../DruMaster/assets/DruMaster-D-white.svg

      - name: Build Windows app
        run: npx tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DruMaster-Windows
          path: |
            DruMaster-App/Windows/src-tauri/target/release/bundle/nsis/*.exe
            DruMaster-App/Windows/src-tauri/target/release/drumaster.exe
          if-no-files-found: error
