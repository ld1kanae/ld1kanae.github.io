name: DrumScribe GMD metal-only repetition decoder

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/browser_gmd_repetition_metal_only.py"
      - ".github/workflows/drumscribe-gmd-repetition-metal-only.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install numpy scipy scikit-learn mido remotezip requests
      - name: Run restricted repetition decoder
        run: python drumscribe/experiments/browser_gmd_repetition_metal_only.py
      - name: Commit benchmark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          git add drumscribe/experiments/results-browser-gmd-repetition-metal-only.json
          git diff --cached --quiet && exit 0
          git commit -m "Record pedal-preserving GMD repetition decoder [skip ci]"
          git push origin HEAD:drumscribe-v2-eval
