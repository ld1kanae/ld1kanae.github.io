name: DrumScribe MDX6 kaiju benchmark

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/benchmark_mdx6_kaiju.py"
      - ".github/workflows/drumscribe-mdx6-kaiju.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU inference stack
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install mdxnet-infer
          pip install --no-deps "git+https://github.com/xavriley/ADTOF-pytorch.git"
          pip install librosa pretty_midi numpy scipy
      - name: Run kaiju MDX6 plus ADTOF benchmark
        run: python drumscribe/experiments/benchmark_mdx6_kaiju.py
      - name: Commit metrics and MIDI only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          git add drumscribe/experiments/generated-mdx6-kaiju.mid drumscribe/experiments/results-mdx6-kaiju.json
          git diff --cached --quiet && exit 0
          git commit -m "Record MDX6 kaiju benchmark [skip ci]"
          git push origin HEAD:drumscribe-v2-eval
