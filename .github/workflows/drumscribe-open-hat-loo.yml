name: DrumScribe open-closed hat LOO

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/open_hat_loo.py"
      - ".github/workflows/drumscribe-open-hat-loo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install numpy scipy scikit-learn
      - name: Run open-closed hi-hat LOO
        run: python drumscribe/experiments/open_hat_loo.py
      - name: Commit benchmark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          git add drumscribe/experiments/results-open-hat-loo.json
          git add drumscribe/experiments/generated-search-open-hat-loo
          git diff --cached --quiet && exit 0
          git commit -m "Record open-closed hi-hat LOO benchmark [skip ci]"
          git push origin HEAD:drumscribe-v2-eval
