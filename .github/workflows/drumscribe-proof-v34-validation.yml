name: DrumScribe Proof v34 five-song validation

on:
  push:
    branches:
      - drumscribe-proof-v34
    paths:
      - "drumscribe/transcribe.js"
      - "drumscribe/gmd-bar-phase.js"
      - "drumscribe/models/gmd-kst/bar-phase-discriminative-v1.json"
      - "drumscribe/app.js"
      - ".github/workflows/drumscribe-proof-v34-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-proof-v34
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          pip install numpy scipy
      - name: Syntax check
        run: |
          node --check drumscribe/transcribe.js
          node --check drumscribe/gmd-bar-phase.js
      - name: Serve repository
        run: |
          python -m http.server 8000 >/tmp/drumscribe-http.log 2>&1 &
          sleep 2
      - name: Generate five fresh MIDI files
        run: node drumscribe/experiments/browser_validate.mjs
      - name: Validate grid and tempo map
        run: python drumscribe/experiments/validate_grid_browser.py
      - name: Score against chart MIDI
        run: python drumscribe/experiments/compare_browser.py
      - name: Summarize tempo and bar phase
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in sorted(Path("drumscribe/experiments/generated-v2-browser").glob("*.json")):
              d=json.loads(p.read_text())
              ti=d.get("tempoInfo") or {}
              bi=d.get("barPhaseInfo") or {}
              print(p.stem, json.dumps({
                  "bpm":d.get("bpm"),
                  "tempo_source":ti.get("source"),
                  "initial_bpm":ti.get("initialBpm"),
                  "family_bpm":(ti.get("eventFamily") or {}).get("bpm"),
                  "family_margin":ti.get("familyMargin"),
                  "bar_phase":d.get("barPhaseSec"),
                  "bar_source":bi.get("source"),
                  "gmd_accepted":(bi.get("gmdKst") or {}).get("accepted"),
                  "gmd_margin":(bi.get("gmdKst") or {}).get("margin"),
              },ensure_ascii=False))
          PY
      - name: Upload fresh results
        uses: actions/upload-artifact@v4
        with:
          name: proof-v34-five-song
          path: |
            drumscribe/experiments/generated-v2-browser/
            drumscribe/experiments/results-v2-browser.json
            drumscribe/experiments/results-grid-browser-ci.json
          retention-days: 14
