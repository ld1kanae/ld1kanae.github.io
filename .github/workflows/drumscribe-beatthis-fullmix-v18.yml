name: DrumScribe BeatThis fullmix batch v18

on:
  push:
    branches: [drumscribe-v2-eval]
    paths:
      - ".github/workflows/drumscribe-beatthis-fullmix-v18.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Beat This
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install beat-this==1.1.0 soundfile torchcodec
      - name: Analyze fullmix songs
        run: |
          mkdir -p drumscribe/experiments/beatthis-v18
          for song in diamondvirgin kaiju; do
            ffmpeg -y -v error -i "DruMaster/songs/$song/fullmix.mp3" -ar 44100 -ac 2 "/tmp/$song.wav"
            beat_this "/tmp/$song.wav" -o "drumscribe/experiments/beatthis-v18/$song-fullmix.beats" --gpu=-1
            rm "/tmp/$song.wav"
          done
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/experiments/beatthis-v18
          git diff --cached --quiet && exit 0
          git commit -m "Record BeatThis fullmix batch v18 [skip ci]"
          git pull --rebase origin drumscribe-v2-eval
          git push origin HEAD:drumscribe-v2-eval
