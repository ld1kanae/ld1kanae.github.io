name: DrumScribe alternating hi-hat runtime v52

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "drumscribe/transcribe.js"
      - "drumscribe/hat-sequence.js"
      - "drumscribe/experiments/browser_hat_sequence_runtime_v52.mjs"
      - "drumscribe/experiments/evaluate_hat_sequence_runtime_v52.py"
      - ".github/workflows/drumscribe-hat-sequence-runtime-v52.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install dependencies
        run: |
          pip install mido
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve repository
        run: |
          python -m http.server 8000 >/tmp/drumscribe-http.log 2>&1 &
          sleep 2
      - name: Generate default-runtime predictions
        run: node drumscribe/experiments/browser_hat_sequence_runtime_v52.mjs
      - name: Score and assert baseline equality
        run: |
          python drumscribe/experiments/evaluate_hat_sequence_runtime_v52.py
          python - <<'PY'
          import json
          d=json.load(open('drumscribe/experiments/results-hat-sequence-runtime-v52.json'))
          assert d['exactEventEqualityVsV51Off'], d
          for g in ('kick','snare','tom'):
              assert abs(d['deltaVsV51Off'][g])<1e-12, (g,d['deltaVsV51Off'][g])
          PY
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/experiments/results-hat-sequence-runtime-predictions-v52.json
          git add drumscribe/experiments/results-hat-sequence-runtime-v52.json
          git add drumscribe/experiments/HAT_SEQUENCE_RUNTIME_V52.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "drumscribe: record fresh hi-hat runtime v52 results"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: drumscribe-hat-sequence-runtime-v52
          path: |
            drumscribe/experiments/results-hat-sequence-runtime-predictions-v52.json
            drumscribe/experiments/results-hat-sequence-runtime-v52.json
            drumscribe/experiments/HAT_SEQUENCE_RUNTIME_V52.md
          retention-days: 14
