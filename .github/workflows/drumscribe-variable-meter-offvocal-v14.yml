name: DrumScribe variable meter offvocal v14

on:
  push:
    branches: [drumscribe-v2-eval]
    paths:
      - "drumscribe/experiments/variable_meter_offvocal_v14.py"
      - ".github/workflows/drumscribe-variable-meter-offvocal-v14.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mido librosa
      - run: python drumscribe/experiments/variable_meter_offvocal_v14.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/experiments/results-variable-meter-offvocal-v14.json
          git diff --cached --quiet && exit 0
          git commit -m "Record offvocal variable meter v14 results [skip ci]"
          git pull --rebase origin drumscribe-v2-eval
          git push origin HEAD:drumscribe-v2-eval
