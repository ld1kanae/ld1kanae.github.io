name: DrumScribe HF one-to-one open-hat LOO
on:
  push:
    branches: [drumscribe-v2-eval]
    paths:
      - "drumscribe/experiments/open_hat_hf_one2one_loo.py"
      - ".github/workflows/drumscribe-open-hat-hf-one2one-loo.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:\n          ref: ${{ github.sha }}\n          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install numpy scipy scikit-learn requests remotezip
      - name: Run one-to-one HF LOO
        run: python drumscribe/experiments/open_hat_hf_one2one_loo.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/experiments/results-open-hat-hf-one2one-loo.json
          git commit -m "Record one-to-one HF open-hat LOO [skip ci]" || exit 0
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin drumscribe-v2-eval
            if git push origin HEAD:drumscribe-v2-eval; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
