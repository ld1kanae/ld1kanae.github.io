name: DrumScribe current runtime bundle temp v64

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/drumscribe-current-runtime-bundle-temp-v64.yml"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-artifact@v4
        with:
          name: drumscribe-current-runtime-v64
          path: drumscribe
          retention-days: 1
