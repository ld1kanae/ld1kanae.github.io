name: DrumScribe review playback smoke

on:
  push:
    branches: [main]
    paths:
      - "drumscribe/review.html"
      - "drumscribe/review.js"
      - "drumscribe/review-manifest.json"
      - "drumscribe/experiments/review_playback_smoke.mjs"
      - ".github/workflows/drumscribe-review-playback.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Wait for GitHub Pages deployment
        run: |
          for i in $(seq 1 90); do
            if curl -fsSL "https://ld1kanae.github.io/drumscribe/review.html?ci=$GITHUB_SHA" | grep -q "review.js?v=20260923-c225-227-fix2"; then
              exit 0
            fi
            sleep 2
          done
          echo "latest review page was not deployed" >&2
          exit 1
      - name: Verify MIDI playback on live GitHub Pages
        env:
          DRUMSCRIBE_REVIEW_URL: "https://ld1kanae.github.io/drumscribe/review.html?ci=${{ github.sha }}"
        run: node drumscribe/experiments/review_playback_smoke.mjs
