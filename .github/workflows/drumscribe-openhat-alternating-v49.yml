name: DrumScribe alternating hi-hat v49

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/drumscribe-openhat-alternating-v49.yml"
      - "drumscribe/experiments/patch_openhat_alternating_v49.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply research-only articulation variants
        run: |
          python drumscribe/experiments/patch_openhat_alternating_v49.py
          node --check drumscribe/open-hat.js
      - name: Install validation dependencies
        run: |
          pip install mido
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve repository
        run: |
          python -m http.server 8000 >/tmp/drumscribe-http.log 2>&1 &
          sleep 2
      - name: Generate current and three alternating variants
        run: |
          cp drumscribe/experiments/browser_validate_openhat_variants.mjs /tmp/browser_alt.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/browser_alt.mjs');s=p.read_text()
          s=s.replace("const variants=['base','decay','gmd-rescue','decay-rescue','ride-open','ride-acoustic','ride-decay','ride-open-decay-rescue'];",
            "const variants=['ride-open-decay-rescue','ride-open-decay-rescue-alt-strict','ride-open-decay-rescue-alt-local','ride-open-decay-rescue-alt-global'];")
          s=s.replace("const root='drumscribe/experiments/generated-openhat-v40';",
            "const root='drumscribe/experiments/generated-openhat-alternating-v49';")
          p.write_text(s)
          PY
          node /tmp/browser_alt.mjs
      - name: Score five-song non-regression
        run: |
          cp drumscribe/experiments/compare_openhat_variants.py /tmp/compare_alt.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/compare_alt.py');s=p.read_text()
          s=s.replace('VARIANTS=["base","decay","gmd-rescue","decay-rescue","ride-open","ride-acoustic","ride-decay","ride-open-decay-rescue"]',
            'VARIANTS=["ride-open-decay-rescue","ride-open-decay-rescue-alt-strict","ride-open-decay-rescue-alt-local","ride-open-decay-rescue-alt-global"]')
          s=s.replace('generated-openhat-v40','generated-openhat-alternating-v49')
          s=s.replace('report["variants"]["base"]["summary"]','report["variants"]["ride-open-decay-rescue"]["summary"]')
          s=s.replace('results-openhat-v40.json','results-openhat-alternating-v49.json')
          s=s.replace('open-hat v40 real-browser variants','open-hat alternating v49 real-browser variants')
          p.write_text(s)
          PY
          python /tmp/compare_alt.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('drumscribe/experiments/results-openhat-alternating-v49.json')
          d=json.loads(p.read_text())
          lines=['# Open/Closed Hi-Hat alternating v49','',
            'Five-song fresh Chromium comparison. Reference chart.mid is used only after browser prediction.','',
            '| variant | HH macro F1 | Closed F1 | Open F1 | Kick delta | Snare delta | Tom delta |',
            '|---|---:|---:|---:|---:|---:|---:|']
          for k,v in d['variants'].items():
            s=v['summary'];x=v['deltaVsBase']
            lines.append(f"| {k} | {s['macroHatF1']:.6f} | {s['closed']['f1']:.6f} | {s['open']['f1']:.6f} | {x['kickF1']:+.6f} | {x['snareF1']:+.6f} | {x['tomF1']:+.6f} |")
          lines += ['', '## Guardrails','',
            '- All variants preserve hat onset times and only change GM42/GM46 articulation.',
            '- Existing Ride→Open policy is held constant across all four variants.',
            '- Production default is not changed by this experiment.',
            '- Adoption requires individual Kick/Snare/Tom non-regression and improved five-song HH macro F1.','']
          Path('drumscribe/experiments/OPENHAT_ALTERNATING_V49.md').write_text('\n'.join(lines))
          PY
      - name: Commit research code and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/open-hat.js
          git add drumscribe/experiments/results-openhat-alternating-v49.json
          git add drumscribe/experiments/OPENHAT_ALTERNATING_V49.md
          git add drumscribe/experiments/generated-openhat-alternating-v49
          git commit -m "drumscribe: evaluate relative-decay alternating hi-hat v49"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: drumscribe-openhat-alternating-v49
          path: |
            drumscribe/experiments/results-openhat-alternating-v49.json
            drumscribe/experiments/OPENHAT_ALTERNATING_V49.md
          retention-days: 14
