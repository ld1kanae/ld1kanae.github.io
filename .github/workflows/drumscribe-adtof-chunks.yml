name: DrumScribe ADTOF chunk benchmark

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/benchmark_adtof_chunks.py"
      - ".github/workflows/drumscribe-adtof-chunks.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install --no-deps "git+https://github.com/xavriley/ADTOF-pytorch.git"
          pip install librosa pretty_midi numpy onnxruntime
      - name: Benchmark chunked ADTOF inference
        run: python drumscribe/experiments/benchmark_adtof_chunks.py
      - name: Commit benchmark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          git add drumscribe/experiments/results-adtof-chunk-benchmark.json
          git diff --cached --quiet && exit 0
          git commit -m "Record ADTOF chunk benchmark [skip ci]"
          git push origin HEAD:drumscribe-v2-eval
