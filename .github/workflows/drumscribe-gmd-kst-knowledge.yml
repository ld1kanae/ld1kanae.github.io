name: DrumScribe GMD KST knowledge build

on:
  workflow_dispatch:
  push:
    branches:
      - drumscribe-gmd-kst-section-v1-20260923
    paths:
      - "drumscribe/experiments/gmd-kst/**"
      - "drumscribe/section-analysis.js"
      - "drumscribe/gmd-kst-prior.js"
      - ".github/workflows/drumscribe-gmd-kst-knowledge.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install MIDI dependency
        run: pip install mido
      - name: Build train-only genre knowledge
        run: |
          python drumscribe/experiments/gmd-kst/build_gmd_kst_knowledge.py \
            --output-dir drumscribe/models/gmd-kst
      - name: Verify generated files
        run: |
          test -s drumscribe/models/gmd-kst/knowledge-v1.json
          test -s drumscribe/models/gmd-kst/heldout-manifest-v1.json
          test -s drumscribe/models/gmd-kst/manifest-v1.json
          python -m json.tool drumscribe/models/gmd-kst/knowledge-v1.json >/dev/null
          python -m json.tool drumscribe/models/gmd-kst/heldout-manifest-v1.json >/dev/null
      - name: Test section and prior modules
        run: |
          node --check drumscribe/section-analysis.js
          node --check drumscribe/gmd-kst-prior.js
          node drumscribe/experiments/gmd-kst/test_section_analysis.mjs
          node drumscribe/experiments/gmd-kst/test_gmd_kst_prior.mjs
      - name: Analyze five real off-vocal references
        run: |
          ffmpeg -version | head -n 1
          node drumscribe/experiments/gmd-kst/analyze_example_offvocals.mjs
          test -s drumscribe/experiments/gmd-kst/results-offvocal-sections-v1.json
      - name: Commit derived knowledge to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/models/gmd-kst/knowledge-v1.json \
                  drumscribe/models/gmd-kst/heldout-manifest-v1.json \
                  drumscribe/models/gmd-kst/manifest-v1.json
          if git diff --cached --quiet; then
            echo "Knowledge files unchanged."
          else
            git commit -m "drumscribe: build GMD KST knowledge v1"
            git push
          fi
      - name: Upload generated knowledge
        uses: actions/upload-artifact@v4
        with:
          name: drumscribe-gmd-kst-knowledge-v1
          path: |
            drumscribe/models/gmd-kst/knowledge-v1.json
            drumscribe/models/gmd-kst/heldout-manifest-v1.json
            drumscribe/models/gmd-kst/manifest-v1.json
            drumscribe/experiments/gmd-kst/results-offvocal-sections-v1.json
          retention-days: 30
