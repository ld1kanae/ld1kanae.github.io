name: DrumScribe BPM estimation v2

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/estimate_bpm_v2.py"
      - ".github/workflows/drumscribe-bpm-estimation-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bpm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install numpy scipy
      - name: Estimate BPM from drums only
        run: python drumscribe/experiments/estimate_bpm_v2.py
      - name: Commit benchmark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          git add drumscribe/experiments/results-bpm-estimation-v2.json
          git diff --cached --quiet && exit 0
          git commit -m "Record BPM v2 benchmark [skip ci]"
          git push origin HEAD:drumscribe-v2-eval
