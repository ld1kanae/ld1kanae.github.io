name: DrumScribe browser hat nested LOO

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/browser_hat_meta_nested_loo.py"
      - ".github/workflows/drumscribe-browser-hat-meta-nested-loo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install numpy scipy scikit-learn
      - name: Run fully nested LOO browser hat suppressor
        run: python drumscribe/experiments/browser_hat_meta_nested_loo.py
      - name: Commit benchmark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          git add drumscribe/experiments/results-browser-hat-meta-nested-loo.json
          git diff --cached --quiet && exit 0
          git commit -m "Record fully nested browser hat meta benchmark [skip ci]"
          git push origin HEAD:drumscribe-v2-eval
