name: DrumScribe v2 evaluation

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/evaluate_v2.py"
      - "drumscribe/experiments/evaluate_ml.py"
      - ".github/workflows/drumscribe-v2-eval.yml"
  pull_request:
    branches:
      - main
    paths:
      - "drumscribe/experiments/evaluate_v2.py"
      - "drumscribe/experiments/evaluate_ml.py"
      - ".github/workflows/drumscribe-v2-eval.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install numpy scipy
      - name: Run leave-one-song-out learning experiment
        run: |
          python drumscribe/experiments/evaluate_ml.py \
            --repo-root . \
            --output drumscribe/experiments/results-ml-loo.json
      - name: Commit evaluation results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/experiments/results-ml-loo.json
          git diff --cached --quiet && exit 0
          git commit -m "Record DrumScribe ML leave-one-out results [skip ci]"
          git pull --rebase origin drumscribe-v2-eval
          git push origin HEAD:drumscribe-v2-eval
