name: DrumScribe ultra ADTOF GMD tatum probe

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/adtof_gmd_tatum_metal_decoder_ultra.py"
      - ".github/workflows/drumscribe-adtof-gmd-tatum-ultra.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU inference stack
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install --no-deps "git+https://github.com/xavriley/ADTOF-pytorch.git"
          pip install librosa pretty_midi numpy scipy scikit-learn mido remotezip requests
      - name: Run ultra tatum probe
        run: python drumscribe/experiments/adtof_gmd_tatum_metal_decoder_ultra.py
      - name: Commit benchmark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          git add drumscribe/experiments/results-adtof-gmd-tatum-metal-decoder-ultra.json
          git diff --cached --quiet && exit 0
          git commit -m "Record ultra ADTOF GMD tatum probe [skip ci]"
          git push origin HEAD:drumscribe-v2-eval
