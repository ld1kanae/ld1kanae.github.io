name: DrumScribe component merge v7

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/iterative_search_component_merge_v7.py"
      - ".github/workflows/drumscribe-component-merge-v7.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy scipy
      - name: Run component merge cycles 193 to 194
        run: python drumscribe/experiments/iterative_search_component_merge_v7.py
      - name: Commit MIDI and metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          git add drumscribe/experiments/generated-search-component-merge-v7 drumscribe/experiments/results-iterative-component-merge-v7.json
          git diff --cached --quiet && exit 0
          git commit -m "Record ride pedal component merge results [skip ci]"
          git push origin HEAD:drumscribe-v2-eval
