name: DruMaster Android Debug APK

on:
  push:
    branches:
      - main
      - drumaster-mobile-package-20260831-1537
    paths:
      - 'DruMaster/**'
      - 'DruMaster-App/Android/**'
      - '.github/workflows/drumaster-android-debug.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DruMaster-App/Android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Sync current DruMaster web core
        run: npm run sync:web

      - name: Create Android project
        run: npx cap add android

      - name: Stamp Android build version
        run: |
          VERSION_CODE="$GITHUB_RUN_NUMBER"
          VERSION_NAME="0.1.$GITHUB_RUN_NUMBER"
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          echo "Android versionCode=${VERSION_CODE}, versionName=${VERSION_NAME}"

      - name: Generate D-mark app icon
        run: npm run android:icons

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Prepare direct-download APK
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "$GITHUB_REF_NAME" = "drumaster-mobile-package-20260831-1537" ]; then
            APK_NAME="DruMaster-Android-1537-${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"
          else
            APK_NAME="DruMaster-Android-${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DruMaster-Android-debug-${{ github.run_number }}
          path: DruMaster-App/Android/${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish direct APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest "$APK_NAME"
          else
            gh release create android-latest "$APK_NAME" --title "DruMaster Android Latest" --notes "Latest Android debug build."
          fi
