name: DruMaster Android Debug APK

on:
  push:
    branches:
      - drumaster-android-package
    paths:
      - 'DruMaster/**'
      - 'DruMaster-App/Android/**'
      - '.github/workflows/drumaster-android-debug.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DruMaster-App/Android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Sync current DruMaster web core
        run: npm run sync:web

      - name: Create Android project
        run: npx cap add android

      - name: Generate D-mark app icon
        run: npm run android:icons

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DruMaster-Android-debug
          path: DruMaster-App/Android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
