name: DrumScribe snare safe fusion

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/iterative_search_snare_safe_fusion.py"
      - ".github/workflows/drumscribe-snare-safe-fusion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy scipy
      - name: Run safe snare cycles 112 to 114
        run: python drumscribe/experiments/iterative_search_snare_safe_fusion.py
      - name: Commit MIDI and metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          git add drumscribe/experiments/generated-search-snare-safe-fusion drumscribe/experiments/results-iterative-snare-safe-fusion.json
          git diff --cached --quiet && exit 0
          git commit -m "Record safe snare fusion PDCA results [skip ci]"
          git push origin HEAD:drumscribe-v2-eval
