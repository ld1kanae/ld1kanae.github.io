name: DrumScribe alternating hi-hat review v51

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "drumscribe/hat-sequence.js"
      - "drumscribe/models/alternating-hi-hat-review-v1.json"
      - "drumscribe/experiments/browser_hat_sequence_review_v51.mjs"
      - "drumscribe/experiments/evaluate_hat_sequence_review_v51.py"
      - ".github/workflows/drumscribe-hat-sequence-v51.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install dependencies
        run: |
          pip install mido
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve repository
        run: |
          python -m http.server 8000 >/tmp/drumscribe-http.log 2>&1 &
          sleep 2
      - name: Generate five-song predictions
        run: node drumscribe/experiments/browser_hat_sequence_review_v51.mjs
      - name: Score after prediction
        run: python drumscribe/experiments/evaluate_hat_sequence_review_v51.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/experiments/results-hat-sequence-predictions-v51.json
          git add drumscribe/experiments/results-hat-sequence-v51.json
          git add drumscribe/experiments/HAT_SEQUENCE_REVIEW_V51.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "drumscribe: record inversion-gated hi-hat v51 results"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: drumscribe-hat-sequence-v51
          path: |
            drumscribe/experiments/results-hat-sequence-predictions-v51.json
            drumscribe/experiments/results-hat-sequence-v51.json
            drumscribe/experiments/HAT_SEQUENCE_REVIEW_V51.md
          retention-days: 14
