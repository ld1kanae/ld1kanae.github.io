name: DrumScribe cymbal template v2

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/iterative_search_cymbal_template_v2.py"
      - ".github/workflows/drumscribe-cymbal-template-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install numpy scipy
      - name: Run cymbal template cycles 198 to 200
        run: python drumscribe/experiments/iterative_search_cymbal_template_v2.py
      - name: Commit MIDI and metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          git add drumscribe/experiments/generated-search-cymbal-template-v2 drumscribe/experiments/results-iterative-cymbal-template-v2.json
          git diff --cached --quiet && exit 0
          git commit -m "Record sample-template cymbal results [skip ci]"
          git push origin HEAD:drumscribe-v2-eval
