name: DrumScribe drumsep benchmark

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/iterative_search_drumsep.py"
      - ".github/workflows/drumscribe-drumsep-search.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
          python -m pip install --upgrade pip
          pip install numpy scipy scikit-learn drumsep
      - name: Run true stem-separation search cycles 43 to 45
        run: python drumscribe/experiments/iterative_search_drumsep.py
      - name: Commit separated stems, MIDI, and metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/experiments/drumsep-stems drumscribe/experiments/generated-search-drumsep drumscribe/experiments/results-iterative-drumsep.json
          git diff --cached --quiet && exit 0
          git commit -m "Record DrumScribe true separation results [skip ci]"
          git pull --rebase origin drumscribe-v2-eval
          git push origin HEAD:drumscribe-v2-eval
