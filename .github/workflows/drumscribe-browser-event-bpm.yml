name: DrumScribe browser event BPM

on:
  push:
    branches:
      - drumscribe-v2-eval
    paths:
      - "drumscribe/experiments/benchmark_browser_event_bpm.py"
      - ".github/workflows/drumscribe-browser-event-bpm.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy scipy
      - name: Benchmark event BPM
        run: python drumscribe/experiments/benchmark_browser_event_bpm.py
      - name: Commit benchmark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-v2-eval
          git add drumscribe/experiments/results-browser-event-bpm.json
          git diff --cached --quiet && exit 0
          git commit -m "Record browser event BPM benchmark [skip ci]"
          git push origin HEAD:drumscribe-v2-eval
