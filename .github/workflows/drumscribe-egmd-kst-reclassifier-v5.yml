name: DrumScribe E-GMD KST reclassifier v5

on:
  push:
    branches:
      - drumscribe-egmd-kst-v5-eval
    paths:
      - "drumscribe/experiments/train_egmd_kst_reclassifier_v5.py"
      - ".github/workflows/drumscribe-egmd-kst-reclassifier-v5.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-egmd-kst-v5-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU inference stack
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install --no-deps "git+https://github.com/xavriley/ADTOF-pytorch.git"
          pip install librosa pretty_midi numpy scipy scikit-learn mido remotezip requests
      - name: Train expanded E-GMD v5 hypotheses
        run: python drumscribe/experiments/train_egmd_kst_reclassifier_v5.py
      - name: Commit frozen external model and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin drumscribe-egmd-kst-v5-eval
          git add drumscribe/models/egmd-kst-reclassifier-v5.json             drumscribe/experiments/results-egmd-kst-reclassifier-v5.json
          git diff --cached --quiet && exit 0
          git commit -m "Record expanded E-GMD KST v5 benchmark [skip ci]"
          git push origin HEAD:drumscribe-egmd-kst-v5-eval
