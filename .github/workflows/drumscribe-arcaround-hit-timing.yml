name: DrumScribe arcaround hit timing diagnostic

on:
  push:
    branches: [drumscribe-v2-eval]
    paths:
      - "drumscribe/experiments/arcaround_hit_timing_diagnostic.py"
      - ".github/workflows/drumscribe-arcaround-hit-timing.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drumscribe-v2-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mido numpy
      - run: python drumscribe/experiments/arcaround_hit_timing_diagnostic.py
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drumscribe/experiments/arcaround-hit-timing-diagnostic.json
          git diff --cached --quiet && exit 0
          git commit -m "Record arcaround hit timing diagnostic [skip ci]"
          git pull --rebase origin drumscribe-v2-eval
          git push origin HEAD:drumscribe-v2-eval
