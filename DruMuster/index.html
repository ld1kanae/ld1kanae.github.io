<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#080b11">
  <title>DruMaster</title>
  <link rel="stylesheet" href="styles.css?v=20260825-mobileframe1">
  <link rel="stylesheet" href="game-ui.css?v=20260825-fx2">
  <link rel="stylesheet" href="mobile-game-fix.css?v=20260825-ui5">
  <link rel="stylesheet" href="judgement-ui-fix.css?v=20260825-judge9">
  <link rel="stylesheet" href="layout-polish-fix.css?v=20260825-layout8">
</head>
<body>
  <main id="app">
    <section id="setup" class="screen setup">
      <div class="brand"><span>Dru</span><b>Master</b></div>
      <p class="eyebrow">DRUM RHYTHM GAME</p>
      <div class="song-card">
        <div class="disc">7</div>
        <div><h1>なないろ</h1><p>BUMP OF CHICKEN</p></div>
      </div>
      <div class="options">
        <label class="option"><span>ボーカル</span><input id="vocalToggle" type="checkbox" checked><i></i><b>ON</b></label>
        <label class="option"><span>ガイドドラム</span><input id="guideToggle" type="checkbox"><i></i><b>OFF</b></label>
        <label class="option"><span>オートプレイ</span><input id="autoToggle" type="checkbox"><i></i><b>OFF</b></label>
      </div>
      <div class="tempo-box">
        <div><span>TEMPO</span><strong id="tempoValue">100%</strong></div>
        <input id="tempo" type="range" min="80" max="120" step="5" value="100">
        <div class="scale"><span>80%</span><span>100%</span><span>120%</span></div>
      </div>
      <p id="loadState">曲データを読み込み中…</p>
      <button id="start" disabled>START</button>
      <p class="hint">最初のタップで音声を有効にします</p>
    </section>

    <section id="game" class="screen game hidden">
      <header><div class="rank">D</div><div class="song-hud"><b>なないろ</b><small>BUMP OF CHICKEN</small></div><div class="score"><small>SCORE</small><strong id="score">000000</strong></div><button id="pause" aria-label="再生を停止">Ⅱ</button></header>
      <div id="chartWrap">
        <canvas id="chart"></canvas>
        <div id="judgementFx"><div class="shock"></div><div class="particles"></div><div id="judge"></div></div>
      </div>
      <div id="kit" aria-label="ドラムセット">
        <img class="kit-art" src="assets/drum-kit.webp" alt="" draggable="false">
        <div class="dim-layer"><i data-shade="crash"></i><i data-shade="hh"></i><i data-shade="ride"></i><i data-shade="highTom"></i><i data-shade="midTom"></i><i data-shade="snare"></i><i data-shade="floorTom"></i></div>
        <div id="hitLayer">
          <button class="hit crash left" data-part="crash" data-key="W" aria-label="左上シンバル（W・Eキー）"><kbd>W</kbd></button>
          <button class="hit crash right" data-part="crash" data-key="Y" aria-label="右上シンバル（Y・Uキー）"><kbd>Y</kbd></button>
          <button class="hit hh" data-part="hh" data-key="A" aria-label="ハイハット（A・Sキー）"><kbd>A</kbd></button>
          <button class="hit ride" data-part="ride" data-key="J" aria-label="ライド（J・Kキー）"><kbd>J</kbd></button>
          <button class="hit high" data-part="highTom" data-key="D" aria-label="左タム（D・Fキー）"><kbd>D</kbd></button>
          <button class="hit mid" data-part="midTom" data-key="G" aria-label="右タム（G・Hキー）"><kbd>G</kbd></button>
          <button class="hit snare" data-part="snare" data-key="Z" aria-label="スネア（Z・Xキー）"><kbd>Z</kbd></button>
          <button class="hit floor" data-part="floorTom" data-key="B" aria-label="右下タム（B・Nキー）"><kbd>B</kbd></button>
          <button class="hit special" data-part="special" aria-label="特殊打楽器"><span>◇</span></button>
        </div>
      </div>
      <div id="kickFx"></div>
      <div id="pausePanel" class="hidden"><p>PAUSED</p><button id="resume">再開</button><button id="quit">曲を終了</button></div>
    </section>

    <section id="result" class="screen result hidden">
      <p class="eyebrow">RESULT</p><h2>なないろ</h2>
      <strong id="finalScore">000000</strong>
      <div class="grades"><p><span>PERFECT</span><b id="perfectCount">0</b></p><p><span>GREAT</span><b id="greatCount">0</b></p><p><span>GOOD</span><b id="goodCount">0</b></p><p><span>MISS</span><b id="missCount">0</b></p></div>
      <p>BEST <b id="bestScore">000000</b></p>
      <button id="retry">RETRY</button>
    </section>
  </main>
  <script src="chart-core.js?v=20260825-chartcore9"></script>
  <script src="manifest-fallback.js?v=20260825-manifest1"></script>
  <script src="app.js"></script>
  <script src="sound-fix.js?v=20260825-audiofix3"></script>
  <script src="game-speed-fix.js?v=20260825-sharedchart1"></script>
  <script src="chart-resize-fix.js?v=20260825-chartsize2"></script>
  <script src="control-polish-fix.js?v=20260825-controls4"></script>
  <script src="judgement-lane-fix.js?v=20260825-lanejudge7"></script>
</body>
</html>
