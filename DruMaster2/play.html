<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05070a">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<title>DruMaster2</title>
<link rel="stylesheet" href="styles.css?v=22">
</head>
<body>
<main class="app">
<section id="setupScreen" class="setup-screen">
  <div class="setup-card">
    <div class="setup-brand">DruMaster<span>2</span></div>
    <div class="setup-song"><small>SONG</small><h1>なないろ</h1></div>
    <div class="setup-options">
      <label class="setup-option"><span><b>ボーカル</b><small>ボーカルトラック</small></span><input id="vocalsToggle" type="checkbox" checked><i></i></label>
      <label class="setup-option"><span><b>ガイドドラム</b><small>原曲ドラムを重ねる</small></span><input id="guideToggle" type="checkbox"><i></i></label>
      <label class="setup-option"><span><b>オートプレイ</b><small>操作パートを自動演奏</small></span><input id="autoToggle" type="checkbox"><i></i></label>
    </div>
    <div class="tempo-box">
      <div class="tempo-title"><span>TEMPO</span><strong id="tempoValue">100%</strong></div>
      <input id="tempoRange" type="range" min="80" max="120" step="5" value="100">
      <div class="tempo-scale"><span>80%</span><span>100%</span><span>120%</span></div>
    </div>
    <div id="setupLoadState" class="setup-load">音源を確認中…</div>
    <button id="setupStart" class="setup-start">START</button>
  </div>
</section>
<header class="topbar"><div class="brand">DruMaster<span>2</span></div><div class="song"><b>なないろ</b><small id="timeText">0:00 / 4:23</small></div><div class="score"><small>SCORE</small><b id="scoreText">0000000</b><em id="comboText">0 COMBO · BEST 0000000</em></div><button id="settingsBtn" class="gear" aria-label="設定">⚙</button></header>
<section id="stage" class="stage">
  <div class="chart-panel" aria-hidden="true"></div>
  <div id="laneField" class="lane-field"><div class="lane l1"></div><div class="lane l2"></div><div class="lane l3"></div><div class="lane l4"></div><div class="judge-line"><i></i></div><div id="notesLayer" class="notes"></div><div id="judgeText" class="judge"></div></div>
  <div class="kit" aria-label="ドラムセット">
    <img class="kit-art" src="assets/drum-kit.webp?v=22" alt="" draggable="false">
    <div class="dim-layer" aria-hidden="true"><i class="shade rack-left"></i><i class="shade rack-right"></i><i class="shade kick"></i><i class="shade ride"></i><i class="shade floor"></i></div>
    <div class="touch crash-left" data-hit="49" aria-label="Crash"></div><div class="touch crash-right" data-hit="49" aria-label="Crash"></div><div class="touch hh-closed" data-hit="42" aria-label="Closed Hi-Hat"></div><div class="touch hh-open" data-hit="46" aria-label="Open Hi-Hat"></div><div class="touch snare-zone" data-hit="38" aria-label="Snare"></div>
  </div>
  <div class="keys"><span><kbd>F</kbd>SNARE</span><span><kbd>J</kbd>HH</span><span><kbd>K</kbd>OPEN HH</span><span><kbd>L</kbd>CRASH</span></div><div class="status"><span id="audioState">音源確認中…</span><span id="offsetText">OFFSET 0ms</span></div>
</section>
<footer class="controls"><button id="playBtn" class="primary">▶ START</button><button id="pauseBtn" disabled>Ⅱ</button><button id="restartBtn">↺</button></footer>
</main>
<dialog id="settingsDialog"><form method="dialog" class="settings-card"><header><div><h2>SETTINGS</h2><p>詳細設定</p></div><button value="cancel" aria-label="閉じる">×</button></header><div class="settings-scroll"><label class="range"><span>NOTE SPEED <b id="speedValue">2.4s</b></span><input id="speedRange" type="range" min="1.4" max="4" step=".1" value="2.4"></label><label class="range"><span>JUDGE OFFSET <b id="offsetValue">0ms</b></span><input id="offsetRange" type="range" min="-200" max="200" step="5" value="0"></label><details class="assets"><summary>LOCAL AUDIO / DEBUG</summary><p>GitHub音源がない場合のみ、一時的に端末の音源を使用できます。</p><label>伴奏<input id="localOffvocal" type="file" accept="audio/*"></label><label>ボーカル<input id="localVocals" type="file" accept="audio/*"></label><label>ガイドドラム<input id="localGuide" type="file" accept="audio/*"></label><label>ドラム音源<input id="localDrumSprite" type="file" accept="audio/*"></label></details></div><button class="done" value="default">DONE</button></form></dialog>
<script src="chart.js?v=22"></script><script src="app.js?v=22"></script>
</body></html>
